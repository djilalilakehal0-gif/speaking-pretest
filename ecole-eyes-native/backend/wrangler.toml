name = "ecole-eyes-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"

# Request logs without content (Workers Logs). Set alerts in Cloudflare: Notifications -> Workers.
[observability]
enabled = true

# Each IP may send at most 20 AI requests per minute (a conversation turn is 1-3 requests).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# After `npx wrangler deploy`:
#   npx wrangler secret put APP_TOKEN             # any long random string; also put it in the app (ecoleEyesAppToken)
#   npx wrangler secret put ANTHROPIC_API_KEY     # default provider
# Or use any OpenAI-compatible provider instead (see .dev.vars.example):
#   [vars] PROVIDER = "openai", OPENAI_BASE_URL = "...", OPENAI_MODEL = "..."  +  npx wrangler secret put OPENAI_API_KEY
