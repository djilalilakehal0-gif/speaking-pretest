<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Flow Demo</title>
<link rel="stylesheet" href="step-window.css">
<link rel="stylesheet" href="pt.css">
<style>
:root{--hd-font:Readex,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#070a18;color:#c8cde6;font-family:Readex,system-ui,sans-serif}
main.wrap{width:min(1040px,100% - 32px);margin:0 auto;padding:48px 0}
h1.page{font-size:clamp(28px,5vw,44px);margin:0 0 8px;color:#fff;font-weight:600}
p.sub{margin:0 0 28px;color:#a6acc8}
/* the stage around the phone (prefix sf-) */
.sf-bg{position:absolute;inset:0;background:radial-gradient(700px 500px at 20% 0%,#2b2a6e,transparent 60%),radial-gradient(600px 500px at 100% 100%,#1b4a5e,transparent 60%),#0d1124}
.sf-phone{position:absolute;left:120px;top:14px;width:410px;height:722px;padding:10px;border-radius:50px;background:#05060d;box-shadow:0 0 0 2px #2a2d44,0 30px 80px rgba(0,0,0,.6)}
.sf-phone .pt{position:relative;width:390px;height:702px;border-radius:40px;overflow:hidden;transform:translateZ(0);isolation:isolate}
.sf-phone .pt .app{position:absolute;inset:0 0 auto 0;max-width:none;min-height:0}
.sf-phone .pt *{animation:none!important;transition:none!important}
.sf-phone .pt header.top{position:absolute;top:0;left:0;right:0;z-index:5}
.sf-phone .pt:not(.home) .app{padding-top:96px}
.sf-phone .pt input.focus{background:rgba(255,255,255,.1);border-color:#f5b841;box-shadow:0 0 0 4px rgba(245,184,65,.18)}
.sf-cap{position:absolute;right:90px;top:210px;width:440px;font-family:Readex,system-ui,sans-serif;text-align:right}
.sf-chip{display:inline-block;padding:6px 18px 4px;border:1px solid rgba(245,184,65,.4);border-radius:999px;background:rgba(245,184,65,.14);color:#ffd27a;font-weight:600;font-size:18px}
.sf-cap h2{margin:18px 0 12px;font-size:42px;line-height:1.3;font-weight:600;color:#fff}
.sf-cap p{margin:0;font-size:20px;line-height:1.8;color:#a6acc8}
.sf-fast{position:absolute;left:552px;top:44px;padding:4px 12px 2px;border-radius:999px;background:rgba(245,184,65,.95);color:#1a1530;font-weight:700;font-size:14px;z-index:3;opacity:0}
.sf-audio{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-radius:30px;background:rgba(255,255,255,.08)}
.sf-audio i{width:0;height:0;border-left:10px solid #f1f3fb;border-top:6px solid transparent;border-bottom:6px solid transparent}
.sf-audio b{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.sf-audio span{font-size:12px;color:#a6acc8}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="page">Speaking Pre-Test — student flow</h1>
  <p class="sub">Drawn live in HTML from the app's own markup and styles. Click a step below the window to jump to it.</p>
  <div id="demo"></div>
</main>
<script src="step-window.js"></script>
<script src="markup.js"></script>
<script src="steps.js"></script>
<script>
  window.demo = HTMLDemo.mount(document.getElementById('demo'), {
    steps: STUDENT_STEPS, tabs: ['Speaking Pre-Test'], label: 'Student flow', stageClass: '',
  });
</script>
</body>
</html>
