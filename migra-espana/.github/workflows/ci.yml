name: ci
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: migra-espana/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: migra-espana/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd migra-espana/app && npm ci && npx tsc --noEmit && npx jest
  database:
    runs-on: ubuntu-latest
    services:
      postgres: { image: 'postgres:16', env: { POSTGRES_PASSWORD: pw }, ports: ['5432:5432'], options: >- 
        --health-cmd pg_isready --health-interval 5s --health-retries 10 }
    env: { PGPASSWORD: pw, PGHOST: localhost, PGUSER: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: bash migra-espana/supabase/tests/run-local.sh
