<title>MIGRA ESPAÑA Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f4f6f9;--surface:#fff;--surface2:#eef1f6;--text:#202633;--muted:#5d667a;--border:#dfe4ec;--brand:#101d35;--gold:#c7a45b;--ink:#7a5f22;--ok:#1d7a4d;--warn:#9a6a00;--bad:#a33a3a;--warnbg:#fbf1d9;--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,"Segoe UI",sans-serif;--ar:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--surface:#131f38;--surface2:#192846;--text:#eef1f7;--muted:#a2adc4;--border:#26385c;--ink:#e0c07a;--ok:#62d09a;--warn:#f0c566;--bad:#ef8a8a;--warnbg:#36290a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1426;--surface:#131f38;--surface2:#192846;--text:#eef1f7;--muted:#a2adc4;--border:#26385c;--ink:#e0c07a;--ok:#62d09a;--warn:#f0c566;--bad:#ef8a8a;--warnbg:#36290a;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6}[dir=rtl] body{font-family:var(--ar);line-height:1.85}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0 0 .5em;text-wrap:balance}[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:var(--ar);font-weight:700}h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:clamp(1.4rem,3vw,2rem)}h3{font-size:1.2rem}h4{margin:.9em 0 .2em;font-size:.95rem}
a{color:var(--ink)}p{margin:0 0 1em}ul,ol{padding-inline-start:1.2em;margin:.3em 0 1em}
.in{width:100%;max-width:1100px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:var(--brand);color:#fff;border-bottom:1px solid rgba(199,164,91,.3);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.hdr .in{display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap;padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
.brand{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none;font-family:var(--serif);letter-spacing:.14em;font-weight:600}.brand small{display:block;font:500 .6rem var(--sans);letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
nav{display:flex;gap:2px;margin-inline-start:auto}nav a{color:#dfe5f1;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:.9rem}nav a[aria-current]{background:rgba(199,164,91,.18);color:#fff}
.hdr select,.hdr button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 9px;font:inherit;font-size:.85rem;cursor:pointer;width:auto}.hdr option{color:#101d35}
.hero{background:radial-gradient(900px 400px at 85% -10%,rgba(199,164,91,.22),transparent 60%),linear-gradient(160deg,#0b1426,#182a4d);color:#fff}.hero .in{padding-block:clamp(44px,9vw,110px);max-width:860px;margin-inline:max(0px,calc((100% - 1100px)/2))}.hero h1{color:#fff}.lead{color:#cdd6e6;font-size:1.1rem;max-width:60ch}
.eyebrow{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;font-weight:600}[dir=rtl] .eyebrow{letter-spacing:0}
.btn{display:inline-flex;min-height:44px;align-items:center;padding:10px 20px;border-radius:10px;border:1px solid transparent;font:600 1rem inherit;font-family:inherit;cursor:pointer;text-decoration:none}.btn.gold{background:linear-gradient(#d6b36a,#c7a45b);color:#101d35}.btn.ghost{border-color:currentColor;color:#fff;background:none}.btn.ghost.dk{color:var(--text)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.sec{padding-block:36px}.title{background:var(--brand);color:#fff;padding-block:34px}.title h1{color:#fff;margin:0;font-size:clamp(1.7rem,4vw,2.6rem)}.title p{color:#cdd6e6;margin:.5em 0 0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 8px 24px rgba(16,29,53,.07);min-width:0}a.card{text-decoration:none;color:inherit;display:block}a.card:hover{border-color:var(--gold)}.gold-b{border-color:var(--gold)}
.ico{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--gold);margin-bottom:12px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--surface2);color:var(--muted)}.badge.active{color:var(--ok)}.badge.amended{color:var(--warn)}.badge.under_review{color:var(--bad)}
.note{border-inline-start:4px solid var(--gold);background:var(--warnbg);padding:11px 15px;border-radius:8px;font-size:.92rem}.note.info{background:var(--surface2)}.note.demo{margin-top:20px}
.meta{color:var(--muted);font-size:.86rem}.pending{color:var(--muted);font-style:italic}.prose h3{color:var(--ink);margin-top:1.4em;font-size:1.05rem}
.bar{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e6cb8e)}
input,select{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:44px}.opts{display:grid;gap:9px}.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface);cursor:pointer}.opt input{width:20px;min-height:20px;accent-color:var(--gold)}.opt:has(input:checked){border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,164,91,.3)}
.bucket{border-inline-start:5px solid var(--border)}.bucket.eligible{border-color:var(--ok)}.bucket.needs_info{border-color:var(--warn)}.bucket.not_met{border-color:var(--bad)}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:12px}.steps li{counter-increment:s;display:grid;grid-template-columns:42px 1fr;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}.steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--gold);display:grid;place-items:center;font:700 1.1rem var(--serif)}.steps p{margin:0}
footer{background:var(--brand);color:#b9c3d8;padding-block:26px;font-size:.85rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
<div id="app"></div>
