name: migra_espana
description: MIGRA ESPAÑA mobile app (Android + iOS). Same Supabase backend and web API as the website.
publish_to: none
version: 0.1.0+1
environment: { sdk: ">=3.4.0 <4.0.0" }
dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  intl: ^0.20.3
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^5.0.0
flutter: { uses-material-design: true }
