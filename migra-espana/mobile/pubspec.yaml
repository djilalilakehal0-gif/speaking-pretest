name: migra_espana
description: MIGRA ESPAÑA mobile app (Android + iOS). Offline-capable information and eligibility tools; backend features come next.
publish_to: none
version: 0.1.0+1
environment: { sdk: ">=3.4.0 <4.0.0" }
dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/legal.json
    - assets/i18n/
