# Netlify settings for the DJILALI portfolio (portfolio/), e.g. https://djilali.netlify.app
# Netlify reads this file automatically when the repository is imported.
# The other sites in this repository stay on GitHub Pages.

[build]
  base = "portfolio"
  command = "npm ci && npm run build"
  publish = "out"
  # Only rebuild when something in portfolio/ changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Static export: serve out/ as plain files (no Next.js server runtime needed)
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
