:root{
  --green-900:#0b2f20;--green-800:#11402c;--green-700:#1a5a40;--mint:#cfeee0;--ink:#0d0f0e;
  --n:min(calc(100vw / 1440),calc(100vh / 900));
  --glide:.9s;--ease:cubic-bezier(.2,.8,.2,1);--gl:cubic-bezier(.65,0,.35,1);
  --mbs:.2;--th:180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--green-900)}
body{font-family:'Inter Tight',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,video{-webkit-user-drag:none;user-select:none}

/* ---------- stage + frame ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#0c3523 0%,#14503a 45%,#9fd8bf 100%)}
.frame{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;will-change:transform}
.frame.glide{transition:transform var(--glide) var(--gl),--m0 var(--glide) var(--gl),--mt var(--glide) var(--gl),--mb var(--glide) var(--gl),--ms var(--glide) var(--gl)}
.frame>*{position:absolute}
.plate,.cut{left:0;top:-73.125px;width:1440px;height:956.25px;display:block;pointer-events:none}
.plate{--o:73.125px;--ob:73.125px}
.cut{z-index:4}
.trans{inset:0;width:1440px;height:810px;object-fit:cover;opacity:0;z-index:6;pointer-events:none;--o:0px;--ob:0px}
.caseplate{left:0;top:-105.47px;width:1440px;height:956.25px;opacity:0;z-index:7;pointer-events:none;--o:105.47px;--ob:40.78px}
.plate,.trans,.caseplate{
  -webkit-mask-image:
    linear-gradient(180deg,transparent calc(var(--o,0px) + var(--m0)),rgba(0,0,0,.35) calc(var(--o,0px) + var(--m0) + var(--mt) * .37),#000 calc(var(--o,0px) + var(--m0) + var(--mt)),#000 calc(100% - var(--ob,0px) - var(--mb)),transparent calc(100% - var(--ob,0px))),
    linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(180deg,transparent calc(var(--o,0px) + var(--m0)),rgba(0,0,0,.35) calc(var(--o,0px) + var(--m0) + var(--mt) * .37),#000 calc(var(--o,0px) + var(--m0) + var(--mt)),#000 calc(100% - var(--ob,0px) - var(--mb)),transparent calc(100% - var(--ob,0px))),
    linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  mask-composite:intersect;
}
.frame{--m0:0px;--mt:0px;--mb:0px;--ms:0px}
.frame.d-fade.m-case{--m0:0px;--mt:110px;--mb:60px;--ms:170px}
.frame.m-fade{--m0:0px;--mt:190px;--mb:0px;--ms:140px}
.frame.m-fade.m-case{--m0:48px;--mt:40px;--mb:70px;--ms:140px}

.wm{left:0;top:0;width:1440px;height:260px;overflow:visible;z-index:3;pointer-events:none}
.wm text,.m-wm text{font-family:'Inter Tight',sans-serif;font-weight:900;font-size:268px;letter-spacing:-6px}
.script{top:148px;left:120px;z-index:6;font-family:'Caveat Brush',cursive;font-size:82px;line-height:1;color:#fff;letter-spacing:-.5px;white-space:nowrap;transform:rotate(-8deg);transform-origin:0 50%;text-shadow:0 2px 14px rgba(0,0,0,.18);pointer-events:none}

.badge{position:absolute;left:986px;top:-165px;width:582px;height:1030px;transform-origin:288px 0;z-index:5;pointer-events:none}
.badge>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.card{position:absolute;left:172px;top:536px;width:238px;height:392px;padding:20px 16px 0 16px;color:#141615;font-family:'Inter Tight',sans-serif}
.card h4{font-size:30px;line-height:.95;font-weight:800;letter-spacing:-.5px}
.card .yr{position:absolute;right:16px;top:62px;font-size:11px;font-weight:700}
.card .role{margin-top:12px;padding-top:5px;border-top:1px solid #222;font-size:9.5px;font-weight:700;letter-spacing:.2px}
.card .ph{width:92px;height:112px;margin:12px auto;border-radius:6px;background-color:#dfe4e1;background-repeat:no-repeat;background-size:471px 313px;background-position:-212px -16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;font-weight:700;padding:6px 0 3px;border-bottom:1.5px dotted #333}
.card .row b{font-weight:600}
.badge .hit{position:absolute;left:160px;top:470px;width:262px;height:440px;pointer-events:auto;cursor:grab}

.screen{left:272.8px;top:102.7px;width:894.4px;height:604.7px;border-radius:3px;background:#000;overflow:hidden;opacity:0;z-index:8;pointer-events:none}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0}
.screen::after{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 38%);pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:2}
.screen-hit{left:272.8px;top:102.7px;width:894.4px;height:604.7px;z-index:9;cursor:pointer;display:none}
.is-case .screen-hit{display:block}

/* ---------- viewport UI ---------- */
.ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.ui>*{position:absolute}
.tag{display:inline-flex;align-items:center;height:calc(37 * var(--n));padding:0 calc(18 * var(--n));background:#fff;color:var(--ink);font-family:'Inter Tight',sans-serif;font-weight:650;font-size:calc(16.5 * var(--n));letter-spacing:-.02em;white-space:nowrap;text-decoration:none;pointer-events:auto;cursor:pointer;box-shadow:0 calc(3 * var(--n)) 0 rgba(0,0,0,.18),0 calc(6 * var(--n)) calc(14 * var(--n)) rgba(0,0,0,.18);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tag:hover{transform:translateY(calc(-2 * var(--n))) rotate(-1.5deg);box-shadow:0 calc(5 * var(--n)) 0 rgba(0,0,0,.22),0 calc(10 * var(--n)) calc(18 * var(--n)) rgba(0,0,0,.2)}
.tag:active{transform:translateY(var(--n));box-shadow:0 var(--n) 0 rgba(0,0,0,.18)}
.tag:focus-visible,.logo:focus-visible,.nav-case:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.t1{left:calc(30 * var(--n));top:calc(7 * var(--n))}
.t2{left:calc(233 * var(--n));top:calc(7 * var(--n))}
.t3{right:calc(244 * var(--n));top:calc(7 * var(--n))}
.t4{right:calc(32 * var(--n));top:calc(7 * var(--n))}
.logo{left:50%;top:calc(14 * var(--n));transform:translateX(-50%);font-weight:600;font-size:calc(19 * var(--n));letter-spacing:.14em;color:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
.is-case .logo{opacity:1;pointer-events:auto}

.hint{left:50%;bottom:calc(22 * var(--n));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(10 * var(--n));font-size:calc(12 * var(--n));letter-spacing:.18em;text-transform:uppercase;font-weight:600;opacity:.85;white-space:nowrap}
.hint .drip{position:relative;width:calc(1.5 * var(--n));height:calc(22 * var(--n));background:rgba(255,255,255,.35);overflow:hidden}
.hint .drip::after{content:"";position:absolute;left:0;top:-40%;width:100%;height:40%;background:#fff;animation:drip 1.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes drip{to{top:100%}}
.is-case .hint,.busy .hint{visibility:hidden}

.js .pre{opacity:0}

/* ticket */
.ticket{right:calc(32 * var(--n));top:calc(98 * var(--n));width:calc(348 * var(--n));height:calc(182 * var(--n));background:#fff;color:var(--ink);border-radius:calc(3 * var(--n));box-shadow:0 calc(18 * var(--n)) calc(40 * var(--n)) rgba(0,0,0,.28);padding:calc(26 * var(--n)) calc(34 * var(--n)) 0 calc(44 * var(--n));transform-origin:50% 0;opacity:0}
.ticket .hole{position:absolute;width:calc(21 * var(--n));height:calc(21 * var(--n));border-radius:50%;background:var(--green-800);box-shadow:inset 0 calc(2 * var(--n)) calc(3 * var(--n)) rgba(0,0,0,.35)}
.hole.tl{left:calc(12 * var(--n));top:calc(12 * var(--n))}
.hole.tr{right:calc(12 * var(--n));top:calc(12 * var(--n))}
.hole.bl{left:calc(12 * var(--n));bottom:calc(12 * var(--n))}
.hole.br{right:calc(12 * var(--n));bottom:calc(12 * var(--n))}
.ticket h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:calc(50 * var(--n));line-height:1;letter-spacing:-.01em;white-space:nowrap}
.ticket .rows{margin-top:calc(8 * var(--n))}

      place('case');
      clear(caseplate);
      return done(anim(caseplate,[{opacity:0},{opacity:1}],{duration:500,easing:'ease-out',fill:'forwards'}))
        .then(function(){clear(caseplate);caseplate.style.opacity=1;arriveCase()});
    }
    try{trans.currentTime=0}catch(e){}
    trans.style.opacity=1;
    raf2(function(){plate.style.visibility='hidden'});
    clear(cut);
    anim(cut,[{opacity:1},{opacity:0}],{duration:260,easing:'ease-out',fill:'forwards'});
    glide(1.6);
    place('case');
    return playClip().then(function(){
      trans.pause();
      clear(caseplate);caseplate.style.opacity=1;
      trans.style.opacity=0;
      arriveCase();
    });
  });
}

function arriveCase(){
  mode='case';
  body.classList.add('is-case');
  plate.style.visibility='hidden';
  clear(cut);cut.style.opacity=0;
  clear(screen);screen.style.opacity=1;
  anim(flash,[{opacity:0},{opacity:.55},{opacity:0}],{duration:600,easing:'ease-out',fill:'none'});
  vids.forEach(clear);
  anim(vids[0],[{opacity:0,transform:'scale(1.06)'},{opacity:1,transform:'scale(1)'}],{duration:700});
  playOnly(0);
  caseIn(0,true);
  preload(1);
  setTimeout(function(){setBusy(false);frame.classList.remove('glide')},T(700));
}

/* ---------- switching cases ---------- */
function swapTo(n){
  if(busy||mode!=='case'||n===idx)return;
  setBusy(true);
  var old=vids[idx];
  clear(old);
  var fade=done(anim(old,[{opacity:1},{opacity:0}],{duration:350,fill:'forwards'}));
  Promise.all([caseOut(),fade]).then(function(){
    old.pause();
    idx=n;fillCase(n);
    anim(flash,[{opacity:0},{opacity:.35},{opacity:0}],{duration:420,easing:'ease-out',fill:'none'});
    clear(vids[n]);
    anim(vids[n],[{opacity:0,transform:'scale(1.04)'},{opacity:1,transform:'scale(1)'}],{duration:500});
    playOnly(n);
    caseIn(n,false);
    preload((n+1)%CASES.length);
    setTimeout(function(){setBusy(false)},T(520));
  });
}

/* ---------- back to hero ---------- */
function toHero(){
  if(busy||mode!=='case')return;
  setBusy(true);
  caseOut();
  vids.forEach(function(v){v.pause()});
  clear(screen);
  var sf=anim(screen,[{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});
  done(sf).then(function(){screen.style.opacity=0;clear(screen);vids.forEach(clear)});
  body.classList.remove('is-case');
  mode='hero';
  glide(.9);
  place('hero');
  plate.style.visibility='';
  clear(cut);cut.style.opacity='';
  anim(cut,[{opacity:0},{opacity:1}],{duration:700,delay:150});
  clear(caseplate);caseplate.style.opacity=0;
  selfCancel(anim(caseplate,[{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(12px)'}],{duration:800,easing:GL,fill:'forwards'}));
  clear(plate);
  selfCancel(anim(plate,[{transform:'scale(1.12)',filter:'blur(8px)'},{transform:'scale(1)',filter:'blur(0)'}],{duration:900,easing:EASE}));
  setTimeout(heroIn,T(250));
  setTimeout(function(){setBusy(false);frame.classList.remove('glide')},T(1000));
}

/* ---------- intents ---------- */
function next(){if(mode==='hero')toCase();else swapTo((idx+1)%CASES.length)}
function prev(){if(mode!=='case')return;if(idx===0)toHero();else swapTo(idx-1)}

var wheelLock=false;
window.addEventListener('wheel',function(e){
  e.preventDefault();
  if(Math.abs(e.deltaY)<18||wheelLock)return;
  wheelLock=true;setTimeout(function(){wheelLock=false},900);
  if(e.deltaY>0)next();else prev();
},{passive:false});

var tx=0,ty=0,touching=false;
window.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){touching=false;return}
  touching=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
window.addEventListener('touchend',function(e){
  if(!touching)return;touching=false;
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dy)>=40&&Math.abs(dy)>=Math.abs(dx)){if(dy<0)next();else prev()}
  else if(mode==='case'&&Math.abs(dx)>=40){if(dx<0)next();else prev()}
},{passive:true});

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowDown'||k==='PageDown'||k===' '||k==='Spacebar'){e.preventDefault();next()}
  else if(k==='ArrowUp'||k==='PageUp'){e.preventDefault();prev()}
  else if(k==='ArrowRight'){e.preventDefault();if(mode==='case')next()}
  else if(k==='ArrowLeft'){e.preventDefault();if(mode==='case')prev()}
  else if(k==='Home'||k==='End'){e.preventDefault()}
});

t1.addEventListener('click',function(){toHero()});
t2.addEventListener('click',function(){toCase()});
t3.addEventListener('click',function(e){e.preventDefault()});
t4.addEventListener('click',function(e){e.preventDefault()});
logo.addEventListener('click',function(){toHero()});
prevB.addEventListener('click',prev);
nextB.addEventListener('click',next);
screenHit.addEventListener('click',next);
document.addEventListener('dragstart',function(e){e.preventDefault()});

var rz=0;
window.addEventListener('resize',function(){
  cancelAnimationFrame(rz);
  rz=requestAnimationFrame(function(){frame.classList.remove('glide');place(mode)});
});

/* ---------- boot ---------- */
fillCase(0);
place('hero');
var fontsP=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
Promise.race([Promise.all([fontsP,plateP]),new Promise(function(r){setTimeout(r,2500)})])
  .then(function(){requestAnimationFrame(entrance)});
setTimeout(entrance,4000);
})();
</script>
</body>
</html>
