<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pre-Test Teacher</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teacher">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="icon" href="../img/logo.png">
<style>
@font-face{font-family:Baloo;src:url(../fonts/baloo-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(../fonts/baloo-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(../fonts/baloo-600.woff2) format('woff2');font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(../fonts/baloo-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(../fonts/baloo-800.woff2) format('woff2');font-weight:800 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(../fonts/baloo-ar-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(../fonts/baloo-ar-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(../fonts/baloo-ar-600.woff2) format('woff2');font-weight:600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(../fonts/baloo-ar-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(../fonts/baloo-ar-800.woff2) format('woff2');font-weight:800 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
:root{
  --navy:#1e2156;--navy2:#343a8f;--paper:#fbf6ec;--surface:#fff;--ink:#1d1e38;--slate:#62647f;--line:#ece2cb;
  --accent:#f0b429;--gold:#e9a817;--gold2:#f0b429;--goldbg:#fff3d4;--red:#d64545;--green:#21966a;--coral:#ff7a59;--teal:#22b3a6;
  --shadow:0 10px 28px rgba(30,33,86,.10),0 2px 6px rgba(30,33,86,.05);
  --mut:var(--slate);--card:var(--surface);--bg:var(--paper);
  --font:Baloo,system-ui,sans-serif;--font-ar:Baloo,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;-webkit-font-smoothing:antialiased}
body{padding:0 0 env(safe-area-inset-bottom,0);background:var(--paper) radial-gradient(circle at 1px 1px,rgba(30,33,86,.07) 1px,transparent 0) 0 0/22px 22px}
.ar{font-family:var(--font-ar);direction:rtl;text-align:right;line-height:1.7}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* header: indigo band + stage track */
header.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:calc(14px + env(safe-area-inset-top,0)) 18px 16px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:0 0 30px 30px;box-shadow:0 10px 24px rgba(30,33,86,.22)}
header.top img{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 2px var(--accent)}
header.top .t{font-weight:700;font-size:16px;line-height:1.15;letter-spacing:.2px}
header.top .s{font-size:13px;color:#c6c9f2;line-height:1.3}
header.top .step{font-size:13px;font-weight:800;color:var(--ink);background:linear-gradient(180deg,#ffd166,var(--accent));border-radius:999px;padding:5px 13px 3px;white-space:nowrap;box-shadow:0 3px 0 #c98f0f}
header.top .step:empty{display:none}
.track{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.track i{height:8px;border-radius:8px;background:rgba(255,255,255,.16);transition:background .4s,transform .4s}
.track i.done{background:linear-gradient(90deg,#ffd166,var(--accent))}
.track i.now{background:#fff;transform:scaleY(1.25)}

main{flex:1;padding:22px 16px 34px;display:flex;flex-direction:column;gap:18px}
.screen{display:flex;flex-direction:column;gap:18px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{position:relative;background:var(--surface);border:2px solid #f3ead6;border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;top:-2px;left:28px;right:28px;height:5px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--accent),var(--coral))}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.2px;color:var(--navy)}
h2{font-size:21px;line-height:1.25;font-weight:700;margin:0;color:var(--navy)}
p{margin:0;line-height:1.55}
.mut{color:var(--slate);font-size:15px}

/* about the study */
.about{display:flex;flex-direction:column;gap:10px;background:transparent;border:0;border-top:2px dashed var(--line);border-radius:0;box-shadow:none;padding:20px 2px 4px;font-size:14.5px;color:var(--slate)}
.about::before{display:none}
.about p{line-height:1.65}
.about b{color:var(--ink);font-weight:700}
.about details{border-top:1px dashed var(--line);padding-top:10px}
.about summary{cursor:pointer;color:var(--navy2);font-weight:700;font-size:15px}
.about details p{margin-top:8px;line-height:1.85}

/* buttons: rounded pills with a soft 3D edge */
.btn{appearance:none;border:0;border-radius:999px;padding:16px 22px 14px;font:700 18px var(--font);background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;width:100%;cursor:pointer;box-shadow:0 5px 0 #11133a,0 10px 20px rgba(30,33,86,.18);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #11133a,0 4px 10px rgba(30,33,86,.15)}
.btn.ghost{background:var(--surface);color:var(--navy);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:hover{border-color:var(--navy2);filter:none}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.accent{background:linear-gradient(180deg,#ffd166,var(--accent));color:var(--ink);box-shadow:0 5px 0 #c98f0f,0 10px 20px rgba(240,180,41,.28)}
.btn.accent:active{box-shadow:0 1px 0 #c98f0f}
.btn.small{padding:10px 16px 8px;font-size:15px;width:auto;box-shadow:0 3px 0 #11133a}
.btn:disabled{opacity:.45}
.row{display:flex;gap:12px}
.row>*{flex:1}
input.name{width:100%;padding:15px 20px 13px;border-radius:18px;border:2px solid var(--line);font:600 18px var(--font);background:#fffaf0;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
input.name::placeholder{color:#a9a39a;font-weight:500}
input.name:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 5px rgba(240,180,41,.22)}

/* home */
.hero{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:16px;padding:6px 2px 2px}
.hero img{width:76px;height:76px}
.hero h1{font-size:28px}
.hero .mut{margin-top:4px}
.form{display:flex;flex-direction:column;gap:8px}
.form .lbl{font-weight:700;font-size:17px;margin-top:8px;color:var(--navy)}
.form .lbl:first-child{margin-top:0}
.form .btn{margin-top:12px}

/* questions */
.q{font-size:23px;font-weight:600;line-height:1.45;color:var(--ink);padding:10px 4px 0 32px;position:relative}
.q::before{content:"“";position:absolute;left:-2px;top:-4px;font-size:64px;line-height:1;color:var(--accent);font-weight:800}
.qar{font-size:18px;line-height:1.7;color:var(--slate)}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:18px;color:var(--navy2);min-height:26px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 16px 8px;align-self:center}
.status:empty{display:none}
.ring{position:relative;width:150px;height:150px;margin:6px auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}

/* microphone */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.mic{width:128px;height:128px;border-radius:50%;border:6px solid #fff;background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(240,180,41,.25),0 14px 28px rgba(30,33,86,.25);cursor:pointer;position:relative}
.mic svg{width:52px;height:52px}
.mic.ready{animation:pulse 1.8s infinite}
.mic.rec{background:linear-gradient(160deg,#ef6b6b,var(--red));box-shadow:0 0 0 10px rgba(214,69,69,.16),0 0 0 22px rgba(214,69,69,.07)}
.mic.rec::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(214,69,69,.4);transform:scale(var(--lvl,1));transition:transform .08s}
.mic:disabled{filter:grayscale(.8);opacity:.5;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,180,41,.6),0 14px 28px rgba(30,33,86,.25)}70%{box-shadow:0 0 0 24px rgba(240,180,41,0),0 14px 28px rgba(30,33,86,.25)}100%{box-shadow:0 0 0 0 rgba(240,180,41,0),0 14px 28px rgba(30,33,86,.25)}}
@media (prefers-reduced-motion:reduce){.mic.ready{animation:none}.track i{transition:none}.screen{animation:none}}
.miclabel{font-weight:700;font-size:18px;text-align:center;color:var(--navy)}
.recdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.saved{color:var(--green);font-weight:800;font-size:19px;text-align:center;background:#e7f7ef;border:2px solid #bfe8d3;border-radius:22px;padding:12px 16px 10px;width:100%}
audio{width:100%}

/* pictures & tasks */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pics button{padding:0;border:4px solid #fff;border-radius:22px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.pics button:active{transform:scale(.97)}
.pics button img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pics button.sel,.pics button:focus-visible{border-color:var(--accent)}
.bigpic{width:100%;border-radius:20px;display:block;background:#fff}
.stage{min-height:300px;display:flex;align-items:center;justify-content:center;border-radius:28px;background:#e4e4e4;border:3px solid #fff;box-shadow:var(--shadow)}
.stroop{font-size:56px;font-weight:800;letter-spacing:.5px}
.eqs{background:#f6f3ec;border-radius:20px;padding:22px;font:700 25px/1.9 var(--font);text-align:center;width:100%;font-variant-numeric:tabular-nums}
.white{background:#fff}
.bar{height:10px;border-radius:10px;background:#efe6d2;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--coral));width:0;transition:width .3s;border-radius:10px}

/* saved answers */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:2px solid #f3ead6;border-radius:20px;padding:12px 14px;background:#fffdf8;display:flex;flex-direction:column;gap:8px}
.item .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.item .h small{color:var(--slate);font-weight:500}
.sess{border:2px solid #f3ead6;box-shadow:var(--shadow);border-radius:24px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.score{display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--goldbg);border-radius:16px}
.score label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.score input{width:76px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;font:700 18px var(--font);text-align:center;background:#fff;color:var(--ink)}
.score input:focus{outline:none;border-color:var(--accent)}
.score input.saved-ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(33,150,106,.15)}
.score span{color:var(--slate);font-weight:500}
.auto{display:block;color:#3b4aa8;font-size:14px;margin-top:4px}.au-sum .auto{margin-top:2px}
.acst{background:#eef0fd;border:2px solid #d6daf7;color:#252a6b;border-radius:16px;padding:10px 12px;font-size:15px}
.af{font-style:normal;font-size:13px;color:#3b4aa8;font-weight:700}
.trn{margin-top:6px;font-size:14px}.trn summary{cursor:pointer;color:#3b4aa8;font-weight:700}.trn p{margin:6px 0;color:var(--ink);line-height:1.5}
.items{display:flex;flex-wrap:wrap;gap:4px}.items span{font-size:13px;border-radius:8px;padding:2px 7px}.items .ok{background:#e7f7ef;color:#1a7a55}.items .no{background:#fdecec;color:#b83232}
.sendst{border-radius:20px;padding:13px 16px 11px;font-size:15px;font-weight:700;background:#eef0fd;color:#252a6b;text-align:center;border:2px solid #d6daf7}.sendst.ok{background:#e7f7ef;color:#1a7a55;border-color:#bfe8d3}.sendst.wait{background:#fff6e0;color:#8a6519;border-color:#f6e2ae}
.sc-sum{margin-top:4px;font-size:14px}.sc-sum .graded{color:var(--green);font-weight:700}.sc-sum .ungraded{color:#a5641a;font-weight:500}
.tag{font-size:14px;background:linear-gradient(180deg,#ffe08a,var(--accent));color:#4a3300;border-radius:999px;padding:4px 14px 2px;font-weight:800;box-shadow:0 3px 0 #d39a16;letter-spacing:.2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px 10px;border-radius:999px;font-weight:600;font-size:15px;z-index:9;max-width:90%;box-shadow:0 8px 22px rgba(30,33,86,.3)}

/* ---- welcome screen ---- */
body.home header.top{display:none}
body.home main{padding-top:0}
.welcome{margin:0 -16px;padding:calc(36px + env(safe-area-inset-top,0)) 22px 84px;background:linear-gradient(160deg,var(--navy2) 0%,var(--navy) 70%);color:#fff;text-align:center;position:relative;overflow:hidden;border-radius:0 0 44px 44px}
.welcome::before{content:"";position:absolute;left:50%;top:-140px;width:520px;height:520px;margin-left:-260px;border-radius:50%;border:2px dashed rgba(240,180,41,.22);box-shadow:0 0 0 46px rgba(240,180,41,.04),0 0 0 92px rgba(240,180,41,.03)}
.welcome::after{content:"✦  ✧  ✦";position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0));color:rgba(255,209,102,.5);font-size:14px;letter-spacing:6px}
.welcome>*{position:relative}
.welcome .crest{width:104px;height:104px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 4px var(--accent),0 0 0 10px rgba(240,180,41,.2),0 12px 30px rgba(0,0,0,.3);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.welcome .school{margin-top:16px;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
.welcome h1{color:#fff;font-size:40px;margin-top:2px;letter-spacing:-.3px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.welcome .lead{color:#d2d5f6;font-size:16px;margin-top:4px}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.areas div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;line-height:1.25;color:#e2e4fa}
.areas svg{width:48px;height:48px;padding:12px;border-radius:18px;background:rgba(255,255,255,.1);border:1.5px solid rgba(240,180,41,.35);color:var(--accent)}
.form.lift{margin-top:-58px;position:relative;border-radius:32px;padding:26px 22px 24px;box-shadow:0 20px 44px rgba(30,33,86,.18)}
.teacher-link{align-self:center;width:auto;display:flex;align-items:center;gap:8px;padding:11px 20px 9px;border-radius:999px;font-size:15px;font-weight:700;color:var(--navy);border-color:var(--line);background:#fff}
.teacher-link svg{width:16px;height:16px}

/* ---- finish screen ---- */
.donehero{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;border-radius:32px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 16px 36px rgba(30,33,86,.25)}
.donehero .ok{width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,#ffd166,var(--accent));color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(240,180,41,.22);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.donehero .ok svg{width:38px;height:38px}
.donehero h1{color:#fff;font-size:32px}
.donehero p{color:#d2d5f6}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-inline-end:8px}
.teacher-link:hover{color:var(--navy);border-color:var(--navy2)}

/* ---- celebration (fireworks after each answer) ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.cheer{position:fixed;left:50%;top:38%;z-index:21;pointer-events:none;transform:translate(-50%,-50%);background:#fff;color:var(--navy);border:3px solid var(--accent);border-radius:28px;padding:14px 26px 10px;text-align:center;box-shadow:0 18px 40px rgba(30,33,86,.25);animation:cheer 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
.cheer b{display:block;white-space:nowrap;font-size:30px;font-weight:800;line-height:1.1}
.cheer span{display:block;font-size:20px;font-weight:700;color:var(--gold);direction:rtl}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.prhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prnote{font-size:13px;font-weight:700;color:var(--slate);background:#fff;border:2px dashed var(--line);border-radius:999px;padding:4px 12px 2px}
.prans{display:flex;flex-direction:column;gap:10px;background:#e7f7ef;border:2px solid #bfe8d3;border-radius:24px;padding:16px;color:#1a7a55}
.prans>b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

<div class="toast" id="toast" hidden></div>
<script>
/* ================= DATA ================= */
const Q1 = {en:"Describe your usual school day. Tell me what you do from the time you wake up until you return home.",
  ar:"صف يومك الدراسي المعتاد. أخبرني ماذا تفعل من وقت استيقاظك حتى عودتك إلى البيت."};
const Q2 = {en:"Look at the picture and describe what is happening. Tell me where the people are, what they are doing, and what might happen next.",
  ar:"انظر إلى الصورة وصف ما يحدث. أخبرني أين الأشخاص، وماذا يفعلون، وماذا قد يحدث بعد ذلك."};
const Q3 = {en:"Some students think that students should be allowed to use their phones at school. Do you agree or disagree? Explain why.",
  ar:"يرى بعض الطلاب أنه يجب السماح للطلاب باستخدام هواتفهم في المدرسة. هل توافق أم تعارض؟ اشرح السبب."};
const SCENES=['img/scene1.jpg','img/scene2.jpg','img/scene3.jpg','img/scene4.jpg'];
const STROOP=[["Turquoise","#05defb"],["Blue","#ff0000"],["Bicycle","#ff0000"],["Black","#000000"],["Yellow","#002060"],["Friend","#ffff00"],["Brown","#843c0c"],["Red","#ffff00"],["Music","#002060"],["Grey","#808080"],["Green","#ff0000"],["Garden","#00b050"],["Purple","#7030a0"],["Yellow","#00b050"],["School","#ffff00"],["Pink","#e696e0"],["Blue","#ffff00"],["Pencil","#ff0000"],["Orange","#ff0000"],["Green","#002060"],["Window","#00b050"],["Green","#00b050"],["Red","#00b050"],["Apple","#002060"],["Yellow","#ffff00"],["Yellow","#ff0000"],["Chair","#ffff00"],["Blue","#002060"],["Green","#ffff00"],["Book","#00b050"],["Red","#ff0000"],["Blue","#00b050"],["House","#002060"],["Gold","#b49600"],["Red","#002060"],["Table","#ff0000"]];
const INK={"#05defb":"Turquoise","#ff0000":"Red","#000000":"Black","#002060":"Blue","#ffff00":"Yellow","#843c0c":"Brown","#808080":"Grey","#00b050":"Green","#7030a0":"Purple","#e696e0":"Pink","#b49600":"Gold"};
const EQ=[ // [a,b] pairs; letter = A + sum
 [[1,4],[2,5],[1,7]],[[1,2],[2,2],[3,3]],[[2,3],[4,2],[1,7]],[[2,1],[1,3],[2,3],[1,5]],[[2,1],[1,3],[2,3],[1,5]],[[1,5],[2,5],[1,7],[4,5]],
 [[3,1],[2,4],[1,5],[3,4],[4,5]],[[1,2],[2,3],[1,4],[2,4],[1,6]],[[2,2],[1,3],[2,5],[1,7],[3,6]],[[1,5],[2,4],[4,5],[1,3],[2,5],[3,2]],
 [[2,3],[3,1],[1,6],[2,2],[3,5],[1,4]],[[3,2],[1,7],[2,1],[3,3],[4,4],[4,5]]];
const L=n=>String.fromCharCode(65+n);
const OBJECTS=["book","pencil","chair","bed","table","train","door","phone","house","eggs","glass","elephant","fish","car","flower","jacket","mouse","pot","boot","sun"];


let MARKS=[];const mark=w=>MARKS.push({t:Date.now(),w});
const AUTO={frame:0.02,minPause:0.25,minSeg:0.1,minRT:0.15,targetSpeak:40};
async function speechSegments(blob){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  let buf;try{buf=await ac.decodeAudioData(await blob.arrayBuffer())}finally{try{ac.close()}catch(e){}}
  const d=buf.getChannelData(0),sr=buf.sampleRate,fl=Math.max(1,Math.round(sr*AUTO.frame)),db=[];
  for(let i=0;i+fl<=d.length;i+=fl){let e=0;for(let j=i;j<i+fl;j++)e+=d[j]*d[j];db.push(10*Math.log10(e/fl+1e-12))}
  const srt=[...db].sort((a,b)=>a-b),pc=q=>srt[Math.min(srt.length-1,Math.floor(q*srt.length))]||-120;
  const noise=pc(.1),peak=pc(.98);const dur=d.length/sr;
  if(!db.length||peak-noise<10||peak<-55)return {dur,segs:[]};
  const thr=noise+Math.max(8,.3*(peak-noise));let segs=[],cur=null;
  db.forEach((v,i)=>{const t=i*AUTO.frame;if(v>=thr){if(!cur)cur={s:t,e:t+AUTO.frame};else cur.e=t+AUTO.frame}else if(cur){segs.push(cur);cur=null}});if(cur)segs.push(cur);
  const merged=[];for(const g of segs){const l=merged[merged.length-1];if(l&&g.s-l.e<AUTO.minPause)l.e=g.e;else merged.push({...g})}
  return {dur,segs:merged.filter(g=>g.e-g.s>=AUTO.minSeg)};
}
const r1=v=>Math.round(v*10)/10;
function fluencyOf({dur,segs}){
  if(!segs.length)return {speak:0,ptr:0,pauses:0,pausesMin:0,meanPause:0,mlr:0,est:0,dur:r1(dur)};
  const speak=segs.reduce((a,g)=>a+g.e-g.s,0),span=segs[segs.length-1].e-segs[0].s;
  const gaps=segs.slice(1).map((g,i)=>g.s-segs[i].e),ptr=span>0?speak/span:1;
  const est=Math.round(10*(.5*Math.min(speak/AUTO.targetSpeak,1)+.5*Math.max(0,Math.min(1,(ptr-.3)/.5))));
  return {speak:r1(speak),ptr:Math.round(ptr*100),pauses:gaps.length,pausesMin:r1(gaps.length/Math.max(span/60,1/60)),
    meanPause:r1(gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:0),mlr:r1(speak/(gaps.length+1)),est,dur:r1(dur)};
}
function reactionOf({segs},marks){
  if(!marks||!marks.length)return null;let answered=0;const rts=[];
  marks.forEach(m=>{const g=segs.find(g=>g.s>=m.t+AUTO.minRT&&g.s<=m.t+m.w+.3);if(g){answered++;rts.push(g.s-m.t)}});
  rts.sort((a,b)=>a-b);
  return {n:marks.length,answered,rtMean:rts.length?Math.round(1000*rts.reduce((a,b)=>a+b,0)/rts.length):null,rtMedian:rts.length?Math.round(1000*rts[Math.floor(rts.length/2)]):null};
}
async function autoScore(sess,recs){
  const out={};
  for(const r of recs){try{const sg=await speechSegments(r.blob);
    out[r.key]=SPEAK_KEYS.includes(r.key)?fluencyOf(sg):(reactionOf(sg,r.marks)||{n:0,answered:null})}catch(e){out[r.key]={error:true}}}
  sess.auto=out;sess.autoAt=Date.now();await putS(sess);return out;
}
function autoLine(sess,key){
  const a=sess.auto&&sess.auto[key];if(!a)return '';if(a.error)return '<small class="auto">Auto: could not analyse · تعذّر التحليل</small>';
  const tx=sess.asr&&sess.asr[key];
  const trn=tx?`<details class="trn"${key==='T2_letters'?' open':''}><summary>📝 What the student said · ما قاله الطالب</summary><p>${esc(tx.text||'—')}</p>${tx.items?`<div class="items">${tx.items.map((it,i)=>`<span class="${it.ok?'ok':'no'}">${i+1}. ${esc(it.exp)}${it.ok?' ✓':` → ${esc(it.said||'—')}`}</span>`).join('')}</div>`:''}</details>`:'';
  if(SPEAK_KEYS.includes(key))return `<small class="auto">🤖 Auto: fluency ≈ <b>${a.est}/10</b> · speaking ${a.speak}s · ${a.pauses} pauses · speech ${a.ptr}%${a.wpm!=null?` · ${a.wpm} words/min`:''}</small>${trn}`;
  if(a.answered==null)return trn;
  return `<small class="auto">🤖 Auto: ${a.correct!=null?`correct <b>${a.correct}/${a.n}</b> · `:''}answered ${a.answered}/${a.n}${a.rtMean!=null?` · reaction time ${a.rtMean} ms`:''}${a.readWord?` · read the word ${a.readWord}×`:''}</small>${trn}`;
}
function autoSummary(s){
  if(!s.auto)return '';const q=SPEAK_KEYS.map(k=>s.auto[k]&&s.auto[k].est).filter(v=>v!=null);
  const parts=[];if(q.length)parts.push(`fluency ≈ ${q.reduce((a,b)=>a+b,0)}/${q.length*10}`);
  [['T1_colors','Colours'],['T2_letters','Letters'],['T3_pictures','Pictures']].forEach(([k,l])=>{const a=s.auto[k];if(a&&a.answered!=null)parts.push(`${l} ${a.correct!=null?a.correct+' correct':a.answered+' answered'}/${a.n}${a.rtMean!=null?' ('+a.rtMean+' ms)':''}`)});

/* ================= SPEECH RECOGNITION CORRECTION (teacher) =================
   The teacher presses "Auto-correct": the app listens to every recording with
   Whisper (OpenAI's speech-recognition model, running inside the app) and checks
   the words: ink colours, letter sequences, picture names, and answer texts.
   The model (~40 MB) is downloaded once from the school website, then cached. */
const ASR_BASE=(/github\.io$/.test(location.hostname)||location.hostname==='localhost')?new URL('../asr/',location.href).href:'https://djilalilakehal0-gif.github.io/speaking-pretest/asr/';

/* Closed-vocabulary listening: for each answer we already know the possible words

  const out=await model.forward({encoder_outputs:T.cat(Array.from({length:n},()=>h),0),decoder_input_ids:new T.Tensor('int64',ids,[n,Lx])});

  return seqs.map((q,i)=>{let lp=0;for(let j=WP.length;j<q.length;j++){const o=(i*Lx+j-1)*V;lp+=d[o+q[j]]-lsmRow(d,o,V)}return lp});
}
async function pcm16k(blob){

const nw=w=>String(w).toLowerCase().replace(/[^a-z]/g,'');
const COLOR_ALIAS={gray:'grey',golden:'gold',turquoise:'turquoise',turquois:'turquoise',purple:'purple',violet:'purple'};
const COLORS=new Set([...Object.values(INK).map(c=>c.toLowerCase()),...STROOP.map(x=>x[0].toLowerCase()),'gray','orange','white']);
const colorOf=w=>{w=nw(w);w=COLOR_ALIAS[w]||w;return COLORS.has(w)?w:null};
const LETTER_WORDS={a:'A',ay:'A',eh:'A',b:'B',be:'B',bee:'B',c:'C',see:'C',sea:'C',si:'C',d:'D',dee:'D',e:'E',f:'F',ef:'F',eff:'F',g:'G',gee:'G',ji:'G',h:'H',aitch:'H',haitch:'H',i:'I',eye:'I',ai:'I',j:'J',jay:'J',k:'K',kay:'K',l:'L',el:'L',ell:'L',m:'M',em:'M',n:'N',en:'N',o:'O',oh:'O',p:'P',pee:'P',pea:'P',q:'Q',cue:'Q',queue:'Q',r:'R',ar:'R',are:'R',s:'S',es:'S',ess:'S',t:'T',tee:'T',tea:'T',u:'U',you:'U',v:'V',vee:'V',w:'W',x:'X',ex:'X',y:'Y',why:'Y',z:'Z',zed:'Z',zee:'Z'};
function lettersOf(word){const raw=String(word).replace(/[^A-Za-z]/g,'');if(!raw)return [];
  if(raw.length>1&&raw.length<=8&&raw===raw.toUpperCase())return raw.split('');
  const m=LETTER_WORDS[raw.toLowerCase()];return m?[m]:[];}
const OBJ_SYN={book:['book','notebook'],pencil:['pencil'],chair:['chair'],bed:['bed'],table:['table','desk'],train:['train'],door:['door'],phone:['phone','telephone','mobile','smartphone','cellphone'],house:['house','home'],eggs:['egg','eggs'],glass:['glass'],elephant:['elephant'],fish:['fish'],car:['car'],flower:['flower','flowers'],jacket:['jacket','coat'],mouse:['mouse'],pot:['pot','saucepan'],boot:['boot','boots'],sun:['sun']};
async function transcribe(pcm,segs){
  const asr=await loadASR();
  const r=await asr(pcm,{language:'en',task:'transcribe',return_timestamps:'word',chunk_length_s:30,stride_length_s:5});
  let words=(r.chunks||[]).map(c=>({w:c.text.trim(),s:c.timestamp[0],e:c.timestamp[1]==null?c.timestamp[0]+0.3:c.timestamp[1]})).filter(x=>x.w);

}
/* Tasks: each answer is a short word said inside its own time window, so every window is
   cut out and heard on its own (Whisper is much more accurate on short clips). Windows
   with no voice are skipped, so the model cannot "imagine" words in silence. */
const GRACE={T1_colors:0.5,T2_letters:0.8,T3_pictures:0.5};
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const OTHER=['Um.','I don\'t know.']; // "none of the answers"
function vocabFor(key){
  if(key==='T1_colors'){const c=[...new Set([...Object.values(INK),'Orange','White'].map(w=>w.toLowerCase()))];return c.map(w=>({w,t:cap(w)+'.'}))}
  if(key==='T3_pictures'){const v=[];OBJECTS.forEach(o=>(OBJ_SYN[o]||[o]).forEach(w=>v.push({w,o,t:cap(w)+'.'})));return v}
  return []}
let WLET=null;
function letterTokens(){if(WLET)return WLET;const m=new Map(),tok=WM.tok;
  for(let c=0;c<26;c++)for(const v of [' '+L(c),L(c)]){const t=tok.encode(v,{add_special_tokens:false});if(t.length===1)m.set(t[0],L(c))}
  for(const v of [',','.',' ,',' .','-',' -','...']){const t=tok.encode(v,{add_special_tokens:false});if(t.length===1)m.set(t[0],'')}
  return WLET=m}
async function wLetters(h,max=16){const {T,model}=WM,allow=letterTokens();const seq=[...WP];let out='';
  for(let k=0;k<max;k++){const o=await model.forward({encoder_outputs:h,decoder_input_ids:new T.Tensor('int64',BigInt64Array.from(seq.map(BigInt)),[1,seq.length])});
    const V=o.logits.dims[2],d=o.logits.data,off=(seq.length-1)*V;let best=WEOT,bv=d[off+WEOT];
    for(const t of allow.keys())if(d[off+t]>bv){bv=d[off+t];best=t}

const spell=x=>x.split('').join(', ')+'.';
async function transcribeWindows(pcm,marks,segs,grace,key){
  await loadASR();const out=[];
  for(const [i,m] of marks.entries()){const a=m.t,b=m.t+m.w+grace;
    const voiced=segs.filter(g=>g.e>a&&g.s<b);if(!voiced.length){out.push(null);continue} // silence = no answer
    const s0=Math.max(0,a,voiced[0].s-0.3),s1=Math.min(b,voiced[voiced.length-1].e+0.3,pcm.length/16000);
    const clip=new Float32Array(Math.round((s1-s0)*16000)+16000);clip.set(pcm.subarray(Math.round(s0*16000),Math.round(s1*16000)),8000);
    const h=await wEncode(clip);
    if(key==='T2_letters'){ // free letter listening, then check: does the correct sequence fit the sound better than what was heard?
      const exp=EQ[i].map(([x,y])=>L(x+y)).join('');const heard=await wLetters(h);
      if(!heard){out.push({w:'',t:'(no letters)'});continue}
      if(heard===exp){out.push({w:exp,t:exp});continue}
      const [se,sh]=await wScore(h,[spell(exp),spell(heard)]);out.push(se>=sh?{w:exp,t:exp}:{w:heard,t:heard});continue}
    const voc=vocabFor(key),all=[...voc,...OTHER.map(t=>({w:null,t}))];const sc=[];
    for(let k=0;k<all.length;k+=32)sc.push(...await wScore(h,all.slice(k,k+32).map(x=>x.t)));
    let bv=-1e9,bi=0,fo=-1e9,fi=-1;sc.forEach((v,k)=>{if(all[k].w){if(v>bv){bv=v;bi=k}}else if(v>fo){fo=v;fi=k}});
    out.push(fo>bv+1.5?{w:'',t:all[fi].t.replace('.','')}:all[bi])}

}
const toks=t=>String(t).split(/[\s,.;:!?\-]+/).filter(Boolean);
function checkStroop(picks){let correct=0,readWord=0;const items=[];
  picks.forEach((p,i)=>{const exp=INK[STROOP[i][1]].toLowerCase(),printed=STROOP[i][0].toLowerCase();const said=p&&p.w?colorOf(p.w)||p.w:null;
    const ok=said===exp;if(ok)correct++;else if(said&&said===printed)readWord++;items.push({exp,said:said||(p?p.t:''),ok})});
  return {correct,n:picks.length,readWord,items}}
function checkLetters(picks){let correct=0,letters=0,total=0;const items=[];
  picks.forEach((p,i)=>{const exp=EQ[i].map(([a,b])=>L(a+b));const got=p&&p.w?p.w.split(''):[];
    const ok=got.join('')===exp.join('');if(ok)correct++;exp.forEach((c,k)=>{total++;if(got[k]===c)letters++});items.push({exp:exp.join(''),said:got.join('')||(p?p.t:''),ok})});

  picks.forEach((p,i)=>{const obj=OBJECTS[i];const ok=!!(p&&p.o===obj);if(ok)correct++;items.push({exp:obj,said:p?(p.w||p.t):'',ok})});

async function asrCorrect(sess,onStep){
  const recs=(await recsOf(sess.id)).sort((a,b)=>a.key.localeCompare(b.key));
  sess.auto=sess.auto||{};sess.asr=sess.asr||{};
  for(const [i,r] of recs.entries()){onStep&&onStep(r.label,i,recs.length);
    const sg=await speechSegments(r.blob);const pcm=await pcm16k(r.blob);const task=!SPEAK_KEYS.includes(r.key)&&r.marks&&r.marks.length;
    let tr,texts;if(task){texts=await transcribeWindows(pcm,r.marks,sg.segs,GRACE[r.key]||0.5,r.key);tr={text:texts.map(p=>p?(p.w||p.t):'—').join(' · ')}}else tr=await transcribe(pcm,sg.segs);
    sess.asr[r.key]={text:tr.text};const a=sess.auto[r.key]=SPEAK_KEYS.includes(r.key)?fluencyOf(sg):(reactionOf(sg,r.marks)||{n:0});
    if(SPEAK_KEYS.includes(r.key)){const span=sg.segs.length?sg.segs[sg.segs.length-1].e-sg.segs[0].s:0;a.words=tr.words.length;

  }

  sess.scores=sess.scores||{};sess.autoFilled=sess.autoFilled||{};
  for(const x of SCORING){const a=sess.auto[x.key];if(!a)continue;const v=SPEAK_KEYS.includes(x.key)?a.est:a.correct;
    if(v==null)continue;if(sess.scores[x.key]==null||sess.autoFilled[x.key]){sess.scores[x.key]=v;sess.autoFilled[x.key]=true}}
  sess.asrAt=Date.now();await putS(sess);
}



/* ================= TEACHER SCORING =================
   The teacher listens to each recording and enters a score.
   ► Change the maximum marks here if the study uses another scale. */
const SCORING=[
  {key:'Q1',label:'Question 1',max:10,hint:'Speaking fluency · طلاقة التحدث'},
  {key:'Q2',label:'Question 2',max:10,hint:'Speaking fluency · طلاقة التحدث'},
  {key:'Q3',label:'Question 3',max:10,hint:'Speaking fluency · طلاقة التحدث'},
  {key:'T1_colors',label:'Task 1 · Colours',max:STROOP.length,hint:'Correct colours · عدد الألوان الصحيحة'},
  {key:'T2_letters',label:'Task 2 · Letters',max:EQ.length,hint:'Correct sequences · عدد السلاسل الصحيحة'},
  {key:'T3_pictures',label:'Task 3 · Pictures',max:OBJECTS.length,hint:'Correct names · عدد الأسماء الصحيحة'}];
const SPEAK_KEYS=['Q1','Q2','Q3'];
const scoreOf=(s,k)=>(s.scores&&s.scores[k]!=null&&s.scores[k]!=='')?+s.scores[k]:null;
function scoreSummary(s){
  const got=SCORING.filter(x=>scoreOf(s,x.key)!=null).length;
  if(!got)return '<span class="ungraded">Not graded yet · لم يُصحَّح بعد</span>';
  const sp=SPEAK_KEYS.map(k=>scoreOf(s,k)).filter(v=>v!=null);
  const spMax=SCORING.filter(x=>SPEAK_KEYS.includes(x.key)).reduce((a,x)=>a+x.max,0);
  const parts=[`Speaking ${sp.reduce((a,b)=>a+b,0)}/${spMax}`];
  SCORING.filter(x=>!SPEAK_KEYS.includes(x.key)).forEach(x=>{const v=scoreOf(s,x.key);if(v!=null)parts.push(`${x.label.split(' · ')[1]} ${v}/${x.max}`)});
  return `<span class="graded">${got===SCORING.length?'✓ ':''}${parts.join(' · ')}</span>${got<SCORING.length?` <span class="ungraded">(${got}/${SCORING.length})</span>`:''}`;
}

/* ================= TEACHER APP =================
   Students' phones send their recordings and scores to the school's Google Sheet.
   This app shows every student in a table, downloads the recordings, listens to them
   with the speech model (automatic correction) and writes the grades back. */
const $=s=>document.querySelector(s);
const M=$('#main');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t,ms=2400){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,ms)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- local storage (so the teacher can listen again without downloading) ---------- */
let dbp=null;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('pretest-teacher',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('students',{keyPath:'id'});d.createObjectStore('audio')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const st=t.objectStore(store);const q=fn(st);
  t.oncomplete=()=>res(q&&'result' in q?q.result:undefined);t.onerror=()=>rej(t.error)})}
const getStudents=()=>tx('students','readonly',st=>st.getAll());

const getAudio=id=>tx('audio','readonly',st=>st.get(id));

async function forgetLocal(s){await tx('students','readwrite',st=>st.delete(s.id));
  for(const r of (s.recs||[]))await tx('audio','readwrite',st=>st.delete(r.file));delete REC[s.id]}

/* ---------- connection to the Google script ---------- */
const CFG={url:LS.get('t_url')||'',key:LS.get('t_key')||''};
async function api(params){

/* ---------- the student object used by the shared scoring code ---------- */
const REC={};               // id -> recordings with audio blobs (filled when needed)
async function recsOf(id){return REC[id]||[]}
async function putS(s){s.t=Date.now();await putStudent(s)}   // used by asrCorrect / autoScore
function view(s){           // merge what the phone sent with the teacher's work
  const T=s.teacher||{};
  return Object.assign(s,{auto:Object.assign({},(s.phone||{}).auto||{},T.auto||{}),asr:T.asr||{},scores:T.scores||{},autoFilled:T.autoFilled||{},asrAt:T.asrAt||null});
}
const val=(s,k)=>{const v=scoreOf(s,k);if(v!=null)return {v,auto:!!(s.autoFilled&&s.autoFilled[k])};
  const a=s.auto&&s.auto[k];if(!a)return null;const x=SPEAK_KEYS.includes(k)?a.est:a.correct;return x==null?null:{v:x,auto:true,phone:!s.asrAt}};

async function loadRecs(s,onP){
  const out=[];let i=0;
  for(const r of (s.recs||[]).slice().sort((a,b)=>a.key.localeCompare(b.key))){
    let blob=await getAudio(r.file);
    if(!blob){const j=await api({a:'audio',id:r.file});const bin=atob(j.data);const u8=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);

    out.push({key:r.key,label:r.label,blob,marks:r.marks,dur:r.dur});onP&&onP(++i,s.recs.length);

async function saveGrades(s){
  s.teacher={scores:s.scores,autoFilled:s.autoFilled,auto:s.auto,asr:s.asr,asrAt:s.asrAt,t:Date.now()};
  await putStudent(s);
  try{await apiPost({a:'grade',sid:s.id,data:s.teacher});s.dirty=false}catch(e){s.dirty=true;console.warn('save',e)}

/* ---------- refresh from the sheet ---------- */
let STUDENTS=[],LAST=null,BUSY=null,OPEN=null,CUR=null;
async function refresh(){
  const j=await api({a:'list'});LS.set('t_sheet',j.sheet||'');
  const local=Object.fromEntries((await getStudents()).map(s=>[s.id,s]));
  const onSheet=new Set();
  for(const r of j.students){
    if(r.teacher&&r.teacher.deleted)continue;       // hidden by the teacher
    onSheet.add(r.id);
    const l=local[r.id];
    const s=Object.assign(l||{},{id:r.id,name:r.name||(l&&l.name)||'…',date:r.date||(l&&l.date),phone:r.phone,recs:r.recs});
    // the newest teacher work wins (this device or another teacher device)
    if(!l||!l.teacher||(r.teacher&&(r.teacher.t||0)>=(l.teacher.t||0))&&!l.dirty)s.teacher=r.teacher||{};
    view(s);await putStudent(s);local[r.id]=s;
  }
  // students deleted (here or on another teacher device) disappear from this device too
  for(const s of Object.values(local))if(!onSheet.has(s.id)&&!s.dirty){await forgetLocal(s);delete local[s.id]}
  // grades that could not be sent before
  for(const s of Object.values(local))if(s.dirty){view(s);try{await apiPost({a:'grade',sid:s.id,data:s.teacher});s.dirty=false;await putStudent(s)}catch(e){}}
  STUDENTS=Object.values(local).map(view).sort((a,b)=>(b.date||0)-(a.date||0));LAST=new Date();
}
async function autoCorrectQueue(){
  if(BUSY||LS.get('t_auto')==='0')return;
  const todo=STUDENTS.filter(s=>!s.asrAt&&complete(s)&&!s.failed);
  if(!todo.length)return;
  BUSY=true;
  try{
    setStatus('🤖 Loading the speech model… · تحميل نموذج الاستماع (مرة واحدة)');
    await loadASR(p=>{if(p&&p.status==='progress'&&p.file&&/onnx/.test(p.file))setStatus(`🤖 Downloading the speech model ${Math.round(p.progress||0)}% · تحميل النموذج`)});
    for(const s of todo){
      if(!STUDENTS.some(x=>x.id===s.id))continue;   // deleted meanwhile
      CUR=s.id;
      try{
        await loadRecs(s,(n,t)=>setStatus(`⬇️ ${s.name}: recordings ${n}/${t} · تحميل التسجيلات`));
        await asrCorrect(s,(lab,k,n)=>setStatus(`🤖 ${s.name}: ${lab} (${k+1}/${n})… · جارٍ الاستماع والتصحيح`));
        if(!STUDENTS.some(x=>x.id===s.id))continue;   // deleted while it was being corrected
        await saveGrades(s);
        toast(`✓ ${s.name} corrected · تم تصحيح ${s.name}`);
        if(!OPEN)drawTable();
      }catch(e){console.warn('auto-correct',s.name,e);s.failed=true}
    }
  }finally{BUSY=null;CUR=null;setStatus('')}
}

/* ---------- every answer with its own recording and its text ----------
   Task recordings are one file per task; each answer is the part of that file
   from the moment the item appeared (or the student tapped) to the end of its answer time. */
const GR={T1_colors:0.6,T2_letters:0.9,T3_pictures:0.6};
function expOf(key,i){
  if(key==='T1_colors'){const x=STROOP[i];return x?`${INK[x[1]]}`:''}
  if(key==='T2_letters'){const x=EQ[i];return x?x.map(([a,b])=>L(a+b)).join(' '):''}

function itemWord(key,i){
  if(key==='T1_colors'){const x=STROOP[i];return x?`<span style="color:${x[1]};font-weight:800">${esc(x[0])}</span>`:''}
  if(key==='T3_pictures')return `<img src="../img/${OBJECTS[i]}.jpg" alt="">`;return ''}
function answersBlock(s,r){
  const tx=s.asr&&s.asr[r.key];
  if(SPEAK_KEYS.includes(r.key))
    return `<div class="ans"><div class="ans-h">📝 What the student said · ما قاله الطالب</div><p class="ans-text">${tx&&tx.text?esc(tx.text):'<span class="mut">— not corrected yet · لم يُصحَّح بعد —</span>'}</p></div>`;
  if(!r.marks||!r.marks.length)return '';
  const items=(tx&&tx.items)||[];
  return `<div class="ans"><div class="ans-h">🎧 Each answer · كل إجابة <small>▶ = its recording · تسجيلها</small></div>
    ${r.marks.map((m,i)=>{const it=items[i],st=it?(it.ok?'ok':'no'):'wait';
      return `<div class="arow ${st}"><span class="an">${i+1}</span><button class="play" data-seg="${r.key}|${i}" aria-label="Play answer ${i+1}">▶</button>
        <span class="aw">${itemWord(r.key,i)}</span>
        <span class="asaid">${it?`${it.ok?'✓':'✗'} ${esc(it.said||'—')}`:'…'}</span>
        <span class="aexp">${it&&it.ok?'':`= ${esc(expOf(r.key,i))}`}</span></div>`}).join('')}</div>`;
}
let SEGCTX=null,SEGSRC=null,SEGBTN=null;const SEGBUF=new Map();
function segStop(){try{SEGSRC&&SEGSRC.stop()}catch(e){}SEGSRC=null;if(SEGBTN){SEGBTN.textContent='▶';SEGBTN.classList.remove('on');SEGBTN=null}}
async function playSeg(btn,r,i){
  const again=SEGBTN===btn;segStop();if(again)return;
  if(PLAYER&&!PLAYER.paused)PLAYER.pause();document.querySelectorAll('#lst audio').forEach(a=>a.pause());
  btn.textContent='…';SEGBTN=btn;
  try{SEGCTX=SEGCTX||new (window.AudioContext||window.webkitAudioContext)();if(SEGCTX.state==='suspended')await SEGCTX.resume();
    let buf=SEGBUF.get(r.blob);if(!buf){buf=await SEGCTX.decodeAudioData(await r.blob.arrayBuffer());SEGBUF.set(r.blob,buf)}
    if(SEGBTN!==btn)return;
    const m=r.marks[i],from=Math.max(0,m.t-0.15),len=Math.min(buf.duration-from,m.w+(GR[r.key]||0.6)+0.15);
    const src=SEGCTX.createBufferSource();src.buffer=buf;src.connect(SEGCTX.destination);
    src.onended=()=>{if(SEGSRC===src){SEGSRC=null;segStop()}};src.start(0,from,Math.max(0.1,len));
    SEGSRC=src;btn.textContent='⏸';btn.classList.add('on');
  }catch(e){console.warn('segment',e);segStop();toast('⚠️ Could not play this part · تعذّر التشغيل')}
}

  </div>
  <div class="pname"><span>Student's name: <b>${esc(s.name)}</b></span><span class="ar">اسم الطالب: <b>${esc(s.name)}</b></span></div>
  <div class="ptotal">(${max} Marks) ${circ(total,max)}</div>

  <h3>I. SPEAKING <small>(30 Marks)</small> ${circ(spT,30)}</h3>
  <p class="psub">A. Answer the questions. <span>(3 × 10 = 30)</span></p>
  ${qs.map((q,i)=>`<div class="pq"><p><b>${i+1}.</b> ${esc(q.en)} <em class="pm">(${X(sp[i])} / 10)</em></p><div class="plines">${mk(A(SPEAK_KEYS[i]))}</div></div>`).join('')}

  <h3>II. ATTENTION — Colours <small>(${STROOP.length} Marks)</small> ${circ(V('T1_colors'),STROOP.length)}</h3>
  <p class="psub">B. Say the colour of the ink, not the word. <span>(${STROOP.length} × 1 = ${STROOP.length})</span></p>
  <div class="pgrid">${STROOP.map(([w,c],i)=>`<div><b>${i+1}.</b> <span class="pw" style="color:${c}">${esc(w)}</span> → ${mk(A('T1_colors',i))}</div>`).join('')}</div>

  <p class="pturn">Turn over · اقلب الورقة ↻</p></section>
  <section class="side back">
  <div class="pback"><span>Student's name: <b>${esc(s.name)}</b></span><span>Page 2 / 2 · الوجه الخلفي</span><span class="ar">اسم الطالب: <b>${esc(s.name)}</b></span></div>
  <h3>III. WORKING MEMORY — Letters <small>(${EQ.length} Marks)</small> ${circ(V('T2_letters'),EQ.length)}</h3>
  <p class="psub">C. Remember the letters and say them in order. <span>(${EQ.length} × 1 = ${EQ.length})</span></p>
  <div class="pgrid two">${EQ.map((set,i)=>`<div><b>${i+1}.</b> <span class="peq">${set.map(([a,b])=>`${a}+${b}=${a+b}→${L(a+b)}`).join('&nbsp; ')}</span><br>&nbsp;&nbsp;&nbsp; ${mk(A('T2_letters',i))}</div>`).join('')}</div>

  <h3>IV. NAMING — Pictures <small>(${OBJECTS.length} Marks)</small> ${circ(V('T3_pictures'),OBJECTS.length)}</h3>
  <p class="psub">D. Say the name of each picture. <span>(${OBJECTS.length} × 1 = ${OBJECTS.length})</span></p>
  <div class="pgrid pics">${OBJECTS.map((o,i)=>`<div><b>${i+1}.</b> <img src="../img/${o}.jpg" alt=""> ${mk(A('T3_pictures',i))}</div>`).join('')}</div>
  <p class="pfoot">✓ correct · صحيح &nbsp; ✗ wrong · خطأ &nbsp; ...... not corrected yet · لم يُصحَّح بعد</p>
  </section></article>`;
}
function examPapers(list,back){
  OPEN=null;
  M.innerHTML=`<div class="screen wide"><div class="tbar noprint"><div><h1>Exam papers · أوراق الاختبار</h1><div class="mut">${list.length} student(s) · طالب</div></div>
    <div class="tact"><button class="btn small accent" id="pr">🖨 Print / PDF</button><button class="btn small" id="bk">← Back</button></div></div>
    <div class="papers">${list.map(paperHTML).join('')}</div></div>`;
  $('#pr').onclick=()=>window.print();$('#bk').onclick=back||mainScreen;window.scrollTo(0,0);
}
function answersSheet(){
  OPEN=null;const rows=sheetRows();
  M.innerHTML=`<div class="screen wide">
    <div class="tbar"><div><h1>Answers sheet · ورقة الإجابات</h1><div class="mut">Every question, and what each student said · كل سؤال وما قاله كل طالب كتابةً</div></div>
      <div class="tact"><button class="btn small accent" id="pp">📝 Exam papers · أوراق الاختبار</button><button class="btn small ghost" id="ex">📊 Excel</button><button class="btn small ghost" id="pr">🖨 Print</button><button class="btn small" id="bk">← Back</button></div></div>
    <input class="name" id="fl" placeholder="🔎 Search a student · ابحث عن طالب" autocomplete="off">
    <div class="tblwrap ashwrap" id="ash"></div>
    <p class="mut legend"><span class="ok">✓</span> correct · صحيح &nbsp; <span class="no">✗</span> wrong · خطأ &nbsp; … not corrected yet · لم يُصحَّح بعد</p></div>`;
  const draw=()=>{
    const f=$('#fl').value.trim().toLowerCase();
    const st=STUDENTS.filter(s=>s.name&&s.name!=='…'&&(!f||s.name.toLowerCase().includes(f))).sort((a,b)=>(a.date||0)-(b.date||0));
    let g='',html=`<table class="asheet"><thead><tr><th class="c1">#</th><th class="c2">Question · السؤال</th><th class="c3">Correct · الصحيح</th>${st.map(s=>`<th><button class="lnk" data-id="${esc(s.id)}">${esc(s.name)}</button></th>`).join('')}</tr></thead><tbody>`;
    rows.forEach(r=>{
      if(r.g!==g){g=r.g;html+=`<tr class="grp"><td class="c1"></td><td class="c2" colspan="2">${g}</td>${st.map(()=>'<td></td>').join('')}</tr>`}
      html+=`<tr class="${r.i==null?'sp':''}"><td class="c1">${r.n}</td><td class="c2">${r.q}</td><td class="c3">${esc(r.exp)}</td>${st.map(s=>{const a=answerOf(s,r);
        return `<td class="${a.c}">${a.c==='wait'?'…':(a.c==='ok'?'✓ ':a.c==='no'?'✗ ':'')+esc(a.t)}</td>`}).join('')}</tr>`});
    $('#ash').innerHTML=st.length?html+'</tbody></table>':'<p class="mut" style="padding:16px">No students · لا يوجد طلاب</p>';
    $('#ash').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{const s=STUDENTS.find(x=>x.id===b.dataset.id);if(s)studentScreen(s)});
  };
  draw();$('#fl').oninput=draw;
  $('#bk').onclick=mainScreen;$('#pr').onclick=()=>window.print();
  $('#pp').onclick=()=>{const f=$('#fl').value.trim().toLowerCase();examPapers(STUDENTS.filter(s=>s.name&&s.name!=='…'&&(!f||s.name.toLowerCase().includes(f))).sort((a,b)=>(a.date||0)-(b.date||0)),answersSheet)};
  $('#ex').onclick=()=>{
    const q=v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const st=STUDENTS.filter(s=>s.name&&s.name!=='…').sort((a,b)=>(a.date||0)-(b.date||0));
    const out=[['Part','#','Question','Correct answer',...st.map(s=>s.name)]];
    rows.forEach(r=>out.push([r.g,r.n,r.qt||r.q,r.exp,...st.map(s=>{const a=answerOf(s,r);return a.c==='wait'?'':(a.c==='ok'?'✓ ':a.c==='no'?'✗ ':'')+a.t})]));
    const csv='\ufeff'+out.map(r=>r.map(q).join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`SpeakingPreTest_answers_${new Date().toISOString().slice(0,10)}.csv`;a.click()};
}
async function tick(manual){
  try{await refresh();if(!OPEN)drawTable();autoCorrectQueue()}
  catch(e){if(manual)toast('⚠️ Could not update — check the internet · تعذّر التحديث');if(e.message==='key')setupScreen('Wrong teacher key · مفتاح المعلّم خاطئ')}
}
async function start(){
  STUDENTS=(await getStudents()).map(view).sort((a,b)=>(b.date||0)-(a.date||0));
  if(!CFG.url||!CFG.key){setupScreen();return}
  mainScreen();loop();
}
let LOOP=null;
function loop(){tick();if(!LOOP)LOOP=setInterval(()=>{if(!document.hidden)tick()},20000)}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
start();

</script>
</body>
</html>
