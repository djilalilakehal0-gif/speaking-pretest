<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Speaking Pre-Test</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pre-Test">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/logo.png">
<style>
@font-face{font-family:Plex;src:url(fonts/plex-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(fonts/plex-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Plex;src:url(fonts/plex-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Plex;src:url(fonts/plex-700.woff2) format('woff2');font-weight:700 800;font-display:swap}
@font-face{font-family:PlexAr;src:url(fonts/plexar-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:PlexAr;src:url(fonts/plexar-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:PlexAr;src:url(fonts/plexar-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:PlexAr;src:url(fonts/plexar-700.woff2) format('woff2');font-weight:700 800;font-display:swap}
:root{
  --navy:#0f3d3e;--navy2:#17575a;--paper:#f3f7f5;--surface:#fff;--ink:#10282a;--slate:#4b6062;--line:#d3e0de;
  --accent:#f2a33a;--gold:#f2a33a;--gold2:#f2a33a;--goldbg:#fdf0dc;--red:#b3261e;--green:#1f7f55;
  --shadow:0 6px 18px rgba(15,61,62,.08);
  --mut:var(--slate);--card:var(--surface);--bg:var(--paper);
  --font:Plex,PlexAr,system-ui,sans-serif;--font-ar:PlexAr,Plex,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
body{padding:0 0 env(safe-area-inset-bottom,0)}
.ar{font-family:var(--font-ar);direction:rtl;text-align:right}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--paper)}

/* header: dark band + stage track */
header.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:calc(14px + env(safe-area-inset-top,0)) 18px 16px;background:var(--navy);color:#fff;border-radius:0 0 26px 26px}
header.top img{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px}
header.top .t{font-weight:600;font-size:15px;line-height:1.2;letter-spacing:.1px}
header.top .s{font-size:12.5px;color:#b7ccca;line-height:1.3}
header.top .step{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--accent);border-radius:999px;padding:4px 11px;white-space:nowrap}
header.top .step:empty{display:none}
.track{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.track i{height:5px;border-radius:3px;background:rgba(255,255,255,.18);transition:background .4s}
.track i.done{background:var(--gold2)}
.track i.now{background:#fff}

main{flex:1;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
.screen{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:0;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
h1{font-size:26px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.2px}
h2{font-size:19px;line-height:1.3;font-weight:600;margin:0}
p{margin:0;line-height:1.55}
.mut{color:var(--slate);font-size:14px}

/* about the study */
.about{display:flex;flex-direction:column;gap:10px;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:20px 2px 4px;font-size:13.5px;color:var(--slate)}
.about p{line-height:1.65}
.about b{color:var(--ink);font-weight:600}
.about details{border-top:1px dashed var(--line);padding-top:10px}
.about summary{cursor:pointer;color:var(--navy2);font-weight:600;font-size:14px}
.about details p{margin-top:8px;line-height:1.85}

/* buttons */
.btn{appearance:none;border:0;border-radius:16px;padding:17px 18px;font:700 16px var(--font);background:var(--navy);color:#fff;width:100%;cursor:pointer;transition:background .15s,transform .05s}
.btn:hover{background:var(--navy2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--navy2)}
.btn.accent{background:var(--accent);color:var(--ink)}
.btn.accent:hover{background:#f5b45c}
.btn.small{padding:10px 14px;border-radius:12px;font-size:14px;width:auto}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
input.name{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);font:500 17px var(--font);background:#f8fbfa;color:var(--ink)}
input.name::placeholder{color:#8a9c9e}
input.name:focus{outline:none;border-color:var(--navy2);background:#fff;box-shadow:0 0 0 3px rgba(15,61,62,.14)}

/* home */
.hero{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:16px;padding:6px 2px 2px}
.hero img{width:76px;height:76px}
.hero h1{font-size:27px}
.hero .mut{margin-top:4px}
.form{display:flex;flex-direction:column;gap:8px}
.form .lbl{font-weight:600;font-size:15px;margin-top:6px}
.form .lbl:first-child{margin-top:0}
.form .btn{margin-top:10px}

/* questions */
.q{font-size:21px;font-weight:600;line-height:1.45;color:var(--ink)}
.qar{font-size:17px;line-height:1.7;color:var(--slate)}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;color:var(--navy2);min-height:26px;text-align:center}
.ring{position:relative;width:150px;height:150px;margin:6px auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600;font-variant-numeric:tabular-nums}

/* microphone */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.mic{width:124px;height:124px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(242,163,58,.22);cursor:pointer;position:relative}
.mic svg{width:52px;height:52px}
.mic.ready{animation:pulse 1.8s infinite}
.mic.rec{background:var(--red);box-shadow:0 0 0 10px rgba(179,38,30,.14),0 0 0 22px rgba(179,38,30,.06)}
.mic.rec::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid rgba(179,38,30,.35);transform:scale(var(--lvl,1));transition:transform .08s}
.mic:disabled{filter:grayscale(.8);opacity:.5;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,163,58,.55)}70%{box-shadow:0 0 0 22px rgba(242,163,58,0)}100%{box-shadow:0 0 0 0 rgba(242,163,58,0)}}
@media (prefers-reduced-motion:reduce){.mic.ready{animation:none}.track i{transition:none}}
.miclabel{font-weight:600;text-align:center}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.saved{color:var(--green);font-weight:600;text-align:center}
audio{width:100%}

/* pictures & tasks */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pics button{padding:0;border:3px solid transparent;border-radius:12px;overflow:hidden;background:none;cursor:pointer}
.pics button img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pics button.sel,.pics button:focus-visible{border-color:var(--gold)}
.bigpic{width:100%;border-radius:16px;display:block;background:#fff}
.stage{min-height:300px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#e4e4e4;border:1px solid var(--line)}
.stroop{font-size:54px;font-weight:700;letter-spacing:.5px}
.eqs{background:#f6f3ec;border-radius:12px;padding:22px;font:600 24px/1.9 var(--font);text-align:center;width:100%;font-variant-numeric:tabular-nums}
.white{background:#fff}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

/* saved answers */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:0;border-radius:16px;padding:12px 14px;background:#fff;box-shadow:0 3px 10px rgba(15,61,62,.06);display:flex;flex-direction:column;gap:8px}
.item .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.item .h small{color:var(--slate);font-weight:500}
.sess{border:0;box-shadow:var(--shadow);border-radius:18px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.score{display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--goldbg);border-radius:10px}
.score label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.score input{width:72px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:600 17px var(--font);text-align:center;background:#fff;color:var(--ink)}
.score input:focus{outline:none;border-color:var(--navy2)}
.score input.saved-ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(31,127,85,.15)}
.score span{color:var(--slate);font-weight:500}
.auto{display:block;color:#3b5998;font-size:13px;margin-top:4px}.au-sum .auto{margin-top:2px}
.acst{background:#eef3fb;border:1px solid #cdd9ee;color:#22365c;border-radius:10px;padding:10px 12px;font-size:14px}
.af{font-style:normal;font-size:12px;color:#3b5998;font-weight:600}
.trn{margin-top:6px;font-size:13px}.trn summary{cursor:pointer;color:#3b5998;font-weight:600}.trn p{margin:6px 0;color:var(--ink);line-height:1.5}
.items{display:flex;flex-wrap:wrap;gap:4px}.items span{font-size:12px;border-radius:6px;padding:2px 6px}.items .ok{background:#e6f4ec;color:#1f7f55}.items .no{background:#fdecea;color:#b3261e}
.sendst{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;background:#eef3fb;color:#22365c;text-align:center}.sendst.ok{background:#e6f4ec;color:#1f7f55}.sendst.wait{background:#fff6e0;color:#8a6519}
.sc-sum{margin-top:4px;font-size:13px}.sc-sum .graded{color:var(--green);font-weight:600}.sc-sum .ungraded{color:#a5641a;font-weight:500}
.tag{font-size:12.5px;background:var(--goldbg);color:#8a5300;border-radius:999px;padding:3px 8px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;font-size:14px;z-index:9;max-width:90%;box-shadow:0 6px 20px rgba(15,61,62,.25)}

/* ---- welcome screen ---- */
body.home header.top{display:none}
body.home main{padding-top:0}
.welcome{margin:0 -16px;padding:calc(34px + env(safe-area-inset-top,0)) 22px 80px;background:var(--navy);color:#fff;text-align:center;position:relative;overflow:hidden;border-radius:0 0 36px 36px}
.welcome::before{content:"";position:absolute;left:50%;top:-140px;width:520px;height:520px;margin-left:-260px;border-radius:50%;border:1px solid rgba(242,163,58,.14);box-shadow:0 0 0 46px rgba(242,163,58,.035),0 0 0 92px rgba(242,163,58,.025)}
.welcome>*{position:relative}
.welcome .crest{width:96px;height:96px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 3px var(--accent),0 10px 30px rgba(0,0,0,.25)}
.welcome .school{margin-top:14px;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:1.2px;text-transform:uppercase}
.welcome h1{color:#fff;font-size:34px;margin-top:4px;letter-spacing:-.4px}
.welcome .lead{color:#c9dcda;font-size:14.5px;margin-top:6px}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.areas div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;line-height:1.25;color:#dce8e6}
.areas svg{width:44px;height:44px;padding:11px;border-radius:14px;background:rgba(255,255,255,.10);color:var(--accent)}
.form.lift{margin-top:-56px;position:relative;border-radius:24px;padding:22px 20px;box-shadow:0 16px 40px rgba(15,61,62,.16);border:0}
.teacher-link{align-self:center;width:auto;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;color:#2c4447;border-color:var(--line);background:transparent}
.teacher-link svg{width:16px;height:16px}

/* ---- finish screen ---- */
.donehero{background:var(--navy);color:#fff;border-radius:24px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.donehero .ok{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center}
.donehero .ok svg{width:34px;height:34px}
.donehero h1{color:#fff;font-size:28px}
.donehero p{color:#c9dcda}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-inline-end:8px}
.teacher-link:hover{color:var(--navy);border-color:var(--line)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="img/logo.png" alt="">
    <div><div class="t">Alfikr Almodi School</div><div class="s">Speaking Pre-Test</div></div>
    <div class="step" id="stepLbl"></div>
    <div class="track" id="track" hidden><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= DATA ================= */
const Q1 = {en:"Describe your usual school day. Tell me what you do from the time you wake up until you return home.",
  ar:"صف يومك الدراسي المعتاد. أخبرني ماذا تفعل من وقت استيقاظك حتى عودتك إلى البيت."};
const Q2 = {en:"Look at the picture and describe what is happening. Tell me where the people are, what they are doing, and what might happen next.",
  ar:"انظر إلى الصورة وصف ما يحدث. أخبرني أين الأشخاص، وماذا يفعلون، وماذا قد يحدث بعد ذلك."};
const Q3 = {en:"Some students think that students should be allowed to use their phones at school. Do you agree or disagree? Explain why.",
  ar:"يرى بعض الطلاب أنه يجب السماح للطلاب باستخدام هواتفهم في المدرسة. هل توافق أم تعارض؟ اشرح السبب."};
const SCENES=['img/scene1.jpg','img/scene2.jpg','img/scene3.jpg','img/scene4.jpg'];
const STROOP=[["Turquoise","#05defb"],["Blue","#ff0000"],["Bicycle","#ff0000"],["Black","#000000"],["Yellow","#002060"],["Friend","#ffff00"],["Brown","#843c0c"],["Red","#ffff00"],["Music","#002060"],["Grey","#808080"],["Green","#ff0000"],["Garden","#00b050"],["Purple","#7030a0"],["Yellow","#00b050"],["School","#ffff00"],["Pink","#e696e0"],["Blue","#ffff00"],["Pencil","#ff0000"],["Orange","#ff0000"],["Green","#002060"],["Window","#00b050"],["Green","#00b050"],["Red","#00b050"],["Apple","#002060"],["Yellow","#ffff00"],["Yellow","#ff0000"],["Chair","#ffff00"],["Blue","#002060"],["Green","#ffff00"],["Book","#00b050"],["Red","#ff0000"],["Blue","#00b050"],["House","#002060"],["Gold","#b49600"],["Red","#002060"],["Table","#ff0000"]];
const INK={"#05defb":"Turquoise","#ff0000":"Red","#000000":"Black","#002060":"Blue","#ffff00":"Yellow","#843c0c":"Brown","#808080":"Grey","#00b050":"Green","#7030a0":"Purple","#e696e0":"Pink","#b49600":"Gold"};
const EQ=[ // [a,b] pairs; letter = A + sum
 [[1,4],[2,5],[1,7]],[[1,2],[2,2],[3,3]],[[2,3],[4,2],[1,7]],[[2,1],[1,3],[2,3],[1,5]],[[2,1],[1,3],[2,3],[1,5]],[[1,5],[2,5],[1,7],[4,5]],
 [[3,1],[2,4],[1,5],[3,4],[4,5]],[[1,2],[2,3],[1,4],[2,4],[1,6]],[[2,2],[1,3],[2,5],[1,7],[3,6]],[[1,5],[2,4],[4,5],[1,3],[2,5],[3,2]],
 [[2,3],[3,1],[1,6],[2,2],[3,5],[1,4]],[[3,2],[1,7],[2,1],[3,3],[4,4],[4,5]]];
const L=n=>String.fromCharCode(65+n);
const OBJECTS=["book","pencil","chair","bed","table","train","door","phone","house","eggs","glass","elephant","fish","car","flower","jacket","mouse","pot","boot","sun"];

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const M=$('#main');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P=()=>(window.Capacitor&&Capacitor.Plugins)||{};
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,ms)}
const STAGES=['Question 1/3','Question 2/3','Question 3/3','Task 1/3','Task 2/3','Task 3/3'];
function step(t){if(t)document.body.classList.remove('home');$('#stepLbl').textContent=t||'';const tr=$('#track');if(!tr)return;
  let k=STAGES.indexOf(t);if(t==='Intro')k=-1;else if(t==='Done')k=6;else if(k<0){tr.hidden=true;return}
  tr.hidden=false;[...tr.children].forEach((e,i)=>{e.className=i<k?'done':i===k?'now':''})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>';
const STOP_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
let RUN=0; // cancels running flows when we leave

/* ---------- speech ----------
   Recorded female voice (audio/*.mp3, same on every phone, works offline).
   Any line without a recording falls back to the phone's text-to-speech. */
const CLIPS={"Hello, and welcome. This is an evaluation of your speaking skills. It isn't graded, so don't worry. Listen carefully. You will have time to prepare silently. When you hear start speaking, tap the microphone and speak for one whole minute.": "audio/intro.mp3", "Listen carefully.": "audio/listen.mp3", "This is the last part of the first question. Listen carefully and take twenty seconds to prepare the answer.": "audio/q3lead.mp3", "Describe your usual school day. Tell me what you do from the time you wake up until you return home.": "audio/q1.mp3", "Look at the picture and describe what is happening. Tell me where the people are, what they are doing, and what might happen next.": "audio/q2.mp3", "Some students think that students should be allowed to use their phones at school. Do you agree or disagree? Explain why.": "audio/q3.mp3", "Start.": "audio/start.mp3", "Stop.": "audio/stop.mp3", "Start speaking.": "audio/startspeaking.mp3", "Thank you, stop.": "audio/thanksstop.mp3", "Thank you, let's repeat that with another sentence. Listen carefully. Quickly choose one of these four pictures.": "audio/choosepic.mp3", "Now we'll do something different. I will be showing you colored words and your task will be to say the color of the ink. Do not read the word. Just say the color it is written in. I'll show a new word every two seconds. Be quick. Tap the microphone to start.": "audio/task1.mp3", "This time I'll show you pictures of mathematical equations. Your task is to memorize the sequence of letters written under the equations. You'll have three seconds to memorize each sequence. Say the sequence when you see the white screen. Tap the microphone to start.": "audio/task2.mp3", "We came to the last task. This time I'll show you a sequence of different pictures and your task will be to say the name of the object you see. For each picture, you'll have two seconds. Tap the microphone to start.": "audio/task3.mp3", "Thank you.": "audio/thankyou.mp3", "That was all. Thank you for your participation. You did well.": "audio/finish.mp3"};
let CUR=null;
/* One shared audio element, unlocked on the first tap: iPhone Safari only lets
   an element play by itself (after a timer) once a tap has started it. */
const VO=new Audio();VO.preload='auto';VO.setAttribute('playsinline','');
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let VO_OK=false;
function unlockAudio(){if(VO_OK)return;VO_OK=true;try{VO.src=SILENT;const p=VO.play();p&&p.catch&&p.catch(()=>{VO_OK=false})}catch(e){VO_OK=false}
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function playClip(src){return new Promise(res=>{let done=false;const fin=ok=>{if(done)return;done=true;VO.onended=VO.onpause=VO.onerror=null;if(CUR===VO)CUR=null;res(ok)};
  try{VO.pause();VO.onended=()=>fin(true);VO.onpause=()=>{if(VO.src.indexOf(src)>=0&&!VO.ended&&VO.currentTime>0)fin(true)};VO.onerror=()=>fin(false);
    VO.src=src;VO.currentTime=0;CUR=VO;const p=VO.play();if(p&&p.catch)p.catch(()=>fin(false));
    setTimeout(()=>{if(!done&&VO.paused&&VO.currentTime===0)fin(false)},4000)}catch(e){fin(false)}})}
async function say(text){
  if(CLIPS[text]&&await playClip(CLIPS[text]))return;
  const tts=P().TextToSpeech;
  if(isNative()&&tts){try{await tts.speak({text,lang:'en-US',rate:0.9,pitch:1,volume:1,category:'playback'});return}catch(e){}}
  if('speechSynthesis' in window){
    await new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.9;
      const t=setTimeout(res,Math.max(3000,text.length*90));u.onend=u.onerror=()=>{clearTimeout(t);res()};speechSynthesis.speak(u)});
  } else await sleep(Math.max(1500,text.length*60));
}
function stopSpeech(){try{if(CUR){CUR.pause();CUR=null}}catch(e){}try{P().TextToSpeech&&P().TextToSpeech.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}

/* ---------- countdown ring ---------- */
function ringHTML(id){return `<div class="ring" id="${id}"><svg width="150" height="150"><circle cx="75" cy="75" r="66" stroke="#dde2ea" stroke-width="12" fill="none"/><circle class="arc" cx="75" cy="75" r="66" stroke="#b8892a" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="0"/></svg><div class="num"></div></div>`}
function countdown(el,secs,color,run){
  return new Promise(res=>{
    const arc=el.querySelector('.arc'),num=el.querySelector('.num');if(color)arc.setAttribute('stroke',color);
    const t0=performance.now();
    (function tick(){
      if(run!==RUN)return res(false);
      const left=Math.max(0,secs-(performance.now()-t0)/1000);
      num.textContent=Math.ceil(left);arc.style.strokeDashoffset=414.7*(1-left/secs);
      if(left<=0)return res(true);requestAnimationFrame(tick);
    })();
  });
}

/* ================= STORAGE (IndexedDB) ================= */
let dbp;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('pretest',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('sessions',{keyPath:'id'});const s=d.createObjectStore('recs',{keyPath:'id'});s.createIndex('sid','sid')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const out=fn(t.objectStore(store));t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
const putS=s=>tx('sessions','readwrite',st=>st.put(s));
const putR=r=>tx('recs','readwrite',st=>st.put(r));
const allS=()=>tx('sessions','readonly',st=>st.getAll());
const recsOf=sid=>tx('recs','readonly',st=>st.index('sid').getAll(sid));
async function delSession(sid){const rs=await recsOf(sid);await tx('recs','readwrite',st=>rs.forEach(r=>st.delete(r.id)));await tx('sessions','readwrite',st=>st.delete(sid))}

/* ================= RECORDING ================= */
let stream=null;
async function getMic(){
  if(stream&&stream.active)return stream;
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  return stream;
}
class Recorder{
  constructor(onLevel){this.onLevel=onLevel}
  async start(){
    const s=await getMic();
    const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
    const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    this.chunks=[];const o={audioBitsPerSecond:64000};if(mt)o.mimeType=mt;let mr;try{mr=new MediaRecorder(s,o)}catch(e){mr=new MediaRecorder(s,mt?{mimeType:mt}:{})}this.mr=mr; // 64 kbit/s: clear for listening, small to send
    this.mr.ondataavailable=e=>e.data.size&&this.chunks.push(e.data);
    this.mr.start(500);this.t0=Date.now();
    try{this.ac=new (window.AudioContext||window.webkitAudioContext)();const src=this.ac.createMediaStreamSource(s);this.an=this.ac.createAnalyser();this.an.fftSize=512;src.connect(this.an);
      const buf=new Uint8Array(this.an.fftSize);const loop=()=>{if(!this.an)return;this.an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));this.onLevel&&this.onLevel(m/128);this.raf=requestAnimationFrame(loop)};loop()}catch(e){}
  }
  stop(){return new Promise(res=>{
    const done=async()=>{cancelAnimationFrame(this.raf);this.an=null;try{this.ac&&this.ac.close()}catch(e){}
      const raw=new Blob(this.chunks,{type:this.mr.mimeType||'audio/webm'});const dur=(Date.now()-this.t0)/1000;
      let wav=null;try{wav=await toWav(raw)}catch(e){console.warn('wav',e)}
      const rext=raw.type.includes('mp4')?'m4a':raw.type.includes('ogg')?'ogg':'webm';
      res(wav?{blob:wav,mime:'audio/wav',ext:'wav',dur,raw}:{blob:raw,mime:raw.type,ext:rext,dur})};
    if(this.mr.state==='inactive')return done();
    this.mr.onstop=done;this.mr.stop();
  })}
}
async function toWav(blob){
  const ab=await blob.arrayBuffer();const ac=new (window.AudioContext||window.webkitAudioContext)();
  const audio=await ac.decodeAudioData(ab);ac.close();
  const rate=16000,len=Math.ceil(audio.duration*rate);
  const off=new OfflineAudioContext(1,len,rate);const src=off.createBufferSource();src.buffer=audio;src.connect(off.destination);src.start();
  const r=await off.startRendering();const d=r.getChannelData(0);
  const buf=new ArrayBuffer(44+d.length*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);
  for(let i=0;i<d.length;i++){const x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}
  return new Blob([buf],{type:'audio/wav'});
}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
const safe=s=>String(s).trim().replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,40)||'student';
function fileName(sess,rec){return `${safe(sess.name)}_${rec.key}.${rec.ext}`}

/* save a copy on the phone: Documents/SpeakingPreTest/<name_date>/ */
async function saveToPhone(sess,rec){
  const fs=P().Filesystem;if(!isNative()||!fs)return false;
  const data=await b64(rec.blob);const path=`SpeakingPreTest/${safe(sess.name)}_${sess.stamp}/${fileName(sess,rec)}`;
  try{await fs.writeFile({path,data,directory:'DOCUMENTS',recursive:true});return true}
  catch(e){try{await fs.writeFile({path,data,directory:'DATA',recursive:true});return true}catch(e2){return false}}
}

/* ================= SHARE ================= */
async function shareRecs(sess,recs){
  const summary=`Speaking Pre-Test — Alfikr Almodi School\nStudent: ${sess.name}\nDate: ${new Date(sess.date).toLocaleString()}\nAnswers: ${recs.map(r=>r.label).join(', ')}`;
  const fs=P().Filesystem,sh=P().Share;
  if(isNative()&&fs&&sh){
    try{
      const files=[];
      for(const r of recs){const w=await fs.writeFile({path:`share/${fileName(sess,r)}`,data:await b64(r.blob),directory:'CACHE',recursive:true});files.push(w.uri)}
      await sh.share({title:'Speaking Pre-Test',text:summary,files,dialogTitle:'Share answers'});return;
    }catch(e){if(String(e).match(/cancel/i))return;console.warn(e)}
  }
  try{
    const files=recs.map(r=>new File([r.blob],fileName(sess,r),{type:r.mime}));
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:summary,title:'Speaking Pre-Test'});return}
  }catch(e){if(e.name==='AbortError')return}
  // fallback: download
  recs.forEach(r=>{const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=fileName(sess,r);a.click()});
  toast('Files downloaded');
}

/* ================= SESSION ================= */
let S=null; // {id,name,date,stamp,pic}
async function newSession(name){
  const d=new Date();const stamp=d.toISOString().slice(0,16).replace(/[-:T]/g,'');
  S={id:'s'+Date.now(),name,date:d.getTime(),stamp,count:0};await putS(S);
}
async function storeRec(key,label,res){
  const rec={id:S.id+'_'+key,sid:S.id,key,label,blob:res.blob,mime:res.mime,ext:res.ext,dur:res.dur,marks:res.marks||null,raw:res.raw||null,at:Date.now()};
  await putR(rec);const all=await recsOf(S.id);S.count=all.length;await putS(S);
  const phone=await saveToPhone(S,rec);
  return {rec,phone};
}

/* Renders a microphone button. Student taps to start, taps again to stop (or auto-stop at maxSec).
   Returns the saved recording. */
function micBlock(id){return `<div class="micwrap" id="${id}">
  <button class="mic ready" aria-label="Record">${MIC_SVG}</button>
  <div class="miclabel">Tap the microphone and answer<div class="ar mut" style="text-align:center">اضغط على الميكروفون وأجب</div></div>
  <div class="status rt" hidden><span class="recdot"></span><span class="tm">0:00</span></div>
  <div class="bar" style="width:100%" hidden><i></i></div>
</div>`}
function useMic(root,{key,label,maxSec=60,autoStart=false,run}){
  return new Promise(resolve=>{
    const btn=root.querySelector('.mic'),lbl=root.querySelector('.miclabel'),rt=root.querySelector('.rt'),tm=root.querySelector('.tm'),bar=root.querySelector('.bar'),bi=bar.querySelector('i');
    let rec=null,timer=null,t0=0,busy=false;
    const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    async function start(){
      if(busy)return;busy=true;stopSpeech();
      rec=new Recorder(l=>btn.style.setProperty('--lvl',1+Math.min(.35,l*1.2)));
      try{await rec.start()}catch(e){busy=false;toast('Microphone not allowed — السماح بالميكروفون مطلوب',3500);return}
      btn.classList.remove('ready');btn.classList.add('rec');btn.innerHTML=STOP_SVG;
      lbl.innerHTML='Recording… tap to finish<div class="ar mut" style="text-align:center">جارٍ التسجيل… اضغط للإنهاء</div>';
      rt.hidden=false;bar.hidden=false;t0=Date.now();busy=false;
      timer=setInterval(()=>{const s=(Date.now()-t0)/1000;tm.textContent=fmt(s)+' / '+fmt(maxSec);bi.style.width=Math.min(100,s/maxSec*100)+'%';if(s>=maxSec||run!==RUN)stop()},200);
    }
    async function stop(){
      if(busy||!rec)return;busy=true;clearInterval(timer);
      btn.disabled=true;lbl.textContent='Saving…';
      const res=await rec.stop();rec=null;
      if(run!==RUN)return resolve(null);
      const {rec:saved,phone}=await storeRec(key,label,res);
      root.innerHTML=`<div class="saved">✓ Answer saved ${phone?'on the phone':''}<div class="ar" style="text-align:center;font-weight:600">تم حفظ الإجابة</div></div>
        <audio controls src="${URL.createObjectURL(saved.blob)}"></audio>`;
      resolve(saved);
    }
    btn.onclick=()=>rec?stop():start();
    if(autoStart)start();
  });
}

/* ================= TEACHER PERMISSION =================
   The teacher opens "Teacher" mode (password) and reads the START CODE aloud.
   The code is the same on every phone (computed from the clock + a secret) and
   changes every CODE_MINUTES minutes, so no internet is needed.
   ► Change TEACHER_PASSWORD and CODE_SECRET before building for the school. */
const TEACHER_PASSWORD='2027';
const CODE_SECRET='alfikr-almodi-speaking-pretest';
const CODE_MINUTES=10;
function hash32(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0)*4096+(h1>>>20)}
const slotNow=()=>Math.floor(Date.now()/(CODE_MINUTES*60000));
const codeFor=slot=>String(hash32(CODE_SECRET+':'+slot)%10000).padStart(4,'0');
const codeOk=c=>{const s=slotNow();return [s,s-1].some(x=>codeFor(x)===c)}; // current or previous code (clock tolerance)

}

}

/* ================= AUTOMATIC SCORING (on the phone, no internet) =================
   Runs when the student finishes. It measures the recordings themselves:
   • Questions 1-3: speaking time, pauses, speech/silence ratio → fluency estimate /10
   • Tasks 1-3: how many items the student answered and how fast (reaction time)
   It cannot know if a word is RIGHT (that needs speech recognition), so the
   teacher still marks correctness. ► Tune the constants below if needed. */
let MARKS=[];const mark=w=>MARKS.push({t:Date.now(),w});
const AUTO={frame:0.02,minPause:0.25,minSeg:0.1,minRT:0.15,targetSpeak:40};
async function speechSegments(blob){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  let buf;try{buf=await ac.decodeAudioData(await blob.arrayBuffer())}finally{try{ac.close()}catch(e){}}
  const d=buf.getChannelData(0),sr=buf.sampleRate,fl=Math.max(1,Math.round(sr*AUTO.frame)),db=[];
  for(let i=0;i+fl<=d.length;i+=fl){let e=0;for(let j=i;j<i+fl;j++)e+=d[j]*d[j];db.push(10*Math.log10(e/fl+1e-12))}
  const srt=[...db].sort((a,b)=>a-b),pc=q=>srt[Math.min(srt.length-1,Math.floor(q*srt.length))]||-120;
  const noise=pc(.1),peak=pc(.98);const dur=d.length/sr;

  const thr=noise+Math.max(8,.3*(peak-noise));let segs=[],cur=null;
  db.forEach((v,i)=>{const t=i*AUTO.frame;if(v>=thr){if(!cur)cur={s:t,e:t+AUTO.frame};else cur.e=t+AUTO.frame}else if(cur){segs.push(cur);cur=null}});if(cur)segs.push(cur);
  const merged=[];for(const g of segs){const l=merged[merged.length-1];if(l&&g.s-l.e<AUTO.minPause)l.e=g.e;else merged.push({...g})}

}
const r1=v=>Math.round(v*10)/10;
function fluencyOf({dur,segs}){
  if(!segs.length)return {speak:0,ptr:0,pauses:0,pausesMin:0,meanPause:0,mlr:0,est:0,dur:r1(dur)};
  const speak=segs.reduce((a,g)=>a+g.e-g.s,0),span=segs[segs.length-1].e-segs[0].s;
  const gaps=segs.slice(1).map((g,i)=>g.s-segs[i].e),ptr=span>0?speak/span:1;
  const est=Math.round(10*(.5*Math.min(speak/AUTO.targetSpeak,1)+.5*Math.max(0,Math.min(1,(ptr-.3)/.5))));
  return {speak:r1(speak),ptr:Math.round(ptr*100),pauses:gaps.length,pausesMin:r1(gaps.length/Math.max(span/60,1/60)),
    meanPause:r1(gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:0),mlr:r1(speak/(gaps.length+1)),est,dur:r1(dur)};
}

  marks.forEach(m=>{const g=segs.find(g=>g.s>=m.t+AUTO.minRT&&g.s<=m.t+m.w+.3);if(g){answered++;rts.push(g.s-m.t)}});
  rts.sort((a,b)=>a-b);
  return {n:marks.length,answered,rtMean:rts.length?Math.round(1000*rts.reduce((a,b)=>a+b,0)/rts.length):null,rtMedian:rts.length?Math.round(1000*rts[Math.floor(rts.length/2)]):null};
}
async function autoScore(sess,recs){
  const out={};
  for(const r of recs){try{const sg=await speechSegments(r.blob);
    out[r.key]=SPEAK_KEYS.includes(r.key)?fluencyOf(sg):(reactionOf(sg,r.marks)||{n:0,answered:null})}catch(e){out[r.key]={error:true}}}
  sess.auto=out;sess.autoAt=Date.now();await putS(sess);return out;
}
function autoLine(sess,key){
  const a=sess.auto&&sess.auto[key];if(!a)return '';if(a.error)return '<small class="auto">Auto: could not analyse · تعذّر التحليل</small>';
  const tx=sess.asr&&sess.asr[key];
  const trn=tx?`<details class="trn"><summary>📝 What the student said · ما قاله الطالب</summary><p>${esc(tx.text||'—')}</p>${tx.items?`<div class="items">${tx.items.map((it,i)=>`<span class="${it.ok?'ok':'no'}">${i+1}. ${esc(it.exp)}${it.ok?' ✓':` → ${esc(it.said||'—')}`}</span>`).join('')}</div>`:''}</details>`:'';
  if(SPEAK_KEYS.includes(key))return `<small class="auto">🤖 Auto: fluency ≈ <b>${a.est}/10</b> · speaking ${a.speak}s · ${a.pauses} pauses · speech ${a.ptr}%${a.wpm!=null?` · ${a.wpm} words/min`:''}</small>${trn}`;
  if(a.answered==null)return trn;

function autoSummary(s){
  if(!s.auto)return '';const q=SPEAK_KEYS.map(k=>s.auto[k]&&s.auto[k].est).filter(v=>v!=null);
  const parts=[];if(q.length)parts.push(`fluency ≈ ${q.reduce((a,b)=>a+b,0)}/${q.length*10}`);
  [['T1_colors','Colours'],['T2_letters','Letters'],['T3_pictures','Pictures']].forEach(([k,l])=>{const a=s.auto[k];if(a&&a.answered!=null)parts.push(`${l} ${a.correct!=null?a.correct+' correct':a.answered+' answered'}/${a.n}${a.rtMean!=null?' ('+a.rtMean+' ms)':''}`)});
  return parts.length?`<div class="auto">🤖 ${parts.join(' · ')}</div>`:'';
}


/* ================= SPEECH RECOGNITION CORRECTION (teacher) =================
   The teacher presses "Auto-correct": the app listens to every recording with
   Whisper (OpenAI's speech-recognition model, running inside the app) and checks
   the words: ink colours, letter sequences, picture names, and answer texts.
   The model (~40 MB) is downloaded once from the school website, then cached. */
const ASR_BASE=(/github\.io$/.test(location.hostname)||location.hostname==='localhost')?new URL('asr/',location.href).href:'https://djilalilakehal0-gif.github.io/speaking-pretest/asr/';

  T.env.useBrowserCache=false;T.env.backends.onnx.wasm.wasmPaths=ASR_BASE;
  T.env.backends.onnx.wasm.numThreads=self.crossOriginIsolated?Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2))):1;

/* Closed-vocabulary listening: for each answer we already know the possible words

  const out=await model.forward({encoder_outputs:T.cat(Array.from({length:n},()=>h),0),decoder_input_ids:new T.Tensor('int64',ids,[n,Lx])});
  const V=out.logits.dims[2],d=out.logits.data;

}
async function pcm16k(blob){
  const ac=new (window.AudioContext||window.webkitAudioContext)();let buf;
  try{buf=await ac.decodeAudioData(await blob.arrayBuffer())}finally{try{ac.close()}catch(e){}}

const nw=w=>String(w).toLowerCase().replace(/[^a-z]/g,'');

const COLORS=new Set([...Object.values(INK).map(c=>c.toLowerCase()),...STROOP.map(x=>x[0].toLowerCase()),'gray','orange','white']);

const LETTER_WORDS={a:'A',ay:'A',eh:'A',b:'B',be:'B',bee:'B',c:'C',see:'C',sea:'C',si:'C',d:'D',dee:'D',e:'E',f:'F',ef:'F',eff:'F',g:'G',gee:'G',ji:'G',h:'H',aitch:'H',haitch:'H',i:'I',eye:'I',ai:'I',j:'J',jay:'J',k:'K',kay:'K',l:'L',el:'L',ell:'L',m:'M',em:'M',n:'N',en:'N',o:'O',oh:'O',p:'P',pee:'P',pea:'P',q:'Q',cue:'Q',queue:'Q',r:'R',ar:'R',are:'R',s:'S',es:'S',ess:'S',t:'T',tee:'T',tea:'T',u:'U',you:'U',v:'V',vee:'V',w:'W',x:'X',ex:'X',y:'Y',why:'Y',z:'Z',zed:'Z',zee:'Z'};
function lettersOf(word){const raw=String(word).replace(/[^A-Za-z]/g,'');if(!raw)return [];
  if(raw.length>1&&raw.length<=8&&raw===raw.toUpperCase())return raw.split('');

const OBJ_SYN={book:['book','notebook'],pencil:['pencil'],chair:['chair'],bed:['bed'],table:['table','desk'],train:['train'],door:['door'],phone:['phone','telephone','mobile','smartphone','cellphone'],house:['house','home'],eggs:['egg','eggs'],glass:['glass'],elephant:['elephant'],fish:['fish'],car:['car'],flower:['flower','flowers'],jacket:['jacket','coat'],mouse:['mouse'],pot:['pot','saucepan'],boot:['boot','boots'],sun:['sun']};
async function transcribe(pcm,segs){
  const asr=await loadASR();
  const r=await asr(pcm,{language:'en',task:'transcribe',return_timestamps:'word',chunk_length_s:30,stride_length_s:5});
  let words=(r.chunks||[]).map(c=>({w:c.text.trim(),s:c.timestamp[0],e:c.timestamp[1]==null?c.timestamp[0]+0.3:c.timestamp[1]})).filter(x=>x.w);
  if(segs&&segs.length)words=words.filter(x=>segs.some(g=>x.e>=g.s-0.15&&x.s<=g.e+0.15)); // drop words heard in silence

/* Tasks: each answer is a short word said inside its own time window, so every window is
   cut out and heard on its own (Whisper is much more accurate on short clips). Windows
   with no voice are skipped, so the model cannot "imagine" words in silence. */
const GRACE={T1_colors:0.5,T2_letters:0.8,T3_pictures:0.5};

const OTHER=['Um.','I don\'t know.']; // "none of the answers"
function vocabFor(key){
  if(key==='T1_colors'){const c=[...new Set([...Object.values(INK),'Orange','White'].map(w=>w.toLowerCase()))];return c.map(w=>({w,t:cap(w)+'.'}))}
  if(key==='T3_pictures'){const v=[];OBJECTS.forEach(o=>(OBJ_SYN[o]||[o]).forEach(w=>v.push({w,o,t:cap(w)+'.'})));return v}
  return []}
let WLET=null;
function letterTokens(){if(WLET)return WLET;const m=new Map(),tok=WM.tok;
  for(let c=0;c<26;c++)for(const v of [' '+L(c),L(c)]){const t=tok.encode(v,{add_special_tokens:false});if(t.length===1)m.set(t[0],L(c))}
  for(const v of [',','.',' ,',' .','-',' -','...']){const t=tok.encode(v,{add_special_tokens:false});if(t.length===1)m.set(t[0],'')}
  return WLET=m}
async function wLetters(h,max=16){const {T,model}=WM,allow=letterTokens();const seq=[...WP];let out='';
  for(let k=0;k<max;k++){const o=await model.forward({encoder_outputs:h,decoder_input_ids:new T.Tensor('int64',BigInt64Array.from(seq.map(BigInt)),[1,seq.length])});
    const V=o.logits.dims[2],d=o.logits.data,off=(seq.length-1)*V;let best=WEOT,bv=d[off+WEOT];
    for(const t of allow.keys())if(d[off+t]>bv){bv=d[off+t];best=t}
    if(best===WEOT)break;seq.push(best);out+=allow.get(best)}
  return out}
const spell=x=>x.split('').join(', ')+'.';
async function transcribeWindows(pcm,marks,segs,grace,key){
  await loadASR();const out=[];
  for(const [i,m] of marks.entries()){const a=m.t,b=m.t+m.w+grace;
    const voiced=segs.filter(g=>g.e>a&&g.s<b);if(!voiced.length){out.push(null);continue} // silence = no answer
    const s0=Math.max(0,a,voiced[0].s-0.3),s1=Math.min(b,voiced[voiced.length-1].e+0.3,pcm.length/16000);
    const clip=new Float32Array(Math.round((s1-s0)*16000)+16000);clip.set(pcm.subarray(Math.round(s0*16000),Math.round(s1*16000)),8000);
    const h=await wEncode(clip);
    if(key==='T2_letters'){ // free letter listening, then check: does the correct sequence fit the sound better than what was heard?
      const exp=EQ[i].map(([x,y])=>L(x+y)).join('');const heard=await wLetters(h);
      if(!heard){out.push({w:'',t:'(no letters)'});continue}
      if(heard===exp){out.push({w:exp,t:exp});continue}
      const [se,sh]=await wScore(h,[spell(exp),spell(heard)]);out.push(se>=sh?{w:exp,t:exp}:{w:heard,t:heard});continue}
    const voc=vocabFor(key),all=[...voc,...OTHER.map(t=>({w:null,t}))];const sc=[];
    for(let k=0;k<all.length;k+=32)sc.push(...await wScore(h,all.slice(k,k+32).map(x=>x.t)));
    let bv=-1e9,bi=0,fo=-1e9,fi=-1;sc.forEach((v,k)=>{if(all[k].w){if(v>bv){bv=v;bi=k}}else if(v>fo){fo=v;fi=k}});
    out.push(fo>bv+1.5?{w:'',t:all[fi].t.replace('.','')}:all[bi])}

}
const toks=t=>String(t).split(/[\s,.;:!?\-]+/).filter(Boolean);
function checkStroop(picks){let correct=0,readWord=0;const items=[];
  picks.forEach((p,i)=>{const exp=INK[STROOP[i][1]].toLowerCase(),printed=STROOP[i][0].toLowerCase();const said=p&&p.w?colorOf(p.w)||p.w:null;
    const ok=said===exp;if(ok)correct++;else if(said&&said===printed)readWord++;items.push({exp,said:said||(p?p.t:''),ok})});
  return {correct,n:picks.length,readWord,items}}
function checkLetters(picks){let correct=0,letters=0,total=0;const items=[];
  picks.forEach((p,i)=>{const exp=EQ[i].map(([a,b])=>L(a+b));const got=p&&p.w?p.w.split(''):[];
    const ok=got.join('')===exp.join('');if(ok)correct++;exp.forEach((c,k)=>{total++;if(got[k]===c)letters++});items.push({exp:exp.join(''),said:got.join('')||(p?p.t:''),ok})});
  return {correct,n:picks.length,letters,lettersTotal:total,items}}
function checkNaming(picks){let correct=0;const items=[];
  picks.forEach((p,i)=>{const obj=OBJECTS[i];const ok=!!(p&&p.o===obj);if(ok)correct++;items.push({exp:obj,said:p?(p.w||p.t):'',ok})});
  return {correct,n:picks.length,items}}
async function asrCorrect(sess,onStep){
  const recs=(await recsOf(sess.id)).sort((a,b)=>a.key.localeCompare(b.key));
  sess.auto=sess.auto||{};sess.asr=sess.asr||{};
  for(const [i,r] of recs.entries()){onStep&&onStep(r.label,i,recs.length);
    const sg=await speechSegments(r.blob);const pcm=await pcm16k(r.blob);const task=!SPEAK_KEYS.includes(r.key)&&r.marks&&r.marks.length;

/* ================= SEND TO THE TEACHER (automatic) =================
   When the test ends, the recordings and the automatic scores are sent to the
   school's Google Sheet / Drive (see teacher/Code.gs). If there is no internet,
   they wait on the phone and are sent as soon as the phone is online again.
   The address of the Google script is read from sync.json on the website, so it
   can be set or changed without rebuilding the app. */
const SYNC_KEY='spt-alfikr-2026';
const SYNC_JSON='https://djilalilakehal0-gif.github.io/speaking-pretest/sync.json';
let SYNC_URL=null,SYNCING=null;
async function syncUrl(){
  if(SYNC_URL)return SYNC_URL;
  for(const u of isNative()?[SYNC_JSON,'sync.json']:['sync.json',SYNC_JSON]){
    try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&/^(https:\/\/|http:\/\/localhost)/.test(j.url||'')){SYNC_URL=j.url;try{localStorage.setItem('syncUrl',j.url)}catch(e){}return SYNC_URL}}}catch(e){}}
  try{SYNC_URL=localStorage.getItem('syncUrl')}catch(e){}
  return SYNC_URL;
}
async function post(url,body){
  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),90000);
  try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ac.signal,redirect:'follow'});
    const j=await r.json();if(!j.ok)throw new Error(j.err||'refused');return j}finally{clearTimeout(t)}
}
async function sendSession(s,url,onP){
  const recs=(await recsOf(s.id)).sort((a,b)=>a.key.localeCompare(b.key));
  if(!s.auto){try{await autoScore(s,recs)}catch(e){}}
  let n=0;
  for(const r of recs){if(r.up){n++;continue}
    const blob=r.raw||r.blob,ext=r.raw?(r.raw.type.includes('mp4')?'m4a':r.raw.type.includes('ogg')?'ogg':'webm'):r.ext;
    await post(url,{k:SYNC_KEY,a:'rec',sid:s.id,name:s.name,key:r.key,label:r.label,mime:blob.type||r.mime,ext,dur:r.dur,marks:r.marks||null,data:await b64(blob)});
    r.up=true;await putR(r);n++;onP&&onP(n,recs.length)}
  await post(url,{k:SYNC_KEY,a:'sess',sid:s.id,name:s.name,date:s.date,count:recs.length,auto:s.auto||{}});
  s.sent=Date.now();s.sentCount=recs.length;await putS(s);
}
function syncAll(onP){
  if(SYNCING)return SYNCING;
  SYNCING=(async()=>{const url=await syncUrl();if(!url)return 'off';
    const ss=(await allS()).filter(s=>s.count>0&&(!s.sent||s.sentCount!==s.count));let fail=0;
    for(const s of ss){try{await sendSession(s,url,onP&&((n,t)=>onP(s,n,t)))}catch(e){console.warn('send',e);fail++}}

}
addEventListener('online',()=>syncAll());

      <button class="btn small ghost" data-a="ac">${s.asrAt?'🤖 Auto-corrected ✓ (run again)':'🤖 Auto-correct this student · تصحيح تلقائي'}</button><div class="list" hidden></div>`;
    const lst=d.querySelector('.list');
    d.querySelector('[data-a=open]').onclick=async()=>{if(!lst.hidden){lst.hidden=true;return}renderRecs(lst,s,(await recsOf(s.id)).sort((a,b)=>a.key.localeCompare(b.key)),true,()=>{d.querySelector('.sc-sum').innerHTML=scoreSummary(s)});lst.hidden=false};
    d.querySelector('[data-a=share]').onclick=async()=>shareRecs(s,(await recsOf(s.id)).sort((a,b)=>a.key.localeCompare(b.key)));
    d.querySelector('[data-a=ac]').onclick=async e=>{const b=e.currentTarget;b.disabled=true;
      try{b.textContent='Loading model… تحميل النموذج';await loadASR();await asrCorrect(s,(lab,k,n)=>{b.textContent=`🤖 ${lab} (${k+1}/${n})…`});savedScreen()}
      catch(err){console.warn(err);b.disabled=false;b.textContent='⚠️ Failed — check internet · تحقّق من الإنترنت'}};
    d.querySelector('[data-a=del]').onclick=async()=>{if(confirm(`Delete ${s.name}'s answers? / حذف إجابات ${s.name}؟`)){await delSession(s.id);savedScreen()}};
    box.appendChild(d);
    if(!s.auto)recsOf(s.id).then(rs=>autoScore(s,rs)).then(()=>{d.querySelector('.au-sum').innerHTML=autoSummary(s)}).catch(()=>{});
  }
}

/* Android back button */
try{P().App&&P().App.addListener('backButton',()=>home())}catch(e){}
/* Offline support for the iPhone / web version (not needed inside the Android app) */
if('serviceWorker' in navigator&&!isNative()&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
home();
setTimeout(()=>syncAll(),3000);
</script>
</body>
</html>
