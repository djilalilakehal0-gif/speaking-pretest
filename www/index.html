<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pre-Test">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<style>
@font-face{font-family:Baloo;src:url(fonts/baloo-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(fonts/baloo-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(fonts/baloo-600.woff2) format('woff2');font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(fonts/baloo-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(fonts/baloo-800.woff2) format('woff2');font-weight:800 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:Baloo;src:url(fonts/baloo-ar-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(fonts/baloo-ar-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(fonts/baloo-ar-600.woff2) format('woff2');font-weight:600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(fonts/baloo-ar-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Baloo;src:url(fonts/baloo-ar-800.woff2) format('woff2');font-weight:800 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
:root{
  --navy:#1e2156;--navy2:#343a8f;--paper:#fbf6ec;--surface:#fff;--ink:#1d1e38;--slate:#62647f;--line:#ece2cb;
  --accent:#f0b429;--gold:#e9a817;--gold2:#f0b429;--goldbg:#fff3d4;--red:#d64545;--green:#21966a;--coral:#ff7a59;--teal:#22b3a6;
  --shadow:0 10px 28px rgba(30,33,86,.10),0 2px 6px rgba(30,33,86,.05);
  --mut:var(--slate);--card:var(--surface);--bg:var(--paper);
  --font:Baloo,system-ui,sans-serif;--font-ar:Baloo,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;-webkit-font-smoothing:antialiased}
body{padding:0 0 env(safe-area-inset-bottom,0);background:var(--paper) radial-gradient(circle at 1px 1px,rgba(30,33,86,.07) 1px,transparent 0) 0 0/22px 22px}
.ar{font-family:var(--font-ar);direction:rtl;text-align:right;line-height:1.7}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* header: indigo band + stage track */
header.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:calc(14px + env(safe-area-inset-top,0)) 18px 16px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:0 0 30px 30px;box-shadow:0 10px 24px rgba(30,33,86,.22)}
header.top img{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 2px var(--accent)}
header.top .t{font-weight:700;font-size:16px;line-height:1.15;letter-spacing:.2px}
header.top .s{font-size:13px;color:#c6c9f2;line-height:1.3}
header.top .step{font-size:13px;font-weight:800;color:var(--ink);background:linear-gradient(180deg,#ffd166,var(--accent));border-radius:999px;padding:5px 13px 3px;white-space:nowrap;box-shadow:0 3px 0 #c98f0f}
header.top .step:empty{display:none}
.track{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.track i{height:8px;border-radius:8px;background:rgba(255,255,255,.16);transition:background .4s,transform .4s}
.track i.done{background:linear-gradient(90deg,#ffd166,var(--accent))}
.track i.now{background:#fff;transform:scaleY(1.25)}

main{flex:1;padding:22px 16px 34px;display:flex;flex-direction:column;gap:18px}
.screen{display:flex;flex-direction:column;gap:18px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{position:relative;background:var(--surface);border:2px solid #f3ead6;border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;top:-2px;left:28px;right:28px;height:5px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--accent),var(--coral))}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.2px;color:var(--navy)}
h2{font-size:21px;line-height:1.25;font-weight:700;margin:0;color:var(--navy)}
p{margin:0;line-height:1.55}
.mut{color:var(--slate);font-size:15px}

/* about the study */
.about{display:flex;flex-direction:column;gap:10px;background:transparent;border:0;border-top:2px dashed var(--line);border-radius:0;box-shadow:none;padding:20px 2px 4px;font-size:14.5px;color:var(--slate)}
.about::before{display:none}
.about p{line-height:1.65}
.about b{color:var(--ink);font-weight:700}
.about details{border-top:1px dashed var(--line);padding-top:10px}
.about summary{cursor:pointer;color:var(--navy2);font-weight:700;font-size:15px}
.about details p{margin-top:8px;line-height:1.85}

/* buttons: rounded pills with a soft 3D edge */
.btn{appearance:none;border:0;border-radius:999px;padding:16px 22px 14px;font:700 18px var(--font);background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;width:100%;cursor:pointer;box-shadow:0 5px 0 #11133a,0 10px 20px rgba(30,33,86,.18);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #11133a,0 4px 10px rgba(30,33,86,.15)}
.btn.ghost{background:var(--surface);color:var(--navy);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:hover{border-color:var(--navy2);filter:none}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.accent{background:linear-gradient(180deg,#ffd166,var(--accent));color:var(--ink);box-shadow:0 5px 0 #c98f0f,0 10px 20px rgba(240,180,41,.28)}
.btn.accent:active{box-shadow:0 1px 0 #c98f0f}
.btn.small{padding:10px 16px 8px;font-size:15px;width:auto;box-shadow:0 3px 0 #11133a}
.btn:disabled{opacity:.45}
.row{display:flex;gap:12px}
.row>*{flex:1}
input.name{width:100%;padding:15px 20px 13px;border-radius:18px;border:2px solid var(--line);font:600 18px var(--font);background:#fffaf0;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
input.name::placeholder{color:#a9a39a;font-weight:500}
input.name:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 5px rgba(240,180,41,.22)}

/* home */
.hero{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:16px;padding:6px 2px 2px}
.hero img{width:76px;height:76px}
.hero h1{font-size:28px}
.hero .mut{margin-top:4px}
.form{display:flex;flex-direction:column;gap:8px}
.form .lbl{font-weight:700;font-size:17px;margin-top:8px;color:var(--navy)}
.form .lbl:first-child{margin-top:0}
.form .btn{margin-top:12px}

/* questions */
.q{font-size:23px;font-weight:600;line-height:1.45;color:var(--ink);padding:10px 4px 0 32px;position:relative}
.q::before{content:"“";position:absolute;left:-2px;top:-4px;font-size:64px;line-height:1;color:var(--accent);font-weight:800}
.qar{font-size:18px;line-height:1.7;color:var(--slate)}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:18px;color:var(--navy2);min-height:26px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 16px 8px;align-self:center}
.status:empty{display:none}
.ring{position:relative;width:150px;height:150px;margin:6px auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}

/* microphone */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.mic{width:128px;height:128px;border-radius:50%;border:6px solid #fff;background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(240,180,41,.25),0 14px 28px rgba(30,33,86,.25);cursor:pointer;position:relative}
.mic svg{width:52px;height:52px}
.mic.ready{animation:pulse 1.8s infinite}
.mic.rec{background:linear-gradient(160deg,#ef6b6b,var(--red));box-shadow:0 0 0 10px rgba(214,69,69,.16),0 0 0 22px rgba(214,69,69,.07)}
.mic.rec::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(214,69,69,.4);transform:scale(var(--lvl,1));transition:transform .08s}
.mic:disabled{filter:grayscale(.8);opacity:.5;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,180,41,.6),0 14px 28px rgba(30,33,86,.25)}70%{box-shadow:0 0 0 24px rgba(240,180,41,0),0 14px 28px rgba(30,33,86,.25)}100%{box-shadow:0 0 0 0 rgba(240,180,41,0),0 14px 28px rgba(30,33,86,.25)}}
@media (prefers-reduced-motion:reduce){.mic.ready{animation:none}.track i{transition:none}.screen{animation:none}}
.miclabel{font-weight:700;font-size:18px;text-align:center;color:var(--navy)}
.recdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.saved{color:var(--green);font-weight:800;font-size:19px;text-align:center;background:#e7f7ef;border:2px solid #bfe8d3;border-radius:22px;padding:12px 16px 10px;width:100%}
audio{width:100%}

/* pictures & tasks */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pics button{padding:0;border:4px solid #fff;border-radius:22px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.pics button:active{transform:scale(.97)}
.pics button img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pics button.sel,.pics button:focus-visible{border-color:var(--accent)}
.bigpic{width:100%;border-radius:20px;display:block;background:#fff}
.stage{min-height:300px;display:flex;align-items:center;justify-content:center;border-radius:28px;background:#e4e4e4;border:3px solid #fff;box-shadow:var(--shadow)}
.stroop{font-size:56px;font-weight:800;letter-spacing:.5px}
.eqs{background:#f6f3ec;border-radius:20px;padding:22px;font:700 25px/1.9 var(--font);text-align:center;width:100%;font-variant-numeric:tabular-nums}
.white{background:#fff}
.bar{height:10px;border-radius:10px;background:#efe6d2;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--coral));width:0;transition:width .3s;border-radius:10px}

/* saved answers */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:2px solid #f3ead6;border-radius:20px;padding:12px 14px;background:#fffdf8;display:flex;flex-direction:column;gap:8px}
.item .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.item .h small{color:var(--slate);font-weight:500}
.sess{border:2px solid #f3ead6;box-shadow:var(--shadow);border-radius:24px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.score{display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--goldbg);border-radius:16px}
.score label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.score input{width:76px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;font:700 18px var(--font);text-align:center;background:#fff;color:var(--ink)}
.score input:focus{outline:none;border-color:var(--accent)}
.score input.saved-ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(33,150,106,.15)}
.score span{color:var(--slate);font-weight:500}
.auto{display:block;color:#3b4aa8;font-size:14px;margin-top:4px}.au-sum .auto{margin-top:2px}
.acst{background:#eef0fd;border:2px solid #d6daf7;color:#252a6b;border-radius:16px;padding:10px 12px;font-size:15px}
.af{font-style:normal;font-size:13px;color:#3b4aa8;font-weight:700}
.trn{margin-top:6px;font-size:14px}.trn summary{cursor:pointer;color:#3b4aa8;font-weight:700}.trn p{margin:6px 0;color:var(--ink);line-height:1.5}
.items{display:flex;flex-wrap:wrap;gap:4px}.items span{font-size:13px;border-radius:8px;padding:2px 7px}.items .ok{background:#e7f7ef;color:#1a7a55}.items .no{background:#fdecec;color:#b83232}
.sendst{border-radius:20px;padding:13px 16px 11px;font-size:15px;font-weight:700;background:#eef0fd;color:#252a6b;text-align:center;border:2px solid #d6daf7}.sendst.ok{background:#e7f7ef;color:#1a7a55;border-color:#bfe8d3}.sendst.wait{background:#fff6e0;color:#8a6519;border-color:#f6e2ae}
.sc-sum{margin-top:4px;font-size:14px}.sc-sum .graded{color:var(--green);font-weight:700}.sc-sum .ungraded{color:#a5641a;font-weight:500}
.tag{font-size:14px;background:linear-gradient(180deg,#ffe08a,var(--accent));color:#4a3300;border-radius:999px;padding:4px 14px 2px;font-weight:800;box-shadow:0 3px 0 #d39a16;letter-spacing:.2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px 10px;border-radius:999px;font-weight:600;font-size:15px;z-index:9;max-width:90%;box-shadow:0 8px 22px rgba(30,33,86,.3)}

/* ---- welcome screen ---- */
body.home header.top{display:none}
body.home main{padding-top:0}
.welcome{margin:0 -16px;padding:calc(36px + env(safe-area-inset-top,0)) 22px 84px;background:linear-gradient(160deg,var(--navy2) 0%,var(--navy) 70%);color:#fff;text-align:center;position:relative;overflow:hidden;border-radius:0 0 44px 44px}
.welcome::before{content:"";position:absolute;left:50%;top:-140px;width:520px;height:520px;margin-left:-260px;border-radius:50%;border:2px dashed rgba(240,180,41,.22);box-shadow:0 0 0 46px rgba(240,180,41,.04),0 0 0 92px rgba(240,180,41,.03)}
.welcome::after{content:"✦  ✧  ✦";position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0));color:rgba(255,209,102,.5);font-size:14px;letter-spacing:6px}
.welcome>*{position:relative}
.welcome .crest{width:104px;height:104px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 4px var(--accent),0 0 0 10px rgba(240,180,41,.2),0 12px 30px rgba(0,0,0,.3);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.welcome .school{margin-top:16px;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
.welcome h1{color:#fff;font-size:40px;margin-top:2px;letter-spacing:-.3px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.welcome .lead{color:#d2d5f6;font-size:16px;margin-top:4px}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.areas div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;line-height:1.25;color:#e2e4fa}
.areas svg{width:48px;height:48px;padding:12px;border-radius:18px;background:rgba(255,255,255,.1);border:1.5px solid rgba(240,180,41,.35);color:var(--accent)}
.form.lift{margin-top:-58px;position:relative;border-radius:32px;padding:26px 22px 24px;box-shadow:0 20px 44px rgba(30,33,86,.18)}
.teacher-link{align-self:center;width:auto;display:flex;align-items:center;gap:8px;padding:11px 20px 9px;border-radius:999px;font-size:15px;font-weight:700;color:var(--navy);border-color:var(--line);background:#fff}
.teacher-link svg{width:16px;height:16px}

/* ---- finish screen ---- */
.donehero{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;border-radius:32px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 16px 36px rgba(30,33,86,.25)}
.donehero .ok{width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,#ffd166,var(--accent));color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(240,180,41,.22);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.donehero .ok svg{width:38px;height:38px}
.donehero h1{color:#fff;font-size:32px}
.donehero p{color:#d2d5f6}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-inline-end:8px}
.teacher-link:hover{color:var(--navy);border-color:var(--navy2)}

/* ---- celebration (fireworks after each answer) ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.cheer{position:fixed;left:50%;top:38%;z-index:21;pointer-events:none;transform:translate(-50%,-50%);background:#fff;color:var(--navy);border:3px solid var(--accent);border-radius:28px;padding:14px 26px 10px;text-align:center;box-shadow:0 18px 40px rgba(30,33,86,.25);animation:cheer 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
.cheer b{display:block;white-space:nowrap;font-size:30px;font-weight:800;line-height:1.1}
.cheer span{display:block;font-size:20px;font-weight:700;color:var(--gold);direction:rtl}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.prhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prnote{font-size:13px;font-weight:700;color:var(--slate);background:#fff;border:2px dashed var(--line);border-radius:999px;padding:4px 12px 2px}
.prans{display:flex;flex-direction:column;gap:10px;background:#e7f7ef;border:2px solid #bfe8d3;border-radius:24px;padding:16px;color:#1a7a55}
.prans>b{font-size:17px}

<script>
/* ================= DATA ================= */

const SCENES=['img/scene1.jpg','img/scene2.jpg','img/scene3.jpg','img/scene4.jpg'];
const STROOP=[["Turquoise","#05defb"],["Blue","#ff0000"],["Bicycle","#ff0000"],["Black","#000000"],["Yellow","#002060"],["Friend","#ffff00"],["Brown","#843c0c"],["Red","#ffff00"],["Music","#002060"],["Grey","#808080"],["Green","#ff0000"],["Garden","#00b050"],["Purple","#7030a0"],["Yellow","#00b050"],["School","#ffff00"],["Pink","#e696e0"],["Blue","#ffff00"],["Pencil","#ff0000"],["Orange","#ff0000"],["Green","#002060"],["Window","#00b050"],["Green","#00b050"],["Red","#00b050"],["Apple","#002060"],["Yellow","#ffff00"],["Yellow","#ff0000"],["Chair","#ffff00"],["Blue","#002060"],["Green","#ffff00"],["Book","#00b050"],["Red","#ff0000"],["Blue","#00b050"],["House","#002060"],["Gold","#b49600"],["Red","#002060"],["Table","#ff0000"]];

const EQ=[ // [a,b] pairs; letter = A + sum
 [[1,4],[2,5],[1,7]],[[1,2],[2,2],[3,3]],[[2,3],[4,2],[1,7]],[[2,1],[1,3],[2,3],[1,5]],[[2,1],[1,3],[2,3],[1,5]],[[1,5],[2,5],[1,7],[4,5]],
 [[3,1],[2,4],[1,5],[3,4],[4,5]],[[1,2],[2,3],[1,4],[2,4],[1,6]],[[2,2],[1,3],[2,5],[1,7],[3,6]],[[1,5],[2,4],[4,5],[1,3],[2,5],[3,2]],
 [[2,3],[3,1],[1,6],[2,2],[3,5],[1,4]],[[3,2],[1,7],[2,1],[3,3],[4,4],[4,5]]];
const L=n=>String.fromCharCode(65+n);
const OBJECTS=["book","pencil","chair","bed","table","train","door","phone","house","eggs","glass","elephant","fish","car","flower","jacket","mouse","pot","boot","sun"];

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const M=$('#main');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P=()=>(window.Capacitor&&Capacitor.Plugins)||{};
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,ms)}

/* ---------- celebration: fireworks + confetti after every finished answer ---------- */
const CHEERS=[['Great job!','أحسنت!'],['Well done!','ممتاز!'],['Excellent!','رائع!'],['Super!','عمل رائع!'],['Amazing!','مذهل!']];
/* fireworks sound, made on the phone (no file): a happy chime, then launches, bangs and crackles */
let FXA=null;
function fxCtx(){try{if(!FXA)FXA=new (window.AudioContext||window.webkitAudioContext)();if(FXA.state==='suspended')FXA.resume();return FXA}catch(e){return null}}
['touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(FXA&&FXA.state==='suspended')FXA.resume()},{capture:true,passive:true}));
function fxNoise(a,dur){const b=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;return s}
function fxSound(delays,big){
  const a=fxCtx();if(!a)return;const t0=a.currentTime+.03,out=a.createGain();out.gain.value=big?.55:.45;out.connect(a.destination);
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ // chime: C-E-G-C
    const o=a.createOscillator(),g=a.createGain(),t=t0+i*.09;o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+(i===3?.9:.35));o.connect(g).connect(out);o.start(t);o.stop(t+1)});
  delays.forEach(d=>{const t=t0+d/1000;
    const w=fxNoise(a,.35),wf=a.createBiquadFilter(),wg=a.createGain(); // launch whoosh
    const tw=Math.max(t0,t-.3);
    wf.type='bandpass';wf.Q.value=4;wf.frequency.setValueAtTime(500,tw);wf.frequency.exponentialRampToValueAtTime(3500,t);
    wg.gain.setValueAtTime(0,tw);wg.gain.linearRampToValueAtTime(.18,(tw+t)/2);wg.gain.linearRampToValueAtTime(0,t);
    w.connect(wf).connect(wg).connect(out);w.start(tw);
    const n=fxNoise(a,1),f=a.createBiquadFilter(),g=a.createGain(); // bang
    f.type='lowpass';f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(180,t+.8);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);n.connect(f).connect(g).connect(out);n.start(t);
    for(let k=0;k<14;k++){const ct=t+.18+Math.random()*.9,c=fxNoise(a,.03),cf=a.createBiquadFilter(),cg=a.createGain(); // crackles
      cf.type='highpass';cf.frequency.value=2500+Math.random()*3000;cg.gain.setValueAtTime(.25*Math.random()+.08,ct);cg.gain.exponentialRampToValueAtTime(.001,ct+.03);
      c.connect(cf).connect(cg).connect(out);c.start(ct)}
  });
}
const FX={parts:[],run:false,cv:null,g:null};
function celebrate(big){
  const c=CHEERS[Math.floor(Math.random()*CHEERS.length)];
  document.querySelectorAll('.cheer').forEach(e=>e.remove());
  const ch=document.createElement('div');ch.className='cheer';ch.setAttribute('role','status');
  ch.innerHTML=`<b>${big?'🏆':'🎉'} ${c[0]}</b><span>${c[1]}</span>`;document.body.appendChild(ch);setTimeout(()=>ch.remove(),2300);
  const bursts=big?8:4,delays=[];for(let b=0;b<bursts;b++)delays.push((b?delays[b-1]:250)+(b?260+Math.random()*160:0));
  try{fxSound(delays,big)}catch(e){}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(!FX.cv){FX.cv=document.createElement('canvas');FX.cv.id='fx';document.body.appendChild(FX.cv);FX.g=FX.cv.getContext('2d')}
  const W=innerWidth,H=innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  if(FX.cv.width!==W*dpr||FX.cv.height!==H*dpr){FX.cv.width=W*dpr;FX.cv.height=H*dpr}FX.g.setTransform(dpr,0,0,dpr,0,0);
  const COLS=['#f0b429','#ffd166','#ff7a59','#22b3a6','#5b6cff','#ff5fa2','#7ee081'];
  const rnd=(a,b)=>a+Math.random()*(b-a),col=()=>COLS[Math.floor(Math.random()*COLS.length)];
  const now=performance.now();
  for(let b=0;b<bursts;b++){ // fireworks: each burst explodes a little later than the previous one
    const x=rnd(.15,.85)*W,y=rnd(.12,.42)*H,t=now+delays[b],n=big?70:55,k=col(),k2=col();
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n+rnd(-.08,.08),s=rnd(2.2,6.2);
      FX.parts.push({f:1,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:i%3?k:k2,t,life:rnd(55,85),age:0,r:rnd(1.8,3)})}
  }
  for(let i=0;i<(big?160:70);i++) // confetti falling from the top
    FX.parts.push({f:0,x:rnd(0,W),y:rnd(-H*.4,-10),vx:rnd(-1.2,1.2),vy:rnd(2,4.5),c:col(),t:now+rnd(0,500),life:rnd(150,220),age:0,w:rnd(6,11),h:rnd(4,7),rot:rnd(0,6.3),vr:rnd(-.25,.25)});
  if(!FX.run){FX.run=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(ts){
  const g=FX.g,W=innerWidth,H=innerHeight;g.clearRect(0,0,W,H);
  FX.parts=FX.parts.filter(p=>{
    if(ts<p.t)return true;
    p.age++;if(p.age>p.life)return false;
    const fade=Math.min(1,(p.life-p.age)/25);g.globalAlpha=fade;g.fillStyle=p.c;
    if(p.f){p.vx*=.975;p.vy=p.vy*.975+.07;p.x+=p.vx;p.y+=p.vy;
      if(Math.random()<.85){g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}
      g.globalAlpha=fade*.35;g.beginPath();g.arc(p.x-p.vx*2,p.y-p.vy*2,p.r*.7,0,6.283);g.fill()}
    else{p.x+=p.vx+Math.sin(p.age/12)*.6;p.y+=p.vy;p.rot+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.age/8)));g.restore();if(p.y>H+20)return false}
    return true});
  g.globalAlpha=1;
  if(FX.parts.length)requestAnimationFrame(fxLoop);else{FX.run=false;g.clearRect(0,0,W,H)}
}
const STAGES=['Question 1/3','Question 2/3','Question 3/3','Task 1/3','Task 2/3','Task 3/3'];
function step(t){if(t)document.body.classList.remove('home');$('#stepLbl').textContent=t||'';const tr=$('#track');if(!tr)return;
  let k=STAGES.indexOf(t);const mm=/^Mock (\d)\/6$/.exec(t||'');if(mm)k=+mm[1]-1;if(t==='Intro')k=-1;else if(t==='Done')k=6;else if(k<0){tr.hidden=true;return}
  tr.hidden=false;[...tr.children].forEach((e,i)=>{e.className=i<k?'done':i===k?'now':''})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>';
const STOP_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
let RUN=0; // cancels running flows when we leave

/* ---------- speech ----------
   Recorded female voice (audio/*.mp3, same on every phone, works offline).
   Any line without a recording falls back to the phone's text-to-speech. */
const CLIPS={"Hello, and welcome. This is an evaluation of your speaking skills. It isn't graded, so don't worry. Listen carefully. You will have time to prepare silently. When you hear start speaking, tap the microphone and speak for one whole minute.": "audio/intro.mp3", "Listen carefully.": "audio/listen.mp3", "This is the last part of the first question. Listen carefully and take twenty seconds to prepare the answer.": "audio/q3lead.mp3", "Describe your usual school day. Tell me what you do from the time you wake up until you return home.": "audio/q1.mp3", "Look at the picture and describe what is happening. Tell me where the people are, what they are doing, and what might happen next.": "audio/q2.mp3", "Some students think that students should be allowed to use their phones at school. Do you agree or disagree? Explain why.": "audio/q3.mp3", "Start.": "audio/start.mp3", "Stop.": "audio/stop.mp3", "Start speaking.": "audio/startspeaking.mp3", "Thank you, stop.": "audio/thanksstop.mp3", "Thank you, let's repeat that with another sentence. Listen carefully. Quickly choose one of these four pictures.": "audio/choosepic.mp3", "Now we'll do something different. I will be showing you colored words and your task will be to say the color of the ink. Do not read the word. Just say the color it is written in. I'll show a new word every two seconds. Be quick. Tap the microphone to start.": "audio/task1.mp3", "This time I'll show you pictures of mathematical equations. Your task is to memorize the sequence of letters written under the equations. You'll have three seconds to memorize each sequence. Say the sequence when you see the white screen. Tap the microphone to start.": "audio/task2.mp3", "We came to the last task. This time I'll show you a sequence of different pictures and your task will be to say the name of the object you see. For each picture, you'll have two seconds. Tap the microphone to start.": "audio/task3.mp3", "Thank you.": "audio/thankyou.mp3", "That was all. Thank you for your participation. You did well.": "audio/finish.mp3"};
let CUR=null;
/* One shared audio element, unlocked on the first tap: iPhone Safari only lets
   an element play by itself (after a timer) once a tap has started it. */
const VO=new Audio();VO.preload='auto';VO.setAttribute('playsinline','');
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let VO_OK=false;
function unlockAudio(){if(VO_OK)return;VO_OK=true;try{VO.src=SILENT;const p=VO.play();p&&p.catch&&p.catch(()=>{VO_OK=false})}catch(e){VO_OK=false}
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function playClip(src){return new Promise(res=>{let done=false;const fin=ok=>{if(done)return;done=true;VO.onended=VO.onpause=VO.onerror=null;if(CUR===VO)CUR=null;res(ok)};
  try{VO.pause();VO.onended=()=>fin(true);VO.onpause=()=>{if(VO.src.indexOf(src)>=0&&!VO.ended&&VO.currentTime>0)fin(true)};VO.onerror=()=>fin(false);
    VO.src=src;VO.currentTime=0;CUR=VO;const p=VO.play();if(p&&p.catch)p.catch(()=>fin(false));
    setTimeout(()=>{if(!done&&VO.paused&&VO.currentTime===0)fin(false)},4000)}catch(e){fin(false)}})}
async function say(text){
  if(CLIPS[text]&&await playClip(CLIPS[text]))return;
  const tts=P().TextToSpeech;
  if(isNative()&&tts){try{await tts.speak({text,lang:'en-US',rate:0.9,pitch:1,volume:1,category:'playback'});return}catch(e){}}
  if('speechSynthesis' in window){
    await new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.9;
      const t=setTimeout(res,Math.max(3000,text.length*90));u.onend=u.onerror=()=>{clearTimeout(t);res()};speechSynthesis.speak(u)});
  } else await sleep(Math.max(1500,text.length*60));
}
function stopSpeech(){try{if(CUR){CUR.pause();CUR=null}}catch(e){}try{P().TextToSpeech&&P().TextToSpeech.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}

/* ---------- countdown ring ---------- */
function ringHTML(id){return `<div class="ring" id="${id}"><svg width="150" height="150"><circle cx="75" cy="75" r="66" stroke="#dde2ea" stroke-width="12" fill="none"/><circle class="arc" cx="75" cy="75" r="66" stroke="#b8892a" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="0"/></svg><div class="num"></div></div>`}
function countdown(el,secs,color,run){
  return new Promise(res=>{
    const arc=el.querySelector('.arc'),num=el.querySelector('.num');if(color)arc.setAttribute('stroke',color);
    const t0=performance.now();
    (function tick(){
      if(run!==RUN)return res(false);
      const left=Math.max(0,secs-(performance.now()-t0)/1000);
      num.textContent=Math.ceil(left);arc.style.strokeDashoffset=414.7*(1-left/secs);
      if(left<=0)return res(true);requestAnimationFrame(tick);
    })();
  });
}

/* ================= STORAGE (IndexedDB) ================= */
let dbp;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('pretest',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('sessions',{keyPath:'id'});const s=d.createObjectStore('recs',{keyPath:'id'});s.createIndex('sid','sid')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const out=fn(t.objectStore(store));t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
const putS=s=>tx('sessions','readwrite',st=>st.put(s));
const putR=r=>tx('recs','readwrite',st=>st.put(r));
const allS=()=>tx('sessions','readonly',st=>st.getAll());
const recsOf=sid=>tx('recs','readonly',st=>st.index('sid').getAll(sid));
async function delSession(sid){const rs=await recsOf(sid);await tx('recs','readwrite',st=>rs.forEach(r=>st.delete(r.id)));await tx('sessions','readwrite',st=>st.delete(sid))}

/* ================= RECORDING ================= */
let stream=null;
async function getMic(){
  if(stream&&stream.active)return stream;
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  return stream;
}
class Recorder{
  constructor(onLevel){this.onLevel=onLevel}
  async start(){
    const s=await getMic();
    const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
    const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    this.chunks=[];const o={audioBitsPerSecond:64000};if(mt)o.mimeType=mt;let mr;try{mr=new MediaRecorder(s,o)}catch(e){mr=new MediaRecorder(s,mt?{mimeType:mt}:{})}this.mr=mr; // 64 kbit/s: clear for listening, small to send
    this.mr.ondataavailable=e=>e.data.size&&this.chunks.push(e.data);
    this.mr.start(500);this.t0=Date.now();
    try{this.ac=new (window.AudioContext||window.webkitAudioContext)();const src=this.ac.createMediaStreamSource(s);this.an=this.ac.createAnalyser();this.an.fftSize=512;src.connect(this.an);
      const buf=new Uint8Array(this.an.fftSize);const loop=()=>{if(!this.an)return;this.an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));this.onLevel&&this.onLevel(m/128);this.raf=requestAnimationFrame(loop)};loop()}catch(e){}
  }
  stop(){return new Promise(res=>{
    const done=async()=>{cancelAnimationFrame(this.raf);this.an=null;try{this.ac&&this.ac.close()}catch(e){}
      const raw=new Blob(this.chunks,{type:this.mr.mimeType||'audio/webm'});const dur=(Date.now()-this.t0)/1000;
      let wav=null;try{wav=await toWav(raw)}catch(e){console.warn('wav',e)}
      const rext=raw.type.includes('mp4')?'m4a':raw.type.includes('ogg')?'ogg':'webm';
      res(wav?{blob:wav,mime:'audio/wav',ext:'wav',dur,raw}:{blob:raw,mime:raw.type,ext:rext,dur})};
    if(this.mr.state==='inactive')return done();
    this.mr.onstop=done;this.mr.stop();
  })}
}
async function toWav(blob){
  const ab=await blob.arrayBuffer();const ac=new (window.AudioContext||window.webkitAudioContext)();
  const audio=await ac.decodeAudioData(ab);ac.close();
  const rate=16000,len=Math.ceil(audio.duration*rate);
  const off=new OfflineAudioContext(1,len,rate);const src=off.createBufferSource();src.buffer=audio;src.connect(off.destination);src.start();
  const r=await off.startRendering();const d=r.getChannelData(0);
  const buf=new ArrayBuffer(44+d.length*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);
  for(let i=0;i<d.length;i++){const x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}
  return new Blob([buf],{type:'audio/wav'});
}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
const safe=s=>String(s).trim().replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,40)||'student';
function fileName(sess,rec){return `${safe(sess.name)}_${rec.key}.${rec.ext}`}

/* save a copy on the phone: Documents/SpeakingPreTest/<name_date>/ */
async function saveToPhone(sess,rec){
  const fs=P().Filesystem;if(!isNative()||!fs)return false;
  const data=await b64(rec.blob);const path=`SpeakingPreTest/${safe(sess.name)}_${sess.stamp}/${fileName(sess,rec)}`;
  try{await fs.writeFile({path,data,directory:'DOCUMENTS',recursive:true});return true}
  catch(e){try{await fs.writeFile({path,data,directory:'DATA',recursive:true});return true}catch(e2){return false}}
}

/* ================= SHARE ================= */
async function shareRecs(sess,recs){
  const summary=`Speaking Pre-Test — Alfikr Almodi School\nStudent: ${sess.name}\nDate: ${new Date(sess.date).toLocaleString()}\nAnswers: ${recs.map(r=>r.label).join(', ')}`;
  const fs=P().Filesystem,sh=P().Share;
  if(isNative()&&fs&&sh){
    try{
      const files=[];
      for(const r of recs){const w=await fs.writeFile({path:`share/${fileName(sess,r)}`,data:await b64(r.blob),directory:'CACHE',recursive:true});files.push(w.uri)}
      await sh.share({title:'Speaking Pre-Test',text:summary,files,dialogTitle:'Share answers'});return;
    }catch(e){if(String(e).match(/cancel/i))return;console.warn(e)}
  }
  try{
    const files=recs.map(r=>new File([r.blob],fileName(sess,r),{type:r.mime}));
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:summary,title:'Speaking Pre-Test'});return}
  }catch(e){if(e.name==='AbortError')return}
  // fallback: download
  recs.forEach(r=>{const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=fileName(sess,r);a.click()});
  toast('Files downloaded');
}

let S=null; // {id,name,date,stamp,pic}
async function newSession(name){
  const d=new Date();const stamp=d.toISOString().slice(0,16).replace(/[-:T]/g,'');
  S={id:'s'+Date.now(),name,date:d.getTime(),stamp,count:0};await putS(S);
}
async function storeRec(key,label,res){
  const rec={id:S.id+'_'+key,sid:S.id,key,label,blob:res.blob,mime:res.mime,ext:res.ext,dur:res.dur,marks:res.marks||null,raw:res.raw||null,at:Date.now()};
  await putR(rec);const all=await recsOf(S.id);S.count=all.length;await putS(S);
  const phone=await saveToPhone(S,rec);
  return {rec,phone};
}

/* ================= MIC UI ================= */
/* Renders a microphone button. Student taps to start, taps again to stop (or auto-stop at maxSec).
   Returns the saved recording. */
function micBlock(id){return `<div class="micwrap" id="${id}">
  <button class="mic ready" aria-label="Record">${MIC_SVG}</button>
  <div class="miclabel">Tap the microphone and answer<div class="ar mut" style="text-align:center">اضغط على الميكروفون وأجب</div></div>
  <div class="status rt" hidden><span class="recdot"></span><span class="tm">0:00</span></div>
  <div class="bar" style="width:100%" hidden><i></i></div>
</div>`}
function useMic(root,{key,label,maxSec=60,autoStart=false,run,practice=false}){
  return new Promise(resolve=>{
    const btn=root.querySelector('.mic'),lbl=root.querySelector('.miclabel'),rt=root.querySelector('.rt'),tm=root.querySelector('.tm'),bar=root.querySelector('.bar'),bi=bar.querySelector('i');
    let rec=null,timer=null,t0=0,busy=false;
    const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    async function start(){
      if(busy)return;busy=true;stopSpeech();
      rec=new Recorder(l=>btn.style.setProperty('--lvl',1+Math.min(.35,l*1.2)));
      try{await rec.start()}catch(e){busy=false;toast('Microphone not allowed — السماح بالميكروفون مطلوب',3500);return}
      btn.classList.remove('ready');btn.classList.add('rec');btn.innerHTML=STOP_SVG;
      lbl.innerHTML='Recording… tap to finish<div class="ar mut" style="text-align:center">جارٍ التسجيل… اضغط للإنهاء</div>';
      rt.hidden=false;bar.hidden=false;t0=Date.now();busy=false;
      timer=setInterval(()=>{const s=(Date.now()-t0)/1000;tm.textContent=fmt(s)+' / '+fmt(maxSec);bi.style.width=Math.min(100,s/maxSec*100)+'%';if(s>=maxSec||run!==RUN)stop()},200);
    }
    async function stop(){
      if(busy||!rec)return;busy=true;clearInterval(timer);
      btn.disabled=true;lbl.textContent='Saving…';
      const res=await rec.stop();rec=null;
      if(run!==RUN)return resolve(null);
      if(practice){ // practice answer: listen back, nothing is saved or sent
        root.innerHTML=`<div class="saved">✓ Good! Listen to yourself<div class="ar" style="text-align:center;font-weight:600">أحسنت! استمع إلى إجابتك — هذا تدريب ولا يُحفظ</div></div>
          <audio controls src="${URL.createObjectURL(res.blob)}"></audio>`;
        celebrate();return resolve({blob:res.blob,practice:true})}
      const {rec:saved,phone}=await storeRec(key,label,res);
      root.innerHTML=`<div class="saved">✓ Answer saved ${phone?'on the phone':''}<div class="ar" style="text-align:center;font-weight:600">تم حفظ الإجابة</div></div>
        <audio controls src="${URL.createObjectURL(saved.blob)}"></audio>`;
      celebrate();resolve(saved);
    }
    btn.onclick=()=>rec?stop():start();
    if(autoStart)start();
  });
}

/* ================= TEACHER PERMISSION =================
   The teacher opens "Teacher" mode (password) and reads the START CODE aloud.
   The code is the same on every phone (computed from the clock + a secret) and
   changes every CODE_MINUTES minutes, so no internet is needed.
   ► Change TEACHER_PASSWORD and CODE_SECRET before building for the school. */
const TEACHER_PASSWORD='2027';
const CODE_SECRET='alfikr-almodi-speaking-pretest';
const CODE_MINUTES=17;
function hash32(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0)*4096+(h1>>>20)}
const slotNow=()=>Math.floor(Date.now()/(CODE_MINUTES*60000));
const codeFor=slot=>String(hash32(CODE_SECRET+':'+slot)%10000).padStart(4,'0');
const codeOk=c=>{const s=slotNow();return [s,s-1].some(x=>codeFor(x)===c)}; // current or previous code (clock tolerance)

  $('#ok').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#bk').onclick=home;
}

/* ----- generic recorded task: student taps mic to begin, whole task is recorded ----- */
async function taskShell({key,label,stepT,introEn,introAr,speak,body}){
  const run=++RUN;step(stepT);
  M.innerHTML=`<div class="screen"><div class="card" style="display:flex;flex-direction:column;gap:8px"><span class="tag" style="align-self:flex-start">${label}</span><p>${introEn}</p><p class="ar mut">${introAr}</p></div>

  const mb=$('#mb');mb.querySelector('.miclabel').innerHTML='Tap the microphone to start<div class="ar mut" style="text-align:center">اضغط على الميكروفون للبدء</div>';
  say(speak);
  const btn=mb.querySelector('.mic');
  await new Promise(r=>btn.onclick=r);if(run!==RUN)return;stopSpeech();
  const rec=new Recorder(l=>{});
  try{await rec.start()}catch(e){toast('Microphone not allowed — السماح بالميكروفون مطلوب',3500);return taskShell(...arguments)}
  MARKS=[];
  mb.innerHTML=`<div class="status"><span class="recdot"></span> Recording · جارٍ التسجيل</div>`;
  await body($('#stage'),run);
  if(run!==RUN){rec.stop();return null}
  mb.innerHTML='<div class="status">Saving… جارٍ الحفظ</div>';
  const res=await rec.stop();res.marks=MARKS.map(m=>({t:(m.t-rec.t0)/1000,w:m.w}));MARKS=[];
  const {rec:saved,phone}=await storeRec(key,label,res);
  $('#stage').innerHTML='';
  mb.innerHTML=`<div class="saved">✓ Answer saved ${phone?'on the phone':''}<div class="ar" style="text-align:center;font-weight:600">تم حفظ الإجابة</div></div><audio controls src="${URL.createObjectURL(saved.blob)}"></audio>`;
  celebrate();await say('Thank you.');
  return run===RUN;
}

  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),90000);
  try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ac.signal,redirect:'follow'});
    const j=await r.json();if(!j.ok)throw new Error(j.err||'refused');return j}finally{clearTimeout(t)}
}
async function sendSession(s,url,onP){
  const recs=(await recsOf(s.id)).sort((a,b)=>a.key.localeCompare(b.key));
  if(!s.auto){try{await autoScore(s,recs)}catch(e){}}
  let n=0;
  for(const r of recs){if(r.up){n++;continue}
    const blob=r.raw||r.blob,ext=r.raw?(r.raw.type.includes('mp4')?'m4a':r.raw.type.includes('ogg')?'ogg':'webm'):r.ext;
    await post(url,{k:SYNC_KEY,a:'rec',sid:s.id,name:s.name,key:r.key,label:r.label,mime:blob.type||r.mime,ext,dur:r.dur,marks:r.marks||null,data:await b64(blob)});
    r.up=true;await putR(r);n++;onP&&onP(n,recs.length)}
  await post(url,{k:SYNC_KEY,a:'sess',sid:s.id,name:s.name,date:s.date,count:recs.length,auto:s.auto||{}});
  s.sent=Date.now();s.sentCount=recs.length;await putS(s);
}
function syncAll(onP){
  if(SYNCING)return SYNCING;
  SYNCING=(async()=>{const url=await syncUrl();if(!url)return 'off';
    const ss=(await allS()).filter(s=>s.count>0&&(!s.sent||s.sentCount!==s.count));let fail=0;
    for(const s of ss){try{await sendSession(s,url,onP&&((n,t)=>onP(s,n,t)))}catch(e){console.warn('send',e);fail++}}
    return fail?'retry':'ok'})().finally(()=>{SYNCING=null});
  return SYNCING;
}
addEventListener('online',()=>syncAll());
setInterval(()=>{if(navigator.onLine!==false)syncAll()},60000);

/* ================= TEACHER SCORING =================
   The teacher listens to each recording and enters a score.
   ► Change the maximum marks here if the study uses another scale. */
const SCORING=[
  {key:'Q1',label:'Question 1',max:10,hint:'Speaking fluency · طلاقة التحدث'},
  {key:'Q2',label:'Question 2',max:10,hint:'Speaking fluency · طلاقة التحدث'},
  {key:'Q3',label:'Question 3',max:10,hint:'Speaking fluency · طلاقة التحدث'},
  {key:'T1_colors',label:'Task 1 · Colours',max:STROOP.length,hint:'Correct colours · عدد الألوان الصحيحة'},
  {key:'T2_letters',label:'Task 2 · Letters',max:EQ.length,hint:'Correct sequences · عدد السلاسل الصحيحة'},
  {key:'T3_pictures',label:'Task 3 · Pictures',max:OBJECTS.length,hint:'Correct names · عدد الأسماء الصحيحة'}];
const SPEAK_KEYS=['Q1','Q2','Q3'];
const scoreOf=(s,k)=>(s.scores&&s.scores[k]!=null&&s.scores[k]!=='')?+s.scores[k]:null;
function scoreSummary(s){
  const got=SCORING.filter(x=>scoreOf(s,x.key)!=null).length;
  if(!got)return '<span class="ungraded">Not graded yet · لم يُصحَّح بعد</span>';
  const sp=SPEAK_KEYS.map(k=>scoreOf(s,k)).filter(v=>v!=null);
  const spMax=SCORING.filter(x=>SPEAK_KEYS.includes(x.key)).reduce((a,x)=>a+x.max,0);
  const parts=[`Speaking ${sp.reduce((a,b)=>a+b,0)}/${spMax}`];
  SCORING.filter(x=>!SPEAK_KEYS.includes(x.key)).forEach(x=>{const v=scoreOf(s,x.key);if(v!=null)parts.push(`${x.label.split(' · ')[1]} ${v}/${x.max}`)});
  return `<span class="graded">${got===SCORING.length?'✓ ':''}${parts.join(' · ')}</span>${got<SCORING.length?` <span class="ungraded">(${got}/${SCORING.length})</span>`:''}`;
}
function renderRecs(el,sess,recs,grading,onScore){
  if(!recs.length){el.innerHTML='<p class="mut">No recordings.</p>';return}
  el.innerHTML=recs.map((r,i)=>{const sc=SCORING.find(x=>x.key===r.key);const v=scoreOf(sess,r.key);
    return `<div class="item"><div class="h">${esc(r.label)}<small>${Math.round(r.dur||0)} s</small></div>
    <audio controls preload="none" src="${URL.createObjectURL(r.blob)}"></audio>
    ${grading&&sc?`<div class="score"><label>Score · الدرجة<input type="number" inputmode="numeric" min="0" max="${sc.max}" step="1" data-k="${sc.key}" value="${v==null?'':v}" placeholder="–"><span>/ ${sc.max}</span>${sess.autoFilled&&sess.autoFilled[sc.key]?'<em class="af">🤖 auto</em>':''}</label><small class="mut">${sc.hint}</small>${autoLine(sess,r.key)}</div>`:''}
    <button class="btn small ghost" data-i="${i}">📤 Share</button></div>`}).join('');
  el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>shareRecs(sess,[recs[+b.dataset.i]]));
  el.querySelectorAll('input[data-k]').forEach(inp=>inp.onchange=async()=>{
    const sc=SCORING.find(x=>x.key===inp.dataset.k);let v=inp.value.trim();
    if(v!==''){v=Math.round(+v);if(isNaN(v)){inp.value='';return}v=Math.max(0,Math.min(sc.max,v));inp.value=v}
    sess.scores=sess.scores||{};if(v==='')delete sess.scores[sc.key];else sess.scores[sc.key]=v;if(sess.autoFilled)delete sess.autoFilled[sc.key];
    const af=inp.parentElement.querySelector('.af');if(af)af.remove();
    await putS(sess);inp.classList.add('saved-ok');setTimeout(()=>inp.classList.remove('saved-ok'),900);onScore&&onScore()});
}
async function exportScores(){
  const ss=(await allS()).filter(s=>s.count>0).sort((a,b)=>a.date-b.date);
  if(!ss.length){toast('No students yet · لا يوجد طلاب بعد');return}
  const q=v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const spMax=SCORING.filter(x=>SPEAK_KEYS.includes(x.key)).reduce((a,x)=>a+x.max,0);
  for(const s of ss)if(!s.auto){try{await autoScore(s,await recsOf(s.id))}catch(e){}}
  const A=(s,k,f)=>{const a=s.auto&&s.auto[k];return a&&a[f]!=null?a[f]:''};
  const autoHead=[...SPEAK_KEYS.flatMap(k=>[`AUTO ${k} fluency est (/10)`,`AUTO ${k} speaking time (s)`,`AUTO ${k} pauses`,`AUTO ${k} mean pause (s)`,`AUTO ${k} speech ratio (%)`,`AUTO ${k} mean length of run (s)`]),
    ...['T1_colors','T2_letters','T3_pictures'].flatMap(k=>[`AUTO ${k} correct`,`AUTO ${k} answered`,`AUTO ${k} items`,`AUTO ${k} mean RT (ms)`,`AUTO ${k} median RT (ms)`]),
    'AUTO T1 read-the-word errors','AUTO T2 letters correct',...SPEAK_KEYS.flatMap(k=>[`AUTO ${k} words/min`,`AUTO ${k} transcript`])];
  const autoRow=s=>[...SPEAK_KEYS.flatMap(k=>['est','speak','pauses','meanPause','ptr','mlr'].map(f=>A(s,k,f))),...['T1_colors','T2_letters','T3_pictures'].flatMap(k=>['correct','answered','n','rtMean','rtMedian'].map(f=>A(s,k,f))),
    A(s,'T1_colors','readWord'),A(s,'T2_letters','letters'),...SPEAK_KEYS.flatMap(k=>[A(s,k,'wpm'),(s.asr&&s.asr[k]&&s.asr[k].text)||''])];
  const head=['Student','Date',...SCORING.map(x=>`${x.label} (/${x.max})`),`Speaking total (/${spMax})`,'Graded',...autoHead];
  const rows=ss.map(s=>{const sp=SPEAK_KEYS.map(k=>scoreOf(s,k));const done=SCORING.filter(x=>scoreOf(s,x.key)!=null).length;
    return [s.name,new Date(s.date).toLocaleString(),...SCORING.map(x=>scoreOf(s,x.key)),sp.every(v=>v!=null)?sp.reduce((a,b)=>a+b,0):'',`${done}/${SCORING.length}`,...autoRow(s)]});
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const name=`SpeakingPreTest_scores_${new Date().toISOString().slice(0,10)}.csv`;
  const fs=P().Filesystem,sh=P().Share;
  if(isNative()&&fs&&sh){try{const w=await fs.writeFile({path:`share/${name}`,data:csv,directory:'CACHE',encoding:'utf8',recursive:true});
    await sh.share({title:'Speaking Pre-Test scores',files:[w.uri],dialogTitle:'Export scores'});return}catch(e){if(String(e).match(/cancel/i))return;console.warn(e)}}
  const blob=new Blob([csv],{type:'text/csv'});
  try{const f=new File([blob],name,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Speaking Pre-Test scores'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();toast('Scores file downloaded · تم تنزيل ملف الدرجات');
}

async function savedScreen(){
  RUN++;stopSpeech();step('Saved');
  const ss=(await allS()).filter(s=>s.count>0).sort((a,b)=>b.date-a.date);
  M.innerHTML=`<div class="screen"><div class="row" style="align-items:center"><h2>🎤 Saved answers</h2><button class="btn small ghost" id="bk" style="flex:0;white-space:nowrap">← Back</button></div>
    <p class="ar mut">كل إجابات الطلاب محفوظة هنا على الهاتف. اضغط «Listen & grade» لسماع الإجابات وكتابة الدرجات.</p>
    <button class="btn" id="acAll">🤖 Auto-correct all students · تصحيح تلقائي للجميع</button>
    <div class="acst" id="acst" hidden></div>
    <button class="btn ghost" id="exp">📊 Export all scores (CSV) · تصدير الدرجات</button>
    <div class="list" id="ss">${ss.length?'':'<p class="mut">No saved answers yet · لا توجد إجابات بعد</p>'}</div></div>`;
  $('#bk').onclick=home;$('#exp').onclick=exportScores;
  $('#acAll').onclick=async()=>{const st=$('#acst'),btn=$('#acAll');const todo=ss.filter(s=>!s.asrAt);
    if(!todo.length){toast('All students are already auto-corrected · تم تصحيح الجميع');return}
    btn.disabled=true;st.hidden=false;
    try{st.textContent='Loading speech model… جارٍ تحميل نموذج التعرّف على الكلام (مرة واحدة، يحتاج إنترنت)';
      await loadASR(p=>{if(p&&p.status==='progress'&&p.file&&/onnx/.test(p.file))st.textContent=`Downloading model ${Math.round(p.progress||0)}% · تحميل النموذج`});
      for(const [i,s] of todo.entries()){await asrCorrect(s,(lab,k,n)=>{st.textContent=`🤖 ${s.name} (${i+1}/${todo.length}) — ${lab} (${k+1}/${n})… جارٍ الاستماع والتصحيح`})}
      st.textContent=`✓ Done: ${todo.length} students corrected · تم التصحيح`;setTimeout(savedScreen,1200);
    }catch(e){console.warn(e);st.textContent='⚠️ Could not load the speech model. Check the internet connection and try again. · تعذّر تحميل النموذج، تحقّق من الإنترنت';btn.disabled=false}};
  const box=$('#ss');
  for(const s of ss){
    const d=document.createElement('div');d.className='sess';
    d.innerHTML=`<div class="item h" style="border:0;padding:0;background:none;flex-direction:row"><div><div style="font-weight:800">${esc(s.name)}</div><small class="mut">${new Date(s.date).toLocaleString()} · ${s.count} 🎤</small><div class="sc-sum">${scoreSummary(s)}</div><div class="au-sum">${autoSummary(s)}</div></div></div>
      <div class="row"><button class="btn small" data-a="open">▶ Listen & grade</button><button class="btn small" data-a="share">📤 Share</button><button class="btn small ghost" data-a="del">🗑</button></div>
      <button class="btn small ghost" data-a="ac">${s.asrAt?'🤖 Auto-corrected ✓ (run again)':'🤖 Auto-correct this student · تصحيح تلقائي'}</button><div class="list" hidden></div>`;
    const lst=d.querySelector('.list');
    d.querySelector('[data-a=open]').onclick=async()=>{if(!lst.hidden){lst.hidden=true;return}renderRecs(lst,s,(await recsOf(s.id)).sort((a,b)=>a.key.localeCompare(b.key)),true,()=>{d.querySelector('.sc-sum').innerHTML=scoreSummary(s)});lst.hidden=false};
    d.querySelector('[data-a=share]').onclick=async()=>shareRecs(s,(await recsOf(s.id)).sort((a,b)=>a.key.localeCompare(b.key)));
    d.querySelector('[data-a=ac]').onclick=async e=>{const b=e.currentTarget;b.disabled=true;
      try{b.textContent='Loading model… تحميل النموذج';await loadASR();await asrCorrect(s,(lab,k,n)=>{b.textContent=`🤖 ${lab} (${k+1}/${n})…`});savedScreen()}
      catch(err){console.warn(err);b.disabled=false;b.textContent='⚠️ Failed — check internet · تحقّق من الإنترنت'}};
    d.querySelector('[data-a=del]').onclick=async()=>{if(confirm(`Delete ${s.name}'s answers? / حذف إجابات ${s.name}؟`)){await delSession(s.id);savedScreen()}};
    box.appendChild(d);
    if(!s.auto)recsOf(s.id).then(rs=>autoScore(s,rs)).then(()=>{d.querySelector('.au-sum').innerHTML=autoSummary(s)}).catch(()=>{});
  }
}

if('serviceWorker' in navigator&&!isNative()&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
