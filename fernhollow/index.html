<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}

body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
a{color:inherit;text-decoration:none}

#valley{position:fixed;inset:0}

.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}

.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}

  .corner{left:20px;right:20px;bottom:30px;justify-content:center;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ---------------------------------------------------------------
   Small helpers: seeded random, value noise, fbm
---------------------------------------------------------------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s/.9375}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

/* ---------------------------------------------------------------
   Ambient audio: generated in Web Audio, routed through the
   three.js AudioListener. Starts muted, fades on toggle, and a
   low-pass filter muffles it during the hover transition.
---------------------------------------------------------------- */
const audioState={isInitialized:false,muted:true,listener:null};
function audioStore(){return audioState}
audioState.initAudio=function(){this.isInitialized=true};
audioState.build=function(){
  if(this.ctx)return;
  const ctx=this.listener?this.listener.context:new (window.AudioContext||window.webkitAudioContext)();
  const out=this.listener?this.listener.getInput():ctx.destination;
  const master=ctx.createGain();master.gain.value=0;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=16000;lp.Q.value=.7;
  master.connect(lp);lp.connect(out);
  // wind: looping brown-ish noise through a wandering band-pass
  const len=ctx.sampleRate*4,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5}
  const noise=ctx.createBufferSource();noise.buffer=buf;noise.loop=true;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.5;
  const windGain=ctx.createGain();windGain.gain.value=.5;
  const lfo=ctx.createOscillator();lfo.frequency.value=.07;const lfoG=ctx.createGain();lfoG.gain.value=220;
  lfo.connect(lfoG);lfoG.connect(bp.frequency);
  noise.connect(bp);bp.connect(windGain);windGain.connect(master);noise.start();lfo.start();
  // pad: slow detuned sines
  const padGain=ctx.createGain();padGain.gain.value=.05;padGain.connect(master);
  const trem=ctx.createOscillator();trem.frequency.value=.11;const tremG=ctx.createGain();tremG.gain.value=.018;
  trem.connect(tremG);tremG.connect(padGain.gain);trem.start();
  [110,164.81,220,246.94,329.63].forEach((f,i)=>{for(const det of[-4,4]){const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=det+i;
    const g=ctx.createGain();g.gain.value=i===0?.5:.28;o.connect(g);g.connect(padGain);o.start()}});
  // chimes: sparse pentatonic notes with a soft echo
  const delay=ctx.createDelay(2);delay.delayTime.value=.42;const fb=ctx.createGain();fb.gain.value=.38;
  const chimeBus=ctx.createGain();chimeBus.gain.value=.07;
  chimeBus.connect(master);chimeBus.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(master);
  const notes=[659.25,739.99,880,987.77,1108.73,1318.51];
  const chime=()=>{
    if(!this.muted&&ctx.state==='running'){const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=notes[Math.floor(Math.random()*notes.length)];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.6,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
      o.connect(g);g.connect(chimeBus);o.start(t);o.stop(t+3.3)}
    setTimeout(chime,2200+Math.random()*4200)};
  setTimeout(chime,3000);
  Object.assign(this,{ctx,master,lp});
};
audioState.toggleMute=function(){
  if(!this.isInitialized)return this.muted;
  this.build();
  this.muted=!this.muted;
  const t=this.ctx.currentTime,g=this.master.gain;
  if(!this.muted&&this.ctx.state!=='running')this.ctx.resume();
  g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(this.muted?0:.8,t+(this.muted?.8:1.8));
  return this.muted;
};
audioState.setMuffled=function(on){
  if(!this.ctx)return;
  const t=this.ctx.currentTime,f=this.lp.frequency;
  f.cancelScheduledValues(t);f.setValueAtTime(f.value,t);f.exponentialRampToValueAtTime(on?480:16000,t+1.2);
};

/* ---------------------------------------------------------------
   Shaders
---------------------------------------------------------------- */
const FOG=new THREE.Color(0x070c17);

const flowerVert=`
uniform float uTime,uDisperse,uPx,uMaxSize,uAspect,uBloom;
uniform vec2 uMouse;
attribute vec3 aColor;attribute float aSize;attribute vec4 aRand;attribute float aType;attribute float aPetals;
varying vec3 vColor;varying float vType,vPetals,vGlow,vDisp,vFog,vRot,vAlpha;
void main(){
  vec3 p=position;
  float sway=sin(uTime*.8+aRand.w*6.283+p.z*.08+p.x*.05);
  p.x+=sway*.07*(1.-aType*.6);p.z+=cos(uTime*.6+aRand.w*9.)*.04;
  float dsp=uDisperse*(.55+.45*aRand.w);
  dsp=dsp*dsp*(3.-2.*dsp);
  p+=vec3(aRand.x*6.,2.5+(aRand.y*.5+.5)*8.,aRand.z*6.)*dsp;
  p.y+=sin(uTime*.6+aRand.w*20.)*.7*dsp;
  p.x+=cos(uTime*.45+aRand.w*13.)*.6*dsp;
  vec4 mv=modelViewMatrix*vec4(p,1.);
  float dist=-mv.z;
  float s=aType<.5? mix(.2,1.,smoothstep(58.,9.,dist))*mix(.55,1.,smoothstep(1.5,7.,dist)) : smoothstep(135.,55.,dist)*.85+.15;
  s*=uBloom;
  vec4 clip=projectionMatrix*mv;
  vec2 ndc=clip.xy/clip.w;
  vec2 d=(ndc-uMouse)*vec2(uAspect,1.);
  float len=length(d);
  float f=exp(-len*len*7.)*step(0.,clip.w);
  vec2 dir=len>1e-4?d/len:vec2(0.);
  ndc+=dir/vec2(uAspect,1.)*f*.14;
  clip.xy=ndc*clip.w;
  gl_Position=clip;
  vGlow=exp(-len*len*22.);
  float px=aSize*s*uPx/max(dist,.1);
  px*=mix(1.,.28,dsp);
  gl_PointSize=dist<.2?0.:clamp(px,0.,uMaxSize);
  vFog=1.-exp(-pow(dist*.0105,1.55));
  vRot=aRand.w*6.283+uTime*.04*aRand.x;
  vAlpha=smoothstep(.5+dsp*5.,2.6+dsp*9.,dist);
  vColor=aColor;vType=aType;vPetals=aPetals;vDisp=dsp;
}`;
const flowerFrag=`
uniform vec3 uFog;
varying vec3 vColor;varying float vType,vPetals,vGlow,vDisp,vFog,vRot,vAlpha;
void main(){
  vec2 uv=gl_PointCoord*2.-1.;uv.y=-uv.y;
  float r=length(uv);
  if(r>1.)discard;
  float c=cos(vRot),s=sin(vRot);
  vec2 q=mat2(c,-s,s,c)*uv;
  vec3 col;float a;
  if(vType<.5){
    float ang=atan(q.y,q.x);
    float petal=pow(abs(cos(ang*vPetals*.5)),.85);
    float edge=.36+.56*petal;
    a=smoothstep(edge,edge-.14,r);
    float core=smoothstep(.27,0.,r);
    col=vColor*(.45+.5*smoothstep(edge,0.,r));
    col=mix(col,vec3(1.,.82,.48)*1.7,core);
    float halo=exp(-r*r*5.)*.16;
    a=max(a,halo);col+=vColor*halo;
  }else{
    vec2 l=q*vec2(2.5,1.05);
    float e=length(l);
    a=smoothstep(1.,.8,e);
    float rib=smoothstep(.07,0.,abs(q.x))*.35;
    col=vColor*(.35+rib*.6+.25*(1.-e));
  }
  float dotA=exp(-r*r*6.);
  a=mix(a,dotA,vDisp);
  col=mix(col,vColor*1.2+vec3(.22,.2,.14),vDisp*.8);
  col*=1.+vGlow*2.2;
  col=mix(col,uFog,vFog);
  a*=vAlpha*(1.-vFog*.55);
  if(a<.03)discard;
  gl_FragColor=vec4(col,a);
}`;

const terrainVert=`
varying vec3 vW;varying vec3 vN;varying float vD;
void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vN=normal;vec4 mv=viewMatrix*w;vD=-mv.z;gl_Position=projectionMatrix*mv;}`;
const terrainFrag=`
uniform vec3 uFog,uMoon;varying vec3 vW;varying vec3 vN;varying float vD;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  vec3 n=normalize(vN);
  float lit=max(dot(n,normalize(uMoon)),0.);
  float grain=h(floor(vW.xz*3.));
  vec3 base=mix(vec3(.0016,.0034,.0042),vec3(.0032,.0075,.009),smoothstep(0.,14.,vW.y));
  vec3 col=base*(.6+.4*grain)+vec3(.006,.01,.02)*lit;
  col+=vec3(.002,.004,.003)*smoothstep(.6,1.,n.y);
  float fog=1.-exp(-pow(vD*.0105,1.55));
  gl_FragColor=vec4(mix(col,uFog,fog),1.);
}`;

const skyFrag=`
uniform vec3 uMoonDir;varying vec3 vDir;
void main(){
  vec3 d=normalize(vDir);
  float y=d.y;
  vec3 col=mix(vec3(.007,.012,.026),vec3(.0006,.001,.003),smoothstep(-.05,.55,y));
  col=mix(col,vec3(.006,.01,.022),smoothstep(.1,-.2,y));
  float m=max(dot(d,normalize(uMoonDir)),0.);
  col+=vec3(.55,.6,.75)*pow(m,1800.)*3.+vec3(.04,.05,.09)*pow(m,24.)*.5+vec3(.01,.012,.022)*pow(m,4.)*.4;
  gl_FragColor=vec4(col,1.);
}`;
const skyVert=`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;

const starVert=`uniform float uTime,uPr;attribute float aS;attribute float aP;varying float vA;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;
vA=(.55+.45*sin(uTime*(.6+aP*1.4)+aP*30.))*smoothstep(-.02,.25,normalize(position).y);gl_PointSize=aS*uPr;}`;
const starFrag=`varying float vA;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;gl_FragColor=vec4(vec3(.85,.88,1.)*1.4,vA*smoothstep(.5,0.,r));}`;

const rayVert=`varying vec2 vUv;varying float vD;void main(){vUv=uv;vec4 mv=modelViewMatrix*vec4(position,1.);vD=-mv.z;gl_Position=projectionMatrix*mv;}`;
const rayFrag=`uniform float uTime,uSeed,uFade;varying vec2 vUv;varying float vD;
void main(){float x=abs(vUv.x-.5)*2.;float a=pow(1.-x,2.2)*smoothstep(0.,.25,vUv.y)*smoothstep(1.,.35,vUv.y);
a*=.55+.45*sin(uTime*.35+uSeed*7.+vUv.y*3.);a*=smoothstep(6.,26.,vD)*smoothstep(260.,140.,vD)*uFade;
gl_FragColor=vec4(vec3(.62,.72,.95)*a*.16,1.);}`;

const dustVert=`uniform float uTime,uPx;uniform vec3 uCam;attribute vec4 aR;varying float vA;
void main(){vec3 box=vec3(70.,22.,70.);
vec3 p=position+vec3(sin(uTime*.2+aR.x*9.)*1.5,uTime*(.15+aR.y*.25),cos(uTime*.17+aR.z*7.)*1.5);
p=mod(p-uCam+box*.5,box)-box*.5+uCam;
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float d=-mv.z;
gl_PointSize=d<.2?0.:clamp((.05+aR.w*.07)*uPx/d,0.,12.);
vA=(.35+.65*sin(uTime*(1.+aR.w*2.)+aR.x*40.)*.5+.3)*smoothstep(35.,8.,d);}`;
const dustFrag=`varying float vA;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;gl_FragColor=vec4(vec3(1.,.86,.6)*1.6*vA*smoothstep(.5,0.,r),1.);}`;

const finalShader={
  uniforms:{tDiffuse:{value:null},uTime:{value:0},uSpeed:{value:0},uRes:{value:new THREE.Vector2(1,1)},uJitter:{value:1}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uSpeed,uJitter;uniform vec2 uRes;varying vec2 vUv;
  float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){
    vec2 c=vUv-.5;
    float n=hash(floor(vUv*uRes*.5)+floor(uTime*24.));
    float band=hash(vec2(floor(vUv.y*90.+uTime*3.),floor(uTime*8.)));
    float split=(.0009+uSpeed*.0045)*(.6+.8*n)*uJitter+(band>.985?.004*uJitter:0.);
    vec2 o=c*split*2.+vec2(split*.5,0.);
    vec3 col=vec3(texture2D(tDiffuse,vUv+o).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-o).b);
    col+=(hash(vUv*uRes+uTime*61.)-.5)*.045;
    float d=length(c*vec2(uRes.x/uRes.y,1.));
    float r0=mix(.5,.18,uSpeed);
    float v=1.-smoothstep(r0,r0+.75,d);
    col*=mix(.08,1.,v);
    gl_FragColor=vec4(col,1.);
  }`
};

/* ---------------------------------------------------------------
   The valley
---------------------------------------------------------------- */
class Valley{
  constructor(root,onLoaded,onIntroDone){
    this.root=root;this.onLoaded=onLoaded;this.onIntroDone=onIntroDone;
    this.mount=root.querySelector('.js-canvas-container')||root;
    this.small=matchMedia('(max-width:820px),(pointer:coarse)').matches;
    this.reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
    try{
      this.renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
    }catch(e){document.getElementById('nogl').style.display='grid';onLoaded&&onLoaded();onIntroDone&&onIntroDone();return}
    const r=this.renderer;
    r.setPixelRatio(Math.min(devicePixelRatio,this.small?1.5:1.75));
    r.setSize(innerWidth,innerHeight);
    r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;
    this.mount.appendChild(r.domElement);

    this.scene=new THREE.Scene();this.scene.background=FOG.clone();
    this.camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,900);
    this.listener=new THREE.AudioListener();this.camera.add(this.listener);this.scene.add(this.camera);
    audioState.listener=this.listener;

    this.time=0;this.dist=0;this.target=0;this.flight=1;this.flightTarget=1;
    this.disperse=0;this.disperseTarget=0;this.speed=0;
    this.mouse=new THREE.Vector2(9,9);this.mouseT=new THREE.Vector2(9,9);this.tilt=new THREE.Vector2();
    this.loadedSent=false;

    this.buildPath();this.buildTerrain();this.buildSky();this.buildFlowers();this.buildRays();this.buildDust();this.buildPost();this.bind();
    this.clock=new THREE.Clock();
    r.setAnimationLoop(()=>this.tick());
  }

  /* path + distance field shape the valley floor */
  buildPath(){
    const ctrl=[];
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2,rad=125+Math.sin(a*3+.6)*28+Math.cos(a*2)*16;ctrl.push(new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad*.82))}
    const flat=new THREE.CatmullRomCurve3(ctrl,true,'centripetal');flat.arcLengthDivisions=3000;
    this.samples=flat.getSpacedPoints(700);this.samples.pop();
    // distance field on a grid
    const G=220,EXT=240,cell=2*EXT/G,df=new Float32Array((G+1)*(G+1)),S=this.samples;
    const sx=new Float32Array(S.length),sz=new Float32Array(S.length);S.forEach((p,i)=>{sx[i]=p.x;sz[i]=p.z});
    for(let j=0;j<=G;j++)for(let i=0;i<=G;i++){const x=-EXT+i*cell,z=-EXT+j*cell;let m=1e9;
      for(let k=0;k<sx.length;k++){const dx=x-sx[k],dz=z-sz[k],q=dx*dx+dz*dz;if(q<m)m=q}df[j*(G+1)+i]=Math.sqrt(m)}
    this.df={G,EXT,cell,df};
    // camera path follows the floor
    const pts=S.map(p=>new THREE.Vector3(p.x,this.floor(p.x,p.z)+3.3,p.z));
    for(let pass=0;pass<4;pass++){const ys=pts.map(p=>p.y);pts.forEach((p,i)=>{const n=ys.length;p.y=(ys[(i-2+n)%n]+ys[(i-1+n)%n]+ys[i]+ys[(i+1)%n]+ys[(i+2)%n])/5})}
    this.curve=new THREE.CatmullRomCurve3(pts,true);this.curve.arcLengthDivisions=4000;
    this.pathLen=this.curve.getLength();
  }
  sampleDF(x,z){const{G,EXT,cell,df}=this.df;const fx=(x+EXT)/cell,fz=(z+EXT)/cell;
    if(fx<0||fz<0||fx>=G||fz>=G)return 200;const i=Math.floor(fx),j=Math.floor(fz),u=fx-i,v=fz-j,W=G+1;
    const a=df[j*W+i],b=df[j*W+i+1],c=df[(j+1)*W+i],d=df[(j+1)*W+i+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
  floor(x,z){return fbm(x*.014+3.1,z*.014-7.4)*7}
  height(x,z){const d=this.sampleDF(x,z);
    const rise=Math.pow(Math.max(d-6,0)/30,1.65)*15;
    return this.floor(x,z)+Math.min(rise,60)+fbm(x*.05,z*.05)*5*smooth(8,40,d)}

  buildTerrain(){
    const g=new THREE.PlaneGeometry(480,480,240,240);g.rotateX(-Math.PI/2);
    const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,this.height(p.getX(i),p.getZ(i)));
    g.computeVertexNormals();
    this.moonDir=new THREE.Vector3(-.5,.42,-.75).normalize();
    const m=new THREE.ShaderMaterial({vertexShader:terrainVert,fragmentShader:terrainFrag,uniforms:{uFog:{value:FOG},uMoon:{value:this.moonDir}}});
    this.scene.add(new THREE.Mesh(g,m));
  }

  buildSky(){
    this.sky=new THREE.Mesh(new THREE.SphereGeometry(700,32,16),new THREE.ShaderMaterial({vertexShader:skyVert,fragmentShader:skyFrag,side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{uMoonDir:{value:this.moonDir}}}));
    this.sky.renderOrder=-2;this.scene.add(this.sky);
    const N=2600,pos=new Float32Array(N*3),s=new Float32Array(N),ph=new Float32Array(N),R=rng(7);
    for(let i=0;i<N;i++){const u=R(),v=R()*.9+.1,th=u*Math.PI*2,y=v,rr=Math.sqrt(1-y*y);pos.set([Math.cos(th)*rr*650,y*650,Math.sin(th)*rr*650],i*3);s[i]=.6+Math.pow(R(),6)*2.6;ph[i]=R()}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aS',new THREE.BufferAttribute(s,1));g.setAttribute('aP',new THREE.BufferAttribute(ph,1));
    this.starMat=new THREE.ShaderMaterial({vertexShader:starVert,fragmentShader:starFrag,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uPr:{value:this.renderer.getPixelRatio()}}});
    this.stars=new THREE.Points(g,this.starMat);this.stars.renderOrder=-1;this.stars.frustumCulled=false;this.scene.add(this.stars);
  }

  buildFlowers(){
    const NF=this.small?22000:44000,NL=this.small?13000:26000,N=NF+NL,R=rng(42),S=this.samples,n=S.length;
    const pos=new Float32Array(N*3),col=new Float32Array(N*3),size=new Float32Array(N),rnd=new Float32Array(N*4),type=new Float32Array(N),pet=new Float32Array(N);
    const palette=[[1,.82,.52],[1,.62,.5],[.86,.66,1],[.5,.86,.95],[.98,.93,.82],[1,.72,.82],[.62,.95,.78]].map(c=>new THREE.Color(...c));
    const leafPal=[[.03,.1,.08],[.045,.12,.07],[.03,.08,.1],[.06,.13,.09]].map(c=>new THREE.Color(...c));
    const c=new THREE.Color();
    for(let i=0;i<N;i++){
      const leaf=i>=NF;
      const k=Math.floor(R()*n),a=S[k],b=S[(k+1)%n],t=R();
      const x0=a.x+(b.x-a.x)*t,z0=a.z+(b.z-a.z)*t;
      let tx=b.x-a.x,tz=b.z-a.z;const tl=Math.hypot(tx,tz)||1;tx/=tl;tz/=tl;
      const spread=leaf?55:40;
      let off=Math.pow(R(),leaf?1.1:1.6)*spread*(R()<.5?-1:1);
      if(Math.abs(off)<1.4)off=Math.sign(off||1)*(1.4+R()*2);
      const x=x0-tz*off+(R()-.5)*3,z=z0+tx*off+(R()-.5)*3;
      // flowers cluster in patches
      if(!leaf&&fbm(x*.06,z*.06)<.38&&R()<.6){i--;continue}
      const y=this.height(x,z)+(leaf?.15+R()*.45:.35+R()*1.1);
      pos.set([x,y,z],i*3);
      if(leaf){c.copy(leafPal[Math.floor(R()*leafPal.length)]).multiplyScalar(.8+R()*.5);size[i]=.3+R()*.4;pet[i]=0}
      else{const hueZone=fbm(x*.02+11,z*.02-5);const pi=Math.floor((hueZone*1.4+R()*.5)*palette.length)%palette.length;
        c.copy(palette[pi]).multiplyScalar(.55+R()*.5);size[i]=(.32+Math.pow(R(),2)*.5);pet[i]=[5,5,6,6,8][Math.floor(R()*5)]}
      col.set([c.r,c.g,c.b],i*3);
      rnd.set([R()*2-1,R()*2-1,R()*2-1,R()],i*4);type[i]=leaf?1:0;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
    g.setAttribute('aSize',new THREE.BufferAttribute(size,1));g.setAttribute('aRand',new THREE.BufferAttribute(rnd,4));
    g.setAttribute('aType',new THREE.BufferAttribute(type,1));g.setAttribute('aPetals',new THREE.BufferAttribute(pet,1));
    this.flowerMat=new THREE.ShaderMaterial({vertexShader:flowerVert,fragmentShader:flowerFrag,transparent:true,depthWrite:false,
      uniforms:{uTime:{value:0},uDisperse:{value:0},uPx:{value:1},uMaxSize:{value:96},uAspect:{value:1},uMouse:{value:this.mouse},uFog:{value:FOG},uBloom:{value:0}}});
    this.flowers=new THREE.Points(g,this.flowerMat);this.flowers.frustumCulled=false;this.scene.add(this.flowers);
  }

  buildRays(){
    this.rays=[];const R=rng(99),geo=new THREE.PlaneGeometry(1,1,1,1);geo.translate(0,.5,0);
    for(let i=0;i<16;i++){
      const u=i/16+R()*.03,p=this.curve.getPointAt(u),tan=this.curve.getTangentAt(u);
      const side=(R()<.5?-1:1)*(8+R()*22);
      const x=p.x-tan.z*side,z=p.z+tan.x*side;
      const m=new THREE.ShaderMaterial({vertexShader:rayVert,fragmentShader:rayFrag,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
        uniforms:{uTime:this.flowerMat.uniforms.uTime,uSeed:{value:R()},uFade:{value:1}}});
      const mesh=new THREE.Mesh(geo,m);mesh.scale.set(5+R()*6,55+R()*30,1);
      mesh.position.set(x,this.height(x,z)-2,z);mesh.rotation.order='YXZ';mesh.rotation.z=(R()-.5)*.5-.2;
      this.scene.add(mesh);this.rays.push(mesh);
    }
  }

  buildDust(){
    const N=this.small?900:1800,R=rng(5),pos=new Float32Array(N*3),r4=new Float32Array(N*4);
    for(let i=0;i<N;i++){pos.set([(R()-.5)*70,(R()-.5)*22,(R()-.5)*70],i*3);r4.set([R(),R(),R(),R()],i*4)}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aR',new THREE.BufferAttribute(r4,4));
    this.dustMat=new THREE.ShaderMaterial({vertexShader:dustVert,fragmentShader:dustFrag,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      uniforms:{uTime:this.flowerMat.uniforms.uTime,uPx:this.flowerMat.uniforms.uPx,uCam:{value:new THREE.Vector3()}}});
    const pts=new THREE.Points(g,this.dustMat);pts.frustumCulled=false;this.scene.add(pts);
  }

  buildPost(){
    const r=this.renderer;
    this.composer=new EffectComposer(r);
    this.composer.addPass(new RenderPass(this.scene,this.camera));
    this.bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.75,.55,.6);
    this.composer.addPass(this.bloom);
    this.final=new ShaderPass(finalShader);this.final.uniforms.uJitter.value=this.reduced?.3:1;
    this.composer.addPass(new OutputPass());
    this.composer.addPass(this.final); // grain, RGB split and vignette in display space
    this.resize();
  }

  bind(){
    addEventListener('resize',()=>this.resize());
    addEventListener('wheel',e=>{const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;this.target+=dy*.035*this.flight},{passive:true});
    let ty=null;
    addEventListener('touchstart',e=>{ty=e.touches[0].clientY;this.setMouse(e.touches[0])},{passive:true});
    addEventListener('touchmove',e=>{const y=e.touches[0].clientY;if(ty!==null)this.target+=(ty-y)*.035*20*.1*this.flight;ty=y;this.setMouse(e.touches[0])},{passive:true});
    addEventListener('touchend',()=>{ty=null;this.mouseT.set(9,9)});
    addEventListener('pointermove',e=>{if(e.pointerType==='mouse')this.setMouse(e)});
    document.addEventListener('pointerleave',()=>this.mouseT.set(9,9));
    addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' ')this.target+=8*this.flight;if(e.key==='ArrowUp'||e.key==='PageUp')this.target-=8*this.flight});
  }
  setMouse(e){this.mouseT.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1)}

  resize(){
    const w=innerWidth,h=innerHeight,r=this.renderer;
    this.camera.aspect=w/h;this.camera.fov=w/h<1?68:55;this.camera.updateProjectionMatrix();
    r.setSize(w,h);this.composer.setSize(w,h);this.composer.setPixelRatio(r.getPixelRatio());
    const pr=r.getPixelRatio();
    this.flowerMat.uniforms.uPx.value=h*pr*.5*this.camera.projectionMatrix.elements[5];
    this.flowerMat.uniforms.uMaxSize.value=110*pr;this.flowerMat.uniforms.uAspect.value=w/h;
    this.final.uniforms.uRes.value.set(w*pr,h*pr);
  }

  startHoverTransition(){this.flightTarget=0;this.disperseTarget=1;audioState.setMuffled(true)}
  stopHoverTransition(){this.flightTarget=1;this.disperseTarget=0;audioState.setMuffled(false)}

  tick(){
    const dt=Math.min(this.clock.getDelta(),.05);this.time+=dt;const t=this.time;
    const intro=Math.min(1,this.clock.elapsedTime/4.5),ie=1-Math.pow(1-intro,3);
    // flight + hover easing
    this.flight+=(this.flightTarget-this.flight)*Math.min(1,dt*(this.flightTarget?1.2:1.8));
    this.disperse+=(this.disperseTarget-this.disperse)*Math.min(1,dt*1.5);
    const idle=(this.reduced?.5:1.6)*this.flight*ie;
    this.target+=idle*dt;
    const prev=this.dist;
    this.dist+=(this.target-this.dist)*Math.min(1,dt*2.6)*Math.max(this.flight,.02);
    const v=Math.abs(this.dist-prev)/Math.max(dt,1e-4);
    this.speed+=(Math.min(1,Math.max(0,(v-2)/22))-this.speed)*Math.min(1,dt*3);
    // camera
    const L=this.pathLen,wrap=d=>(((d%L)+L)%L)/L;
    const back=(1-ie)*45,d=this.dist-back;
    const pos=this.curve.getPointAt(wrap(d)),look=this.curve.getPointAt(wrap(d+10));
    pos.y+=(1-ie)*18;look.y-=.9+(1-ie)*4;
    this.mouse.lerp(this.mouseT,Math.min(1,dt*6));
    const mx=Math.abs(this.mouseT.x)>2?0:this.mouseT.x,my=Math.abs(this.mouseT.y)>2?0:this.mouseT.y;
    this.tilt.x+=(mx-this.tilt.x)*Math.min(1,dt*2);this.tilt.y+=(my-this.tilt.y)*Math.min(1,dt*2);
    const fwd=look.clone().sub(pos).normalize(),right=new THREE.Vector3().crossVectors(fwd,this.camera.up).normalize();
    look.addScaledVector(right,this.tilt.x*1.6).y+=this.tilt.y*.9;
    pos.y+=Math.sin(t*.5)*.12;
    this.camera.position.copy(pos);this.camera.lookAt(look);
    // uniforms
    const u=this.flowerMat.uniforms;
    u.uTime.value=t;u.uDisperse.value=this.disperse;u.uBloom.value=.25+.75*smooth(.05,.8,intro);
    this.sky.position.copy(pos);this.stars.position.copy(pos);this.starMat.uniforms.uTime.value=t;
    this.dustMat.uniforms.uCam.value.copy(pos);
    for(const ray of this.rays){ray.rotation.y=Math.atan2(pos.x-ray.position.x,pos.z-ray.position.z);ray.material.uniforms.uFade.value=1-this.disperse*.6}
    this.final.uniforms.uTime.value=t;this.final.uniforms.uSpeed.value=this.speed;
    this.bloom.strength=.75+this.disperse*.15;
    this.composer.render(dt);
    if(!this.loadedSent){this.loadedSent=true;requestAnimationFrame(()=>this.onLoaded&&this.onLoaded())}
    if(intro>=1&&this.onIntroDone)this.onIntroDone();
  }
}

/* ---------------------------------------------------------------
   Boot
---------------------------------------------------------------- */
let introShown=false;
const valley=new Valley(document.getElementById('valley'),
  ()=>document.getElementById('loader').classList.add('gone'),
  ()=>{if(!introShown){introShown=true;document.getElementById('ui').classList.add('on')}});
audioStore().initAudio();
const sound=document.getElementById('sound');
sound.onclick=()=>{const s=audioStore();if(!s.isInitialized)return;const muted=s.toggleMute();sound.setAttribute('aria-pressed',String(!muted))};
const go=document.getElementById('go');
go.addEventListener('pointerenter',()=>valley.startHoverTransition&&valley.startHoverTransition());
go.addEventListener('pointerleave',()=>valley.stopHoverTransition&&valley.stopHoverTransition());
go.addEventListener('focus',()=>valley.startHoverTransition&&valley.startHoverTransition());
go.addEventListener('blur',()=>valley.stopHoverTransition&&valley.stopHoverTransition());
</script>
