<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#E8EEF5; --ink:#12233A; --muted:#566579; --line:#D5DEE9;
  --brand:#0B4677; --brand-2:#083457; --brand-ink:#FFFFFF; --brand-soft:#DCE8F4;
  --mark:#F7941D; --mark-ink:#2E1800; --mark-soft:#FDEBD3;
  --ok:#2C7A4B; --ok-soft:#DDF0E4; --warn:#9A6412; --warn-soft:#FBEBCF; --bad:#B63A33; --bad-soft:#F7E0DE; --info:#2C659F; --info-soft:#DDE9F5;
  --shadow:0 1px 2px rgba(18,35,58,.06),0 6px 20px rgba(18,35,58,.06);
  --r:14px; --r-sm:10px;
  --f-display:"Plus Jakarta Sans","El Messiri","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-serif:"Cormorant Garamond",Georgia,serif;
  --f-body:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B121C; --surface:#131C28; --surface-2:#1B2636; --ink:#E4EAF3; --muted:#9AA8BA; --line:#283548;
    --brand:#6FA8DC; --brand-2:#8DBBE6; --brand-ink:#061526; --brand-soft:#15283F;
    --mark:#F7A23B; --mark-ink:#2A1600; --mark-soft:#3A2812;
    --ok:#62C48C; --ok-soft:#173424; --warn:#E3AE55; --warn-soft:#3A2D14; --bad:#EE7D74; --bad-soft:#3D1D1A; --info:#7EB2E6; --info-soft:#172A3D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B121C; --surface:#131C28; --surface-2:#1B2636; --ink:#E4EAF3; --muted:#9AA8BA; --line:#283548;
  --brand:#6FA8DC; --brand-2:#8DBBE6; --brand-ink:#061526; --brand-soft:#15283F;
  --mark:#F7A23B; --mark-ink:#2A1600; --mark-soft:#3A2812;
  --ok:#62C48C; --ok-soft:#173424; --warn:#E3AE55; --warn-soft:#3A2D14; --bad:#EE7D74; --bad-soft:#3D1D1A; --info:#7EB2E6; --info-soft:#172A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"kern","liga"}
[dir="rtl"] body,body[dir="rtl"],[dir="rtl"]{line-height:1.75}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{letter-spacing:0;line-height:1.45}
.card-hero h1,.card-hero h2,.card-hero h3,.card-hero h4{color:inherit}
p{text-wrap:pretty}
h1{font-size:27px} h2{font-size:21px} h3{font-size:17.5px} h4{font-size:15px}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
[dir="rtl"] .eyebrow{letter-spacing:0;text-transform:none;font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.stack-l{display:flex;flex-direction:column;gap:22px}
.grow{flex:1;min-width:0}
.ico{width:20px;height:20px;flex:none}
.ico-s{width:16px;height:16px;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* Demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:var(--bg);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.demobar .lbl{font-size:12px;opacity:.75}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px}
:root[data-theme="dark"] .seg{background:rgba(0,0,0,.12)}

function compPct(e){const c=course(e.cid);return c.lessons.length?Math.round(e.done.length/c.lessons.length*100):0;}
function quizAvg(e){const v=Object.values(e.quiz||{});if(!v.length)return null;return Math.round(v.reduce((a,b)=>a+b,0)/(v.length*3)*100);}

  }else{
    const tr=trainer(d.mode==='group'?c.groupTrainer:d.trainerId);
    body=`<h2>${t('review')}</h2><div class="card list" style="padding-block:4px">

function scrLesson(){

  <section class="stack"><h3>${t('practice')}</h3>${qz.map((q,qi)=>`<div class="card stack-s"><p class="small muted">${t('whichWord')}</p><p dir="auto" style="text-align:start"><b>“${esc(q.d)}”</b></p><div class="row wrap" dir="auto">${q.opts.map(o=>{const ans=q.picked!=null;const cls=ans?(o===q.w?'btn-ok':(o===q.picked?'btn-bad':'btn-g')):'btn-g';return `<button class="btn btn-s ${cls}" data-a="quizPick" data-q="${qi}" data-v="${esc(o)}" ${ans?'disabled':''}>${esc(o)}</button>`;}).join('')}</div></div>`).join('')}</section>

function buildQuiz(v){return v.slice(0,3).map(x=>{const opts=v.map(y=>y.w).sort(()=>Math.random()-.5);return {w:x.w,d:x.d,opts,picked:null};});}

}

const trSessions=tid=>S.sessions.filter(s=>s.trainerId===tid).sort((a,b)=>new Date(a.at)-new Date(b.at));
function trSessCard(s){const c=course(s.cid);const roster=sessionRoster(s);const e=s.eid&&byId(S.enrollments,s.eid);
  return `<div class="card sess" style="flex-wrap:wrap"><div class="time">${fTime(s.at)}</div><div class="grow" style="min-width:160px"><b>${esc(c.title)}</b><p class="xs muted">${s.eid?t('oneToOne')+' · '+esc(studentOf(e.sid).name):t('group')+' · '+roster.length+' '+t('students')}</p></div>
  ${isLive(s)?`<span class="chip live"><span class="live-dot"></span>${t('liveNow')}</span>`:chip(s.status==='done'?'done':'scheduled')}
  <div class="row"><a class="btn btn-${isLive(s)?'m':'g'} btn-s" href="${esc(s.link)}" target="_blank" rel="noopener">${I('video','ico-s')} ${t('joinClass')}</a><button class="btn btn-g btn-s" data-a="att" data-id="${s.id}">${I('clip','ico-s')} ${t('takeAtt')}</button><button class="btn btn-g btn-s" data-a="editLink" data-id="${s.id}" aria-label="${t('editLink')}">${I('edit','ico-s')}</button></div></div>`;}
function trToday(){const tid=S.ui.trainerId;const all=trSessions(tid);const today=all.filter(s=>dayKey(s.at)===dayKey(new Date().toISOString()));const next=all.filter(s=>new Date(s.at)>Date.now()&&dayKey(s.at)!==dayKey(new Date().toISOString())&&new Date(s.at)<Date.now()+7*DAY);
  const needAtt=all.filter(s=>s.status!=='done'&&new Date(s.at)<Date.now()-60*MIN);
  const st=Object.keys(studentsOfTrainer(tid)).length;
  return `<div class="page-h"><div><p class="muted small">${fDate(new Date().toISOString(),{weekday:'long',day:'numeric',month:'long'})}</p><h1>${U.lang==='ar'?'مرحباً':'Hello'}, ${esc(trainer(tid).name.split(' ')[0])}</h1></div></div>
  <div class="stats"><div class="stat"><span class="small muted">${t('tr_today')}</span><b>${today.length}</b></div><div class="stat"><span class="small muted">${t('next7')}</span><b>${next.length}</b></div><div class="stat"><span class="small muted">${t('tr_students')}</span><b>${st}</b></div>${needAtt.length?`<div class="stat alert"><span class="small">${t('takeAtt')}</span><b>${needAtt.length}</b></div>`:''}</div>
  ${needAtt.length?`<section class="stack"><h2>${t('takeAtt')}</h2>${needAtt.map(trSessCard).join('')}</section>`:''}
  <section class="stack"><h2>${t('tr_today')}</h2>${today.map(trSessCard).join('')||`<div class="empty">${t('noClassesToday')}</div>`}</section>
  <section class="stack"><h2>${t('next7')}</h2>${next.map(s=>`<div class="day-h">${dayLabel(s.at)}</div>`+trSessCard(s)).join('')||`<div class="empty">—</div>`}</section>`;}
function trSchedule(){const tid=S.ui.trainerId;const all=trSessions(tid);const up=all.filter(s=>new Date(s.at)>Date.now()-2*HR);const past=all.filter(s=>new Date(s.at)<=Date.now()-2*HR).reverse();
  const days={};up.forEach(s=>{(days[dayKey(s.at)]=days[dayKey(s.at)]||[]).push(s);});
  return `<div class="page-h"><h1>${t('tr_schedule')}</h1></div>${Object.values(days).map(a=>`<section class="stack"><div class="day-h">${dayLabel(a[0].at)}</div>${a.map(trSessCard).join('')}</section>`).join('')}
  <section class="stack"><h2>${t('past')}</h2><div class="tbl-wrap"><table><thead><tr><th>${t('date')}</th><th>${t('course')}</th><th>${t('attendance')}</th><th>${t('status')}</th></tr></thead><tbody>${past.map(s=>{const r=sessionRoster(s);const p=r.filter(x=>['present','late'].includes(s.att[x])).length;return `<tr><td>${fDT(s.at)}</td><td>${esc(course(s.cid).title)}</td><td class="num">${p}/${r.length}</td><td>${chip(s.status==='done'?'done':'scheduled')}</td></tr>`;}).join('')}</tbody></table></div></section>`;}
function trStudents(){const tid=S.ui.trainerId;const map=studentsOfTrainer(tid);
  return `<div class="page-h"><h1>${t('tr_students')}</h1></div><div class="tbl-wrap"><table><thead><tr><th>${t('student')}</th><th>${t('course')}</th><th>${t('level')}</th><th>${t('completion')}</th><th>${t('attendance')}</th><th>${t('notes')}</th></tr></thead><tbody>
  ${Object.entries(map).map(([sid,es])=>{const s=studentOf(sid);return es.map((e,k)=>`<tr>${k===0?`<td rowspan="${es.length}"><div class="row">${avatar({name:s.name,col:'var(--brand)'},'sm')}<b>${esc(s.name)}</b></div></td>`:''}<td>${esc(course(e.cid).title)} <span class="xs muted">${e.mode==='1to1'?'1:1':''}</span></td><td>${s.level?lvl(s.level):'—'}</td><td style="min-width:120px"><div class="row"><div class="bar grow"><i style="width:${compPct(e)}%"></i></div><span class="num xs">${compPct(e)}%</span></div></td><td class="num">${attPct(e)==null?'—':attPct(e)+'%'}</td>${k===0?`<td rowspan="${es.length}" style="max-width:240px"><button class="btn btn-t btn-s" data-a="note" data-id="${sid}" style="text-align:start">${S.notes[tid+':'+sid]?esc(S.notes[tid+':'+sid]):I('edit','ico-s')+' '+t('add')}</button></td>`:''}</tr>`).join('');}).join('')}</tbody></table></div>`;}
function trCourses(tid){return S.courses.filter(c=>c.trainers.includes(tid)||c.groupTrainer===tid);}
function trHomework(){const tid=S.ui.trainerId;const cs=trCourses(tid).map(c=>c.id);const hws=S.homework.filter(h=>cs.includes(h.cid));
  const pend=[];hws.forEach(h=>h.subs.forEach((s,i)=>{if(!s.fb)pend.push({h,s,i});}));
  return `<div class="page-h"><h1>${t('tr_homework')}</h1><button class="btn btn-p btn-s" data-a="addHw">${I('plus','ico-s')} ${t('addHw')}</button></div>
  <section class="stack"><h2>${t('pendingFb')} <span class="chip chip-warn num">${pend.length}</span></h2>${pend.map(({h,s,i})=>`<div class="card stack-s"><div class="row between wrap"><div class="row">${avatar({name:studentOf(s.sid).name,col:'var(--brand)'},'sm')}<b>${esc(studentOf(s.sid).name)}</b></div><span class="xs muted">${ago(s.at)}</span></div><p class="small"><span class="chip ${h.kind==='speaking'?'chip-info':''}">${h.kind==='speaking'?t('speakingTask'):t('writingTask')}</span> <span dir="ltr">${esc(h.title)}</span></p>${s.text?`<p class="q-passage small">${esc(s.text)}</p>`:''}${s.file?`<p class="small row">${I(h.kind==='speaking'?'mic':'file','ico-s')} ${esc(s.file)}</p>`:''}<div><button class="btn btn-p btn-s" data-a="fb" data-id="${h.id}" data-i="${i}">${t('giveFb')}</button></div></div>`).join('')||`<div class="empty">—</div>`}</section>
  <section class="stack"><h2>${t('homework')}</h2><div class="tbl-wrap"><table><thead><tr><th>${t('title')}</th><th>${t('course')}</th><th>${t('due')}</th><th>${t('submissions')}</th></tr></thead><tbody>${hws.map(h=>`<tr><td dir="ltr" style="text-align:start">${esc(h.title)}</td><td>${esc(course(h.cid).title)}</td><td>${fDT(h.due)}</td><td class="num">${h.subs.length} · ${h.subs.filter(s=>s.fb).length} ${t('reviewedFb')}</td></tr>`).join('')}</tbody></table></div></section>`;}
function trSlots(){const x=trainer(S.ui.trainerId);const slots=x.slots.filter(s=>new Date(s)>Date.now()).sort();const days={};slots.forEach(s=>{(days[dayKey(s)]=days[dayKey(s)]||[]).push(s);});
  const d=new Date(Date.now()+DAY);const dv=d.toISOString().slice(0,10);
  return `<div class="page-h"><h1>${t('tr_slots')}</h1></div>
  <form class="card row wrap" data-f="addSlot" style="align-items:flex-end"><label class="f">${t('date')}<input class="inp" type="date" id="sl-date" name="date" value="${dv}" required></label><label class="f">${t('time')}<input class="inp" type="time" id="sl-time" name="time" value="18:00" required></label><button class="btn btn-p" type="submit">${I('plus','ico-s')} ${t('addSlot')}</button></form>
  <p class="small muted">${U.lang==='ar'?'تظهر هذه الأوقات للطلاب عند حجز حصص فردية، وتُحذف تلقائياً عند تأكيد الحجز.':'Students see these times when booking One-to-One lessons. A slot is removed automatically once a booking is approved.'}</p>
  ${Object.values(days).map(a=>`<section class="stack-s"><div class="day-h">${dayLabel(a[0])}</div><div class="row wrap">${a.map(s=>`<span class="chip" style="padding:6px 6px 6px 12px;font-size:14px"><span class="num" dir="ltr">${fTime(s)}</span><button data-a="delSlot" data-v="${s}" aria-label="${t('del')}" style="border:0;background:none;cursor:pointer;color:inherit;display:grid">${I('x','ico-s')}</button></span>`).join('')}</div></section>`).join('')||`<div class="empty">${t('noSlots')}</div>`}`;}

/* ============ ADMIN ============ */
function renderAdmin(){
  const pend=S.enrollments.filter(e=>e.status==='payment_pending').length;
  const tabs=[['dash','chart',t('ad_dash')],['payments','card',t('ad_payments'),pend],['bookings','cal',t('ad_bookings')],['students','users',t('ad_students')],['trainers','user',t('ad_trainers')],['courses','book',t('ad_courses')],['levels','layers',t('ad_levels')],['tests','target',t('ad_tests')],['att','clip',t('ad_att')],['hw','file',t('ad_hw')],['certs','award',t('ad_certs')],['notif','megaphone',t('ad_notif'),unread('admin')],['settings','gear',t('ad_settings')]];
  const fn={dash:adDash,payments:adPayments,bookings:adBookings,students:adStudents,trainers:adTrainers,courses:adCourses,levels:adLevels,tests:adTests,att:adAtt,hw:adHw,certs:adCerts,notif:adNotif,settings:adSettings}[U.adTab]||adDash;
  return `<div class="console"><aside class="side">${brandHTML}<nav class="nav">${tabs.map(([k,ic,l,c])=>`<button data-a="adTab" data-v="${k}" aria-current="${U.adTab===k}">${I(ic,'ico-s')}<span>${l}</span>${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}</nav></aside><main class="main">${fn()}</main></div>`;
}
function adDash(){const pend=S.enrollments.filter(e=>e.status==='payment_pending');const act=S.enrollments.filter(e=>e.status==='active');
  const rev=S.enrollments.filter(e=>e.payment&&e.payment.status==='approved').reduce((a,e)=>a+e.payment.amount,0);
  const today=S.sessions.filter(s=>dayKey(s.at)===dayKey(new Date().toISOString()));
  const byCat=S.cats.map(c=>({c,n:S.enrollments.filter(e=>course(e.cid).cat===c.id&&['active','completed','payment_pending'].includes(e.status)).length}));const mx=Math.max(1,...byCat.map(x=>x.n));
  return `<div class="page-h"><div><p class="eyebrow">Learnova · Admin</p><h1>${t('ad_dash')}</h1></div><span class="chip">${t('sampleData')}</span></div>
  <div class="stats"><div class="stat"><span class="small muted">${t('k_students')}</span><b>${S.students.length}</b></div><div class="stat"><span class="small muted">${t('k_active')}</span><b>${act.length}</b></div><button class="stat ${pend.length?'alert':''}" style="text-align:start;cursor:pointer;font:inherit" data-a="adTab" data-v="payments"><span class="small">${t('k_pending')}</span><b>${pend.length}</b></button><div class="stat"><span class="small muted">${t('k_revenue')}</span><b style="font-size:22px">${money(rev)}</b></div><div class="stat"><span class="small muted">${t('k_today')}</span><b>${today.length}</b></div></div>
  <div class="cols"><section class="card stack"><h2>${t('byCat')}</h2>${byCat.map(x=>`<div class="hbar"><span class="small">${esc(tx(x.c))}</span><div class="bar" style="height:12px"><i style="width:${x.n/mx*100}%"></i></div><span class="num small">${x.n}</span></div>`).join('')}</section>
  <section class="card stack"><h2>${t('recent')}</h2>${notifList(S.notifs.filter(n=>n.to==='admin').slice(0,5)).replace('class="card list"','class="list"')}</section></div>
  ${pend.length?`<section class="stack"><h2>${t('k_pending')}</h2>${pend.map(payCard).join('')}</section>`:''}`;}
function payCard(e){const c=course(e.cid);const s=studentOf(e.sid);const tr=trainer(e.trainerId);
  return `<div class="card row wrap" style="align-items:flex-start">${e.payment.receipt?`<button data-a="viewReceipt" data-id="${e.id}" style="border:0;padding:0;background:none;cursor:zoom-in"><img src="${e.payment.receipt}" alt="${t('receipt')}" style="width:78px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"></button>`:`<div class="cover" style="width:78px;height:100px">${I('file')}</div>`}
  <div class="grow stack-s" style="min-width:200px"><b>${esc(s.name)}</b><p class="small">${esc(c.title)} · ${e.mode==='1to1'?t('oneToOne'):t('group')} · ${esc(tr?tr.name:'')}</p>${e.slot?`<p class="xs muted">${fDT(e.slot)}</p>`:''}<p class="xs muted">${t('submittedAt')} ${ago(e.payment.at)} · ${esc(e.payment.file||'')}</p><b class="num">${money(e.payment.amount)}</b></div>
  <div class="row"><button class="btn btn-ok btn-s" data-a="approve" data-id="${e.id}">${I('check','ico-s')} ${t('approve')}</button><button class="btn btn-bad btn-s" data-a="reject" data-id="${e.id}">${I('x','ico-s')} ${t('reject')}</button></div></div>`;}
function adPayments(){const pend=S.enrollments.filter(e=>e.status==='payment_pending');const done=S.enrollments.filter(e=>e.payment&&e.payment.status!=='pending').sort((a,b)=>new Date(b.payment.at)-new Date(a.payment.at));
  return `<div class="page-h"><h1>${t('ad_payments')}</h1></div><section class="stack">${pend.map(payCard).join('')||`<div class="empty">${t('noPending')}</div>`}</section>
  <section class="stack"><h2>${t('reviewed')}</h2><div class="tbl-wrap"><table><thead><tr><th>${t('student')}</th><th>${t('course')}</th><th>${t('amount')}</th><th>${t('submittedAt')}</th><th>${t('status')}</th></tr></thead><tbody>${done.map(e=>`<tr><td>${esc(studentOf(e.sid).name)}</td><td>${esc(course(e.cid).title)}</td><td class="num">${money(e.payment.amount)}</td><td>${fDate(e.payment.at)}</td><td>${e.payment.status==='approved'?`<span class="chip chip-ok">${U.lang==='ar'?'مقبول':'Approved'}</span>`:`<span class="chip chip-bad">${U.lang==='ar'?'مرفوض':'Rejected'}</span>${e.payment.reason?`<div class="xs muted">${esc(e.payment.reason)}</div>`:''}`}</td></tr>`).join('')}</tbody></table></div></section>`;}
function adBookings(){const f=U.bookFilter;const sts=['all','booking_pending','payment_pending','active','rejected','completed','cancelled'];const list=S.enrollments.filter(e=>f==='all'||e.status===f).sort((a,b)=>new Date(b.created)-new Date(a.created));
  return `<div class="page-h"><h1>${t('ad_bookings')}</h1></div><div class="hscroll">${sts.map(s=>`<button class="pill" data-a="bookF" data-v="${s}" aria-pressed="${f===s}">${s==='all'?t('all'):t('st_'+s)} <span class="num muted">${s==='all'?S.enrollments.length:S.enrollments.filter(e=>e.status===s).length}</span></button>`).join('')}</div>
  <div class="tbl-wrap"><table><thead><tr><th>${t('student')}</th><th>${t('course')}</th><th>${t('mode')}</th><th>${t('trainer')}</th><th>${t('scheduleL')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead><tbody>${list.map(e=>{const c=course(e.cid);return `<tr><td>${esc(studentOf(e.sid).name)}</td><td>${esc(c.title)}</td><td>${e.mode==='1to1'?t('oneToOne'):t('group')}</td><td>${esc((trainer(e.trainerId)||{}).name||'')}</td><td class="small">${e.slot?fDT(e.slot):esc(tx(c.sched))}</td><td>${chip(e.status)}</td><td>${['booking_pending','payment_pending','active'].includes(e.status)?`<button class="btn btn-t btn-s" data-a="cancelBk" data-id="${e.id}">${t('cancelBooking')}</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`;}
function adStudents(){return `<div class="page-h"><h1>${t('ad_students')}</h1><span class="muted small num">${S.students.length}</span></div><div class="tbl-wrap"><table><thead><tr><th>${t('fullName')}</th><th>${t('phone')}</th><th>${t('level')}</th><th>${t('courses')}</th><th>${t('country')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>
  ${S.students.map(s=>`<tr><td><button class="btn btn-t btn-s" style="padding-inline:0" data-a="viewStudent" data-id="${s.id}"><b>${esc(s.name)}</b></button></td><td class="mono small" dir="ltr">${esc(s.phone)}</td><td>${s.level?lvl(s.level):'—'}</td><td class="num">${enrOf(s.id).filter(e=>e.status==='active').length}</td><td>${esc(s.country||'')}</td><td>${s.active?`<span class="chip chip-ok">${t('active')}</span>`:`<span class="chip chip-bad">${t('suspendedL')}</span>`}</td><td><button class="btn btn-g btn-s" data-a="toggleStudent" data-id="${s.id}">${s.active?t('suspend'):t('activate')}</button></td></tr>`).join('')}</tbody></table></div>`;}

function adTrainers(){return `<div class="page-h"><h1>${t('ad_trainers')}</h1><button class="btn btn-p btn-s" data-a="editTrainer" data-id="new">${I('plus','ico-s')} ${t('newTrainer')}</button></div>

function adCourses(){return `<div class="page-h"><h1>${t('ad_courses')}</h1><button class="btn btn-p btn-s" data-a="editCourse" data-id="new">${I('plus','ico-s')} ${t('newCourse')}</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>${t('course')}</th><th>${t('category')}</th><th>${t('level')}</th><th>${t('modes')}</th><th>${t('price')}</th><th>${t('seatsLeft')}</th><th>${t('trainersL')}</th><th></th></tr></thead><tbody>
  ${S.courses.map(c=>`<tr style="${c.active?'':'opacity:.55'}"><td><b>${esc(c.title)}</b>${c.active?'':` <span class="chip">${t('archived')}</span>`}</td><td class="small">${esc(tx(catOf(c.cat)))}</td><td>${lvl(c.level)}</td><td class="small">${c.modes.map(m=>m==='1to1'?'1:1':t('group')).join(' · ')}</td><td class="num small">${c.modes.map(m=>money(priceFor(c,m))).join(' / ')}</td><td class="num">${c.modes.includes('group')?(c.seats-seatsTaken(c.id))+'/'+c.seats:'—'}</td><td class="small">${c.trainers.map(id=>esc((trainer(id)||{}).name||'')).join(', ')}</td><td><div class="row"><button class="btn btn-g btn-s" data-a="editCourse" data-id="${c.id}">${t('edit')}</button><button class="btn btn-t btn-s" data-a="archiveCourse" data-id="${c.id}">${c.active?t('archive'):t('restore')}</button></div></td></tr>`).join('')}</tbody></table></div>`;}

  <label class="f">${t('price1')}<input class="inp" id="cf-price1" type="number" name="price1" min="0" value="${c.price1||0}"></label>

  <div class="f full"><span>${t('trainersL')} (${t('oneToOne')})</span><div class="row wrap">${S.trainers.map(x=>`<label class="chip" style="cursor:pointer"><input type="checkbox" name="trainers" value="${x.id}" ${c.trainers.includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')}</div></div>
  <label class="f full">${t('descAr')}<textarea class="inp" id="cf-descar" name="descar">${esc(c.desc.ar)}</textarea></label>
  <label class="f full">${t('descEn')}<textarea class="inp" id="cf-descen" name="descen" dir="ltr">${esc(c.desc.en)}</textarea></label>
  <label class="f">${t('outAr')} <span class="xs muted">${t('onePerLine')}</span><textarea class="inp" id="cf-outar" name="outar">${esc(c.outcomes.ar.join('\n'))}</textarea></label>

  <label class="f">${t('materials')} <span class="xs muted">${t('onePerLine')}</span><textarea class="inp" id="cf-mat" name="materials" dir="ltr">${esc(c.materials.join('\n'))}</textarea></label></div>

function adLevels(){const used=l=>S.courses.some(c=>c.level===l);const usedC=id=>S.courses.some(c=>c.cat===id);
  return `<div class="page-h"><h1>${t('ad_levels')}</h1></div><div class="cols">
  <section class="card stack"><h2>${t('category')}</h2><div class="list">${S.cats.map(c=>`<div class="li"><div class="grow"><b>${esc(c.ar)}</b><p class="xs muted" dir="ltr" style="text-align:start">${esc(c.en)}</p></div><span class="num small muted">${S.courses.filter(x=>x.cat===c.id).length}</span>${usedC(c.id)?`<span class="xs muted">${t('inUse')}</span>`:`<button class="btn btn-t btn-s" data-a="delCat" data-id="${c.id}">${t('del')}</button>`}</div>`).join('')}</div>
  <form class="fgrid" data-f="addCat"><label class="f">${t('nameAr')}<input class="inp" id="nc-ar" name="ar" required></label><label class="f">${t('nameEn')}<input class="inp" id="nc-en" name="en" dir="ltr" required></label><button class="btn btn-g full" type="submit">${I('plus','ico-s')} ${t('addCat')}</button></form></section>
  <section class="card stack"><h2>${t('levelsL')}</h2><div class="row wrap">${S.levels.map(l=>`<span class="chip" style="padding:5px 6px 5px 5px">${lvl(l)}${used(l)?'':`<button data-a="delLevel" data-v="${esc(l)}" style="border:0;background:none;cursor:pointer;color:inherit;display:grid" aria-label="${t('del')}">${I('x','ico-s')}</button>`}</span>`).join('')}</div>

function adTests(){return `<div class="page-h"><h1>${t('ad_tests')}</h1><span class="small muted num">${S.qs.length} ${U.lang==='ar'?'سؤالاً':'questions'}</span></div>
  <div class="cols"><section class="stack"><h2>${t('qBank')}</h2><div class="tbl-wrap"><table><thead><tr><th>#</th><th>${t('skill')}</th><th>${t('qText')}</th><th>${t('correct')}</th><th></th></tr></thead><tbody>${S.qs.map((q,i)=>`<tr><td class="num">${i+1}</td><td><span class="chip chip-brand">${t('sk_'+q.skill)}</span></td><td dir="ltr" style="text-align:start" class="small">${esc(q.q)}${q.audio?` <span class="chip chip-info">${I('volume','ico-s')}</span>`:''}</td><td class="small" dir="ltr">${esc(q.o[q.a])}</td><td><button class="btn btn-t btn-s" data-a="delQ" data-id="${q.id}">${t('del')}</button></td></tr>`).join('')}</tbody></table></div>
  <form class="card stack" data-f="addQ"><h3>${t('addQ')}</h3><div class="fgrid"><label class="f">${t('skill')}<select class="inp" id="aq-skill" name="skill">${['grammar','vocab','reading','listening'].map(k=>`<option value="${k}">${t('sk_'+k)}</option>`).join('')}</select></label><label class="f">${t('correct')}<input class="inp" id="aq-a" name="a" type="number" min="1" max="6" value="1"></label>
  <label class="f full">${t('qText')}<input class="inp" id="aq-q" name="q" dir="ltr" required></label><label class="f full">${t('options')}<textarea class="inp" id="aq-o" name="o" dir="ltr" required></textarea></label><label class="f full">Audio / Passage <span class="xs muted">(${U.lang==='ar'?'اختياري':'optional'})</span><input class="inp" id="aq-extra" name="extra" dir="ltr"></label></div><button class="btn btn-p" type="submit">${t('add')}</button></form></section>
  <section class="stack"><form class="card stack" data-f="mapping"><h2>${t('mapping')}</h2>${S.levels.map(l=>`<label class="row between">${lvl(l)}<span class="row small">${t('minPct')}<input class="inp num" id="mp-${esc(l)}" name="${esc(l)}" type="number" min="0" max="100" value="${S.mapping[l]??''}" style="width:90px"></span></label>`).join('')}<button class="btn btn-p" type="submit">${t('save')}</button></form>
  <div class="card stack"><h2>${t('results')}</h2><div class="list">${S.students.filter(s=>s.placement).map(s=>`<div class="li"><b class="grow">${esc(s.name)}</b><span class="num small">${s.placement.score}/${s.placement.total}</span>${lvl(s.placement.level)}</div>`).join('')||'—'}</div></div></section></div>`;}
function adAtt(){const rows=S.courses.filter(c=>c.active).map(c=>{const ss=S.sessions.filter(s=>s.cid===c.id&&s.status==='done');let tot=0,ok=0;ss.forEach(s=>{sessionRoster(s).forEach(sid=>{tot++;if(['present','late'].includes(s.att[sid]))ok++;});});return {c,n:ss.length,pct:tot?Math.round(ok/tot*100):null};}).filter(r=>r.n);
  const stud=S.enrollments.filter(e=>e.status==='active').map(e=>({e,p:attPct(e)})).filter(x=>x.p!=null).sort((a,b)=>a.p-b.p);
  return `<div class="page-h"><h1>${t('ad_att')}</h1></div><div class="cols"><section class="card stack"><h2>${t('avgAtt')}</h2>${rows.map(r=>`<div class="hbar"><span class="small">${esc(r.c.title)}</span><div class="bar" style="height:12px"><i style="width:${r.pct||0}%"></i></div><span class="num small">${r.pct==null?'—':r.pct+'%'}</span></div>`).join('')}</section>
  <section class="stack"><h2>${t('students')}</h2><div class="tbl-wrap"><table><thead><tr><th>${t('student')}</th><th>${t('course')}</th><th>${t('attendance')}</th></tr></thead><tbody>${stud.map(x=>`<tr><td>${esc(studentOf(x.e.sid).name)}</td><td class="small">${esc(course(x.e.cid).title)}</td><td><span class="chip ${x.p>=80?'chip-ok':x.p>=60?'chip-warn':'chip-bad'} num">${x.p}%</span></td></tr>`).join('')}</tbody></table></div></section></div>`;}
function adHw(){return `<div class="page-h"><h1>${t('ad_hw')}</h1></div><div class="tbl-wrap"><table><thead><tr><th>${t('title')}</th><th>${t('course')}</th><th>${t('hwType')}</th><th>${t('due')}</th><th>${t('submissions')}</th><th>${t('awaitingFb')}</th></tr></thead><tbody>${S.homework.map(h=>{const p=h.subs.filter(s=>!s.fb).length;return `<tr><td dir="ltr" style="text-align:start">${esc(h.title)}</td><td class="small">${esc(course(h.cid).title)}</td><td>${h.kind==='speaking'?t('speakingTask'):t('writingTask')}</td><td class="small">${fDT(h.due)}</td><td class="num">${h.subs.length}</td><td>${p?`<span class="chip chip-warn num">${p}</span>`:`<span class="chip chip-ok">0</span>`}</td></tr>`;}).join('')}</tbody></table></div>`;}
function adCerts(){const elig=S.enrollments.filter(e=>(e.status==='active'||e.status==='completed')&&!S.certs.some(c=>c.sid===e.sid&&c.cid===e.cid));
  return `<div class="page-h"><h1>${t('ad_certs')}</h1></div><section class="stack"><h2>${t('eligible')}</h2><div class="tbl-wrap"><table><thead><tr><th>${t('student')}</th><th>${t('course')}</th><th>${t('completion')}</th><th>${t('attendance')}</th><th></th></tr></thead><tbody>${elig.map(e=>`<tr><td>${esc(studentOf(e.sid).name)}</td><td>${esc(course(e.cid).title)}</td><td class="num">${compPct(e)}%</td><td class="num">${attPct(e)==null?'—':attPct(e)+'%'}</td><td><button class="btn btn-p btn-s" data-a="issueCert" data-id="${e.id}">${I('award','ico-s')} ${t('issueCert')}</button></td></tr>`).join('')}</tbody></table></div></section>
  <section class="stack"><h2>${t('issued')}</h2><div class="tbl-wrap"><table><thead><tr><th>${t('certId')}</th><th>${t('student')}</th><th>${t('course')}</th><th>${t('date')}</th><th></th></tr></thead><tbody>${S.certs.map(c=>`<tr><td class="mono">${esc(c.id)}</td><td>${esc(studentOf(c.sid).name)}</td><td>${esc(course(c.cid).title)}</td><td>${fDate(c.date)}</td><td><button class="btn btn-g btn-s" data-a="openCert" data-id="${c.id}">${t('view')}</button></td></tr>`).join('')}</tbody></table></div></section>`;}
function adNotif(){return `<div class="page-h"><h1>${t('ad_notif')}</h1><button class="btn btn-t btn-s" data-a="readAll" data-v="admin">${t('markAllRead')}</button></div>
  <form class="card stack" data-f="broadcast"><h2>${t('broadcast')}</h2><div class="fgrid"><label class="f">${t('message')} (عربي)<textarea class="inp" id="bc-ar" name="ar" required></textarea></label><label class="f">${t('message')} (English)<textarea class="inp" id="bc-en" name="en" dir="ltr" required></textarea></label></div><button class="btn btn-p" type="submit">${I('megaphone','ico-s')} ${t('send')}</button></form>
  ${notifList(S.notifs.filter(n=>n.to==='admin'))}`;}

  <section class="card stack"><h2>${t('bankSettings')}</h2><div class="fgrid"><label class="f">${t('bankName')}<input class="inp" id="st-bank" name="bank" value="${esc(s.bank)}"></label><label class="f">${t('accHolder')}<input class="inp" id="st-holder" name="holder" value="${esc(s.holder)}"></label><label class="f">${t('accNo')}<input class="inp mono" id="st-acc" name="acc" dir="ltr" value="${esc(s.acc)}"></label><label class="f">${t('iban')}<input class="inp mono" id="st-iban" name="iban" dir="ltr" value="${esc(s.iban)}"></label><label class="f">${t('currency')}<input class="inp" id="st-cur" name="currency" dir="ltr" value="${esc(s.currency)}"></label></div></section>
  <section class="card stack"><h2>${t('waSettings')}</h2><label class="f">${t('waNumber')}<input class="inp mono" id="st-wa" name="wa" dir="ltr" value="${esc(s.wa)}"></label></section>
  <p class="note small">${U.lang==='ar'?'البيانات المصرفية هنا أمثلة. استبدلها ببيانات حساب المنصة الحقيقية.':'The bank details here are examples. Replace them with the platform’s real account.'}</p>
  <button class="btn btn-p" type="submit">${t('save')}</button></form>`;}

const A={
 role:el=>{S.ui.role=el.dataset.v;save();closeSheet();render();window.scrollTo(0,0);},
 lang:()=>{U.lang=U.lang==='ar'?'en':'ar';S.ui.lang=U.lang;save();render();},
 setLang:el=>{U.lang=el.dataset.v;S.ui.lang=U.lang;save();render();},
 reset:()=>{openSheet(`${sheetHead(t('reset'))}<p>${U.lang==='ar'?'ستعود كل البيانات التجريبية إلى حالتها الأولى.':'All demo data returns to its starting state.'}</p><div class="row"><button class="btn btn-g grow" data-a="closeSheet">${t('cancel')}</button><button class="btn btn-bad grow" data-a="doReset">${t('reset')}</button></div>`);},
 doReset:()=>{S=seed();S.ui.lang=U.lang;save();U.screen='home';U.stack=[];U.pt=null;closeSheet();render();},
 tab:el=>tabGo(el.dataset.v),
 go:el=>go(el.dataset.s,{}),
 back:()=>back(),
 authMode:el=>{U.params={mode:el.dataset.v};render();},
 authBack:()=>{U.screen=me()?'more':'auth';U.params={};render();},
 forgot:()=>openSheet(`${sheetHead(t('forgot'))}<p>${t('forgotMsg')}</p><a class="btn btn-p" href="${waLink('Password reset request')}" target="_blank" rel="noopener">${I('chat','ico-s')} ${t('contactWa')}</a>`),
 logout:()=>{S.ui.sid=null;save();U.screen='auth';U.stack=[];U.params={};render();},
 goCat:el=>{U.f={q:'',cat:el.dataset.v,level:'all',type:'all'};go('courses');},
 fCat:el=>{U.f.cat=el.dataset.v;document.querySelectorAll('[data-a="fCat"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===U.f.cat));$('#clist').innerHTML=courseList();},
 openCourse:el=>go('course',{id:el.dataset.id}),
 openTrainer:el=>openSheet(trainerSheet(el.dataset.id)),
 bookTrainer:el=>{closeSheet();const c=course(el.dataset.c);U.enroll={cid:c.id,mode:'1to1',gender:'any',trainerId:el.dataset.id,slot:null,step:c.modes.length>1?'mode':'trainer'};go('enroll');},
 tg:el=>{U.tg=el.dataset.v;render();},
 enroll:el=>{const c=course(el.dataset.id);U.enroll={cid:c.id,mode:c.modes.length===1?c.modes[0]:null,gender:'any',trainerId:null,slot:null,step:c.modes.length===1?'trainer':'mode'};go('enroll');},
 enMode:el=>{U.enroll.mode=el.dataset.v;U.enroll.trainerId=null;U.enroll.slot=null;render();},
 enGender:el=>{U.enroll.gender=el.dataset.v;const tr=trainer(U.enroll.trainerId);if(tr&&el.dataset.v!=='any'&&tr.gender!==el.dataset.v)U.enroll.trainerId=null;render();},
 enTrainer:el=>{U.enroll.trainerId=el.dataset.v;U.enroll.slot=null;render();},
 enSlot:el=>{U.enroll.slot=el.dataset.v;render();},
 enNext:()=>{const d=U.enroll;const steps=d.mode==='1to1'?['mode','trainer','slot','review']:['mode','trainer','review'];d.step=steps[steps.indexOf(d.step)+1];render();window.scrollTo(0,0);},
 enPrev:()=>{const d=U.enroll;const c=course(d.cid);const steps=d.mode==='1to1'?['mode','trainer','slot','review']:['mode','trainer','review'];const i=steps.indexOf(d.step);if(i===1&&c.modes.length===1){back();return;}d.step=steps[i-1];render();},
 enConfirm:()=>{const d=U.enroll;const c=course(d.cid);const u=me();
   const e={id:uid('e'),sid:u.id,cid:c.id,mode:d.mode,trainerId:d.mode==='group'?c.groupTrainer:d.trainerId,slot:d.slot,status:'booking_pending',done:[],quiz:{},created:new Date().toISOString(),payment:null};
   S.enrollments.push(e);save();U.enroll=null;U.pendingReceipt=null;U.stack=[{screen:'learning',params:{}}];U.screen='pay';U.params={id:e.id};render();window.scrollTo(0,0);},
 pay:el=>{U.pendingReceipt=null;go('pay',{id:el.dataset.id});},
 copy:el=>copyText(el.dataset.t),
 submitReceipt:el=>{const e=byId(S.enrollments,el.dataset.id);const pr=U.pendingReceipt;if(!pr)return;const c=course(e.cid);const u=me();
   e.payment={amount:priceFor(c,e.mode),status:'pending',file:pr.name,receipt:pr.data,at:new Date().toISOString()};e.status='payment_pending';U.pendingReceipt=null;
   notify(u.id,`تم استلام إيصال الدفع لدورة ${c.title} وهو قيد المراجعة.`,`Payment receipt for ${c.title} received, pending review.`);
   notify('admin',`إيصال جديد من ${u.name} (${c.title}).`,`New receipt from ${u.name} (${c.title}).`);
   save();toast(t('receiptSent'));render();},
 openEnr:el=>go('player',{id:el.dataset.id}),
 openLesson:el=>go('lesson',{id:el.dataset.id,i:+el.dataset.i}),
 quizPick:el=>{const q=U.params.quiz[+el.dataset.q];q.picked=el.dataset.v;const e=byId(S.enrollments,U.params.id);
   if(U.params.quiz.every(x=>x.picked!=null)){e.quiz[U.params.i]=U.params.quiz.filter(x=>x.picked===x.w).length;save();}render();},
 lessonDone:()=>{const e=byId(S.enrollments,U.params.id);if(!e.done.includes(U.params.i))e.done.push(U.params.i);save();toast(t('doneL'));render();},
 speak:el=>speak(el.dataset.t),
 openHw:el=>{U.hwFile=null;openSheet(hwSheet(el.dataset.id,el.dataset.e));},
 openCert:el=>{openSheet(`${sheetHead(t('certificate'))}${certHTML(byId(S.certs,el.dataset.id))}<p class="xs muted">${U.lang==='ar'?'امسح رمز QR أو أدخل رقم الشهادة في صفحة التحقق.':'Scan the QR code or enter the ID on the verification page.'}</p>`);drawQR(el.dataset.id);},
 readAll:el=>{S.notifs.forEach(n=>{if(n.to===el.dataset.v)n.read=true;});save();render();},
 closeSheet:()=>closeSheet(),
 sheetBg:(el,ev)=>{if(ev.target===el)closeSheet();},
 ptStart:()=>{U.pt={stage:'q',i:0,ans:{}};render();},
 ptAns:el=>{U.pt.ans[U.pt.i]=+el.dataset.v;render();},
 ptNext:()=>{U.pt.i++;U.pt.showTr=false;render();window.scrollTo(0,0);},
 ptPrev:()=>{U.pt.i--;render();},
 showTr:()=>{U.pt.showTr=true;render();},
 ptFinish:()=>{const by={};let sc=0;S.qs.forEach((q,i)=>{by[q.skill]=by[q.skill]||[0,0];by[q.skill][1]++;if(U.pt.ans[i]===q.a){by[q.skill][0]++;sc++;}});
   const pct=sc/S.qs.length*100;const level=levelFor(pct);const u=me();u.placement={score:sc,total:S.qs.length,level,by,at:new Date().toISOString()};u.level=level;
   notify(u.id,`نتيجة اختبار تحديد المستوى: ${level}`,`Placement test result: ${level}`);save();U.pt={stage:'result'};render();window.scrollTo(0,0);},
 ptReset:()=>{U.pt={stage:'intro'};render();},
 // trainer
 trTab:el=>{U.trTab=el.dataset.v;render();window.scrollTo(0,0);},
 att:el=>openSheet(attSheet(el.dataset.id)),
 attSet:el=>{const s=byId(S.sessions,el.dataset.s);U.attDraft=U.attDraft||{};U.attDraft[el.dataset.st]=el.dataset.v;openSheet(attSheet(s.id,true));},
 attSave:el=>{const s=byId(S.sessions,el.dataset.id);Object.assign(s.att,U.attDraft||{});s.status='done';U.attDraft=null;
   Object.entries(s.att).forEach(([sid,v])=>{if(v==='absent')notify(sid,`تم تسجيل غيابك في حصة ${course(s.cid).title}.`,`You were marked absent in ${course(s.cid).title}.`);});
   save();closeSheet();toast(t('attSaved'));render();},
 editLink:el=>{const s=byId(S.sessions,el.dataset.id);openSheet(`${sheetHead(t('editLink'))}<form class="stack" data-f="link" data-id="${s.id}"><label class="f">${t('meetLink')}<input class="inp" id="lk-url" name="link" dir="ltr" type="url" value="${esc(s.link)}" required></label><button class="btn btn-p" type="submit">${t('save')}</button></form>`);},
 note:el=>{const k=S.ui.trainerId+':'+el.dataset.id;openSheet(`${sheetHead(t('notes')+' · '+esc(studentOf(el.dataset.id).name))}<form class="stack" data-f="note" data-id="${el.dataset.id}"><textarea class="inp" id="nt-text" name="text">${esc(S.notes[k]||'')}</textarea><button class="btn btn-p" type="submit">${t('save')}</button></form>`);},
 fb:el=>{const h=byId(S.homework,el.dataset.id);const s=h.subs[+el.dataset.i];openSheet(`${sheetHead(t('giveFb'))}<p class="small"><b>${esc(studentOf(s.sid).name)}</b> · <span dir="ltr">${esc(h.title)}</span></p>${s.text?`<p class="q-passage small">${esc(s.text)}</p>`:''}${s.file?`<p class="small row">${I('file','ico-s')} ${esc(s.file)}</p>`:''}
  <form class="stack" data-f="fb" data-id="${h.id}" data-i="${el.dataset.i}"><label class="f">${t('feedback')}<textarea class="inp" id="fb-text" name="fb" dir="ltr" required></textarea></label>
  ${h.kind==='speaking'?`<div class="fgrid">${[['fluency','fluency'],['grammar','sk_grammar'],['vocab','sk_vocab'],['pron','pron']].map(([k,l])=>`<label class="f">${t(l)} (1–5)<input class="inp" id="fb-${k}" name="${k}" type="number" min="1" max="5" value="3"></label>`).join('')}</div>`:`<label class="f">${t('grade')}<input class="inp" id="fb-grade" name="grade" dir="ltr" placeholder="8/10"></label>`}
  <button class="btn btn-p" type="submit">${t('save')}</button></form>`);},
 addHw:()=>{const cs=trCourses(S.ui.trainerId);openSheet(`${sheetHead(t('addHw'))}<form class="stack" data-f="addHw"><label class="f">${t('course')}<select class="inp" id="ah-c" name="cid">${cs.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></label><label class="f">${t('title')}<input class="inp" id="ah-t" name="title" dir="ltr" required></label><div class="fgrid"><label class="f">${t('hwType')}<select class="inp" id="ah-k" name="kind"><option value="writing">${t('writingTask')}</option><option value="speaking">${t('speakingTask')}</option></select></label><label class="f">${t('due')}<input class="inp" type="date" id="ah-d" name="due" value="${new Date(Date.now()+5*DAY).toISOString().slice(0,10)}" required></label></div><button class="btn btn-p" type="submit">${t('add')}</button></form>`);},
 delSlot:el=>{const x=trainer(S.ui.trainerId);x.slots=x.slots.filter(s=>s!==el.dataset.v);save();render();},
 // admin
 adTab:el=>{U.adTab=el.dataset.v;render();window.scrollTo(0,0);},
 viewReceipt:el=>{const e=byId(S.enrollments,el.dataset.id);openSheet(`${sheetHead(t('receipt'))}<img src="${e.payment.receipt}" alt="${t('receipt')}" style="width:100%;border-radius:10px;border:1px solid var(--line)"><div class="row"><button class="btn btn-ok grow" data-a="approve" data-id="${e.id}">${t('approve')}</button><button class="btn btn-bad grow" data-a="reject" data-id="${e.id}">${t('reject')}</button></div>`);},
 approve:el=>{const e=byId(S.enrollments,el.dataset.id);const c=course(e.cid);e.status='active';e.payment.status='approved';e.payment.reviewedAt=new Date().toISOString();
   if(e.mode==='1to1'){const tr=trainer(e.trainerId);let base=e.slot?new Date(e.slot):new Date(Date.now()+2*DAY);if(!e.slot){base.setHours(18,0,0,0);}
     for(let k=0;k<Math.min(c.sessions,12);k++){S.sessions.push({id:uid('ss'),cid:c.id,trainerId:e.trainerId,eid:e.id,at:new Date(base.getTime()+k*7*DAY).toISOString(),link:tr.meet,status:'scheduled',att:{}});}
     if(e.slot)tr.slots=tr.slots.filter(s=>s!==e.slot);}
   notify(e.sid,`تم قبول الدفع وتفعيل دورة ${c.title}. نراك في الحصة!`,`Payment approved — ${c.title} is now active. See you in class!`);
   notify(e.trainerId,`طالب جديد: ${studentOf(e.sid).name} في ${c.title}.`,`New student: ${studentOf(e.sid).name} in ${c.title}.`);
   save();closeSheet();toast(t('approvedMsg'));render();},
 reject:el=>openSheet(`${sheetHead(t('reject'))}<form class="stack" data-f="reject" data-id="${el.dataset.id}"><label class="f">${t('rejectReason')}<textarea class="inp" id="rj-reason" name="reason" required>${U.lang==='ar'?'المبلغ في الإيصال لا يطابق سعر الدورة.':'The amount on the receipt does not match the course price.'}</textarea></label><button class="btn btn-bad" type="submit">${t('reject')}</button></form>`),
 bookF:el=>{U.bookFilter=el.dataset.v;render();},
 cancelBk:el=>{const e=byId(S.enrollments,el.dataset.id);e.status='cancelled';notify(e.sid,`تم إلغاء حجزك في ${course(e.cid).title}.`,`Your booking for ${course(e.cid).title} was cancelled.`);save();render();},
 toggleStudent:el=>{const s=studentOf(el.dataset.id);s.active=!s.active;save();render();},
 viewStudent:el=>openSheet(studentSheet(el.dataset.id)),
 editTrainer:el=>openSheet(trainerForm(el.dataset.id)),
 toggleTrainer:el=>{const x=trainer(el.dataset.id);x.active=!x.active;save();render();},
 editCourse:el=>openSheet(courseForm(el.dataset.id)),
 archiveCourse:el=>{const c=course(el.dataset.id);c.active=!c.active;save();render();},
 delLevel:el=>{S.levels=S.levels.filter(l=>l!==el.dataset.v);delete S.mapping[el.dataset.v];save();render();},
 delCat:el=>{S.cats=S.cats.filter(c=>c.id!==el.dataset.id);save();render();},
 delQ:el=>{S.qs=S.qs.filter(q=>q.id!==el.dataset.id);save();render();},
 issueCert:el=>{const e=byId(S.enrollments,el.dataset.id);const c=course(e.cid);let n;do{n='EN-'+new Date().getFullYear()+'-'+String(Math.floor(1000+Math.random()*9000));}while(byId(S.certs,n));
   S.certs.push({id:n,sid:e.sid,cid:c.id,level:c.level,duration:c.weeks+' weeks',date:new Date().toISOString()});e.status='completed';
   notify(e.sid,`شهادتك في ${c.title} متاحة الآن (${n}).`,`Your ${c.title} certificate is available (${n}).`);save();toast(t('certIssued'));render();},
};
function hwSheet(hid,eid){const h=byId(S.homework,hid);const e=byId(S.enrollments,eid);const sub=h.subs.find(s=>s.sid===e.sid);
  return `${sheetHead(h.kind==='speaking'?t('speakingTask'):t('writingTask'))}<p dir="ltr" style="text-align:start"><b>${esc(h.title)}</b></p><p class="small muted">${t('due')}: ${fDT(h.due)}</p>
  ${sub?`<div class="card stack-s"><span class="chip chip-ok" style="align-self:flex-start">${t('submitted')} · ${ago(sub.at)}</span>${sub.text?`<p class="small" dir="ltr" style="text-align:start">${esc(sub.text)}</p>`:''}${sub.file?`<p class="small row">${I('file','ico-s')} ${esc(sub.file)}</p>`:''}</div>
   ${sub.fb?`<div class="note ok"><b>${t('feedback')}:</b> <span dir="ltr">${esc(sub.fb)}</span>${sub.grade?`<div class="num" style="margin-top:4px">${esc(sub.grade)}</div>`:''}${sub.scores?`<div class="xs" style="margin-top:4px">${Object.entries(sub.scores).map(([k,v])=>`${esc(k)} ${v}/5`).join(' · ')}</div>`:''}</div>`:`<p class="note warn">${t('awaitingFb')}</p>`}`
  :`<form class="stack" data-f="hw" data-id="${h.id}" data-e="${e.id}">${h.kind==='writing'?`<label class="f">${t('yourAnswer')}<textarea class="inp" id="hw-text" name="text" dir="ltr" required></textarea></label>`:''}
   <label class="drop" for="hw-file">${I(h.kind==='speaking'?'mic':'upload')}<p class="small"><b>${h.kind==='speaking'?t('attachAudio'):t('attachFile')}</b></p><p class="xs muted" id="hw-fname">${U.hwFile?esc(U.hwFile):t('uploadHint')}</p><input type="file" id="hw-file" name="file" accept="${h.kind==='speaking'?'audio/*':'image/*,application/pdf,.doc,.docx'}" data-ch="hwFile"></label>
   <button class="btn btn-p" type="submit">${t('submit')}</button></form>`}`;}
function attSheet(sid,keep){const s=byId(S.sessions,sid);if(!keep)U.attDraft=Object.assign({},s.att);const roster=sessionRoster(s);const d=U.attDraft;
  roster.forEach(x=>{if(!d[x])d[x]='present';});
  return `${sheetHead(t('takeAtt'))}<p class="small muted">${esc(course(s.cid).title)} · ${fDT(s.at)}</p><div class="card list" style="padding-block:4px">${roster.map(x=>`<div class="li" style="flex-wrap:wrap"><b class="grow">${esc(studentOf(x).name)}</b><div class="att-btns">${['present','late','absent'].map(v=>`<button data-a="attSet" data-s="${s.id}" data-st="${x}" data-v="${v}" aria-pressed="${d[x]===v}">${t(v)}</button>`).join('')}</div></div>`).join('')||`<p class="muted" style="padding:12px 0">—</p>`}</div>
  <button class="btn btn-p" data-a="attSave" data-id="${s.id}">${t('save')}</button>`;}

/* ============ forms ============ */
const F={
 login:(f,fd)=>{const ph=String(fd.get('phone')).trim();const s=S.students.find(x=>x.phone===ph&&x.pw===fd.get('pw'));
   if(!s){$('#auth-err').innerHTML=`<p class="note bad">${t('badLogin')}</p>`;return;}if(!s.active){$('#auth-err').innerHTML=`<p class="note bad">${t('suspended')}</p>`;return;}
   S.ui.sid=s.id;save();U.screen='home';U.stack=[];U.params={};render();},
 signup:(f,fd)=>{const err=m=>{$('#auth-err').innerHTML=`<p class="note bad">${m}</p>`;};const ph=String(fd.get('phone')).trim();
   if(!fd.get('name')||!ph||!fd.get('pw'))return err(U.lang==='ar'?'أكمل الحقول المطلوبة.':'Please fill in the required fields.');
   if(fd.get('pw')!==fd.get('pw2'))return err(t('pwMismatch'));if(S.students.some(s=>s.phone===ph))return err(t('phoneUsed'));if(!fd.get('terms'))return err(t('needTerms'));
   const s={id:uid('s'),name:String(fd.get('name')).trim(),phone:ph,pw:fd.get('pw'),email:fd.get('email'),gender:fd.get('gender'),country:fd.get('country'),dob:fd.get('dob'),level:null,active:true,joined:new Date().toISOString()};
   S.students.push(s);S.ui.sid=s.id;notify(s.id,'مرحباً بك في Learnova! ابدأ باختبار تحديد المستوى.','Welcome to Learnova! Start with the placement test.');save();U.stack=[];U.screen='placement';U.pt={stage:'intro'};render();},
 verify:(f,fd)=>{const id=String(fd.get('id')).trim().toUpperCase();const c=byId(S.certs,id);U.params={q:id,result:c||false};render();if(c)drawQR(c.id);},
 profile:(f,fd)=>{const u=me();['name','phone','email','dob','country'].forEach(k=>u[k]=String(fd.get(k)||'').trim()||u[k]);save();toast(t('saved'));render();},
 hw:(f,fd)=>{const h=byId(S.homework,f.dataset.id);const e=byId(S.enrollments,f.dataset.e);const text=String(fd.get('text')||'').trim();
   if(!text&&!U.hwFile){toast(h.kind==='speaking'?t('attachAudio'):t('yourAnswer'));return;}
   h.subs.push({sid:e.sid,text,file:U.hwFile,at:new Date().toISOString(),fb:null,grade:null});const c=course(h.cid);
   notify(e.trainerId,`${studentOf(e.sid).name} سلّم واجب: ${h.title}`,`${studentOf(e.sid).name} submitted: ${h.title}`);U.hwFile=null;save();closeSheet();toast(t('submitted'));render();},
 link:(f,fd)=>{byId(S.sessions,f.dataset.id).link=String(fd.get('link'));save();closeSheet();toast(t('saved'));render();},
 note:(f,fd)=>{S.notes[S.ui.trainerId+':'+f.dataset.id]=String(fd.get('text')).trim();save();closeSheet();render();},
 fb:(f,fd)=>{const h=byId(S.homework,f.dataset.id);const s=h.subs[+f.dataset.i];s.fb=String(fd.get('fb')).trim();
   if(h.kind==='speaking'){s.scores={Fluency:+fd.get('fluency'),Grammar:+fd.get('grammar'),Vocabulary:+fd.get('vocab'),Pronunciation:+fd.get('pron')};}else s.grade=String(fd.get('grade')||'').trim();
   notify(s.sid,`ملاحظات جديدة من المدرب على: ${h.title}`,`New trainer feedback on: ${h.title}`);save();closeSheet();toast(t('saved'));render();},
 addHw:(f,fd)=>{S.homework.push({id:uid('h'),cid:fd.get('cid'),title:String(fd.get('title')).trim(),kind:fd.get('kind'),due:new Date(fd.get('due')+'T23:59').toISOString(),subs:[]});
   const c=course(fd.get('cid'));S.enrollments.filter(e=>e.cid===c.id&&e.status==='active').forEach(e=>notify(e.sid,`واجب جديد في ${c.title}`,`New homework in ${c.title}`));save();closeSheet();render();},
 addSlot:(f,fd)=>{const iso=new Date(fd.get('date')+'T'+fd.get('time')).toISOString();const x=trainer(S.ui.trainerId);if(!x.slots.includes(iso))x.slots.push(iso);save();render();},
 reject:(f,fd)=>{const e=byId(S.enrollments,f.dataset.id);const r=String(fd.get('reason')).trim();e.status='rejected';e.payment.status='rejected';e.payment.reason=r;
   notify(e.sid,`تم رفض إيصال ${course(e.cid).title}: ${r}`,`Receipt for ${course(e.cid).title} rejected: ${r}`);save();closeSheet();toast(t('rejectedMsg'));render();},
 trainer:(f,fd)=>{const id=f.dataset.id;const x=id==='new'?{id:uid('t'),slots:[],active:true,col:['#0B4677','#F7941D','#8A4FA3','#2C8A7A','#B63A33'][S.trainers.length%5]}:trainer(id);
   Object.assign(x,{name:String(fd.get('name')).trim(),gender:fd.get('gender'),bio:{ar:fd.get('bioar'),en:fd.get('bioen')},quals:fd.get('quals'),exp:+fd.get('exp')||0,specs:fd.get('specs'),meet:fd.get('meet'),levels:fd.getAll('levels')});
   if(id==='new')S.trainers.push(x);save();closeSheet();toast(t('saved'));render();},
 course:(f,fd)=>{const id=f.dataset.id;const lines=k=>String(fd.get(k)||'').split('\n').map(s=>s.trim()).filter(Boolean);
   const x=id==='new'?{id:uid('c'),active:true}:course(id);const modes=fd.getAll('modes');
   Object.assign(x,{title:String(fd.get('title')).trim(),cat:fd.get('cat'),level:fd.get('level'),modes:modes.length?modes:['group'],sessions:+fd.get('sessions'),weeks:+fd.get('weeks'),price:+fd.get('price'),price1:+fd.get('price1'),seats:+fd.get('seats'),start:fd.get('start'),
     sched:{ar:fd.get('schedar'),en:fd.get('scheden')},groupTrainer:fd.get('groupTrainer')||null,trainers:fd.getAll('trainers'),desc:{ar:fd.get('descar'),en:fd.get('descen')},outcomes:{ar:lines('outar'),en:lines('outen')},lessons:lines('lessons'),materials:lines('materials')});
   if(x.groupTrainer&&!x.trainers.includes(x.groupTrainer))x.trainers.unshift(x.groupTrainer);if(!x.lessons.length)x.lessons=['Lesson 1'];
   if(id==='new'){S.courses.push(x);S.students.forEach(s=>notify(s.id,`دورة جديدة: ${x.title}`,`New course: ${x.title}`));}save();closeSheet();toast(t('saved'));render();},
 addCat:(f,fd)=>{S.cats.push({id:uid('cat'),ar:String(fd.get('ar')).trim(),en:String(fd.get('en')).trim()});save();render();},
 addLevel:(f,fd)=>{const l=String(fd.get('level')).trim();if(l&&!S.levels.includes(l)){S.levels.push(l);S.mapping[l]=100;}save();render();},
 addQ:(f,fd)=>{const o=String(fd.get('o')).split('\n').map(s=>s.trim()).filter(Boolean);if(o.length<2)return;const a=Math.min(o.length,Math.max(1,+fd.get('a')))-1;const sk=fd.get('skill');const ex=String(fd.get('extra')||'').trim();
   const q={id:uid('q'),skill:sk,q:String(fd.get('q')).trim(),o,a};if(ex){if(sk==='listening')q.audio=ex;else q.passage=ex;}S.qs.push(q);save();toast(t('saved'));render();},
 mapping:(f,fd)=>{S.levels.forEach(l=>{const v=fd.get(l);if(v!==''&&v!=null)S.mapping[l]=+v;});save();toast(t('saved'));render();},
 broadcast:(f,fd)=>{S.students.forEach(s=>notify(s.id,String(fd.get('ar')),String(fd.get('en'))));save();toast(t('sent'));render();},
 settings:(f,fd)=>{['bank','holder','acc','iban','currency','wa'].forEach(k=>S.settings[k]=String(fd.get(k)||'').trim());save();toast(t('saved'));render();},
};

/* ============ events ============ */
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='sheetBg'&&ev.target!==el)return;const a=A[el.dataset.a];if(!a)return;if(el.tagName!=='A')ev.preventDefault();a(el,ev);});
document.addEventListener('submit',ev=>{const f=ev.target;ev.preventDefault();const h=F[f.dataset.f];if(h)h(f,new FormData(f));});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.in==='q'){U.f.q=el.value;const l=$('#clist');if(l)l.innerHTML=courseList();}});
document.addEventListener('change',ev=>{const el=ev.target;const c=el.dataset.ch;if(!c)return;
  if(c==='fLevel'){U.f.level=el.value;$('#clist').innerHTML=courseList();}
  else if(c==='fType'){U.f.type=el.value;$('#clist').innerHTML=courseList();}
  else if(c==='trSel'){S.ui.trainerId=el.value;save();render();}
  else if(c==='hwFile'){const file=el.files[0];U.hwFile=file?file.name:null;const n=$('#hw-fname');if(n)n.textContent=U.hwFile||'';}
  else if(c==='receiptFile'){const file=el.files[0];if(!file)return;
    if(file.type.startsWith('image/')){const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);U.pendingReceipt={name:file.name,data:cv.toDataURL('image/jpeg',.72)};render();};img.onerror=()=>{U.pendingReceipt={name:file.name,data:null};render();};img.src=rd.result;};rd.readAsDataURL(file);}
    else{U.pendingReceipt={name:file.name,data:null};render();}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});

if(!me())U.screen='auth';
render();
})();
</script>
