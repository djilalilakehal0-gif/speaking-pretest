:root{
  --sheet:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261116_132032_30242d8c-5062-4d60-8a3d-238f0a2ff788.png&w=2200&q=85");
  --ink:#1c1a1f;--cream:#f0e8e0;--dark:#191a1e;--flav:#d6cd6e;--rv:transparent;
  --ease:cubic-bezier(.22,.8,.24,1);
  --u:min(calc(100vw / 1440),calc(100vh / 900));
  --w:calc(100vw / 1440);
  --n:min(calc(100vw / 1440),1px);
  --k:1;
  --safe:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:2;pointer-events:none;display:block}
.disp{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.92}
.spr{background-image:var(--sheet);background-repeat:no-repeat}
.ph{background-size:cover;background-position:center;background-repeat:no-repeat}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#ab9ac4;transition:background .25s}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#intro.logo{background:var(--cream)}
#intro.logo video{display:none}
#intro.gone{display:none}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:calc(26*var(--u));color:var(--ink)}
#intro.logo .stamp{display:flex}
.stamp svg{width:calc(120*var(--u));height:calc(120*var(--u))}
.stamp b{font:800 calc(72*var(--u))/1 Inter,sans-serif;letter-spacing:.06em}
#skip{position:absolute;top:calc(28*var(--u));right:calc(36*var(--u));height:38px;padding:0 18px;border-radius:99px;border:0;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:500 12px/38px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
#intro.logo #skip{display:none}

/* ---------- nav ---------- */
#nav{position:fixed;z-index:50;top:0;left:0;right:0;height:calc(94*var(--n));padding:0 calc(37*var(--n)) 0 calc(42*var(--n));display:flex;align-items:center;justify-content:space-between;color:var(--ink);transform:translateY(-110%);transition:color .4s}
#nav.in{transform:none;transition:transform 900ms cubic-bezier(.22,.9,.24,1),color .4s}
.brand{display:flex;align-items:center;gap:calc(11*var(--n));color:inherit;text-decoration:none;font-weight:800;font-size:calc(15.5*var(--n));letter-spacing:.06em}
.brand svg{width:calc(36*var(--n));height:calc(36*var(--n));flex:none;transition:filter .4s}
#nav.dark .brand svg{filter:invert(1)}
.pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;padding:calc(5*var(--n));border:1.5px solid #fff;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:99px;transition:border-color .4s,background .4s}
.pill a{position:relative;z-index:1;display:flex;align-items:center;height:calc(34*var(--n));padding:0 calc(20*var(--n));font-size:calc(14.5*var(--n));font-weight:500;color:inherit;text-decoration:none;border-radius:99px;transition:color .3s}
.pill a.on{font-weight:600;color:var(--ink)}
.pill .hl{position:absolute;top:calc(5*var(--n));bottom:calc(5*var(--n));left:0;width:0;background:#fff;border-radius:99px;transition:left .5s var(--ease),width .5s var(--ease)}
.pill.light{border-color:rgba(28,26,31,.14);background:rgba(255,255,255,.35)}
.right{display:flex;align-items:center;gap:calc(10*var(--n))}
.chip{height:calc(37*var(--n));padding:0 calc(14*var(--n));border:1.5px solid currentColor;border-radius:99px;background:none;font:600 calc(13*var(--n)) Inter,sans-serif;display:flex;align-items:center;white-space:nowrap}
.basket{position:relative;width:calc(44*var(--n));padding:0;justify-content:center}
.basket svg{width:calc(18*var(--n));height:calc(18*var(--n))}
.badge{position:absolute;top:-7px;right:-8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--cream);font:400 10.5px/18px "DM Mono",monospace;text-align:center;transform:scale(0)}
#nav.dark .badge{box-shadow:0 0 0 1.5px var(--cream)}
.dibs{height:calc(37*var(--n));padding:0 calc(18*var(--n));border-radius:99px;background:var(--ink);color:var(--cream);font:600 calc(14.5*var(--n)) Inter,sans-serif;display:flex;align-items:center;text-decoration:none;white-space:nowrap;transition:background .4s,color .4s}
#nav.dark{color:var(--cream)}
#nav.dark .dibs{background:#8fa8a3;color:var(--ink)}

/* ---------- hero ---------- */
#flavors{position:relative;height:100svh;min-height:300px;overflow:hidden;background:var(--flav)}
.reveal{position:absolute;inset:0;background:var(--rv);clip-path:circle(0 at 50% 50%)}
.rings{position:absolute;left:50%;top:41%;width:calc(2200*var(--u));height:calc(2200*var(--u));transform:translate(-50%,-50%);
  background:repeating-radial-gradient(circle,rgba(255,255,255,.13) 0,rgba(255,255,255,.02) calc(40*var(--u)),rgba(255,255,255,.13) calc(80*var(--u)));
  -webkit-mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);opacity:0}
.bits{position:absolute;inset:0;pointer-events:none}
.bit{position:absolute;filter:blur(1.5px);opacity:0;transform:translate(-50%,-50%) rotate(var(--r))}
.arc{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
#play{position:absolute;z-index:60;left:50%;top:calc(50% + 200*var(--u));width:calc(52*var(--u));height:calc(52*var(--u));margin:calc(-26*var(--u)) 0 0 calc(-26*var(--u));border-radius:50%;border:0;background:#fff;box-shadow:0 6px 20px rgba(40,28,60,.12);display:grid;place-items:center;opacity:0;transition:transform .25s var(--ease)}
#play svg{width:calc(18*var(--u));height:calc(18*var(--u));transition:transform .25s var(--ease)}
#play:hover{transform:scale(1.08)}
#play:hover svg{transform:translateX(2px)}
#play:active{transform:scale(.94)}
#title{position:absolute;z-index:60;left:0;right:0;top:calc(50% + 265*var(--u));text-align:center;font-size:calc(96*var(--u));color:var(--ink);pointer-events:none;white-space:normal}
#title .ly{display:block}
#title .ly.old{position:absolute;left:0;right:0;top:0}
#title .w{display:inline-block;white-space:nowrap}
#title .l{display:inline-block}
#count{position:absolute;z-index:1;top:calc(50% + 215*var(--u));right:calc(50% - 692*var(--u));font-size:calc(200*var(--u));color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);pointer-events:none;opacity:0}
#count span{display:inline-block}
#auto{position:absolute;z-index:60;right:calc(50% - 680*var(--u));top:calc(50% + 170*var(--u));display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;font:500 11px/1 "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:0}
#auto .rg{width:26px;height:26px;border:1.3px solid #fff;border-radius:50%;display:grid;place-items:center}
#auto svg{width:10px;height:10px}
#auto .pl{display:none}
#auto[aria-pressed="false"] .pa{display:none}
#auto[aria-pressed="false"] .pl{display:block}

/* ---------- section 2 ---------- */
#inside{position:relative;height:500vh;background:var(--flav)}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
.in-dark{position:absolute;inset:0;background:#120d16;opacity:0}
.frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform:translate(-50%,-50%) scale(var(--k))}
.in-num{position:absolute;left:510px;top:240px;width:640px;text-align:center;font-size:428px;color:transparent;-webkit-text-stroke:1.6px #fff}
#inBar{position:absolute;left:665px;top:110px;width:330px;height:694px}
#inFront{position:fixed;left:0;top:0;width:100vw;height:100svh;z-index:3;pointer-events:none;visibility:hidden}
.in-head{position:absolute;left:40px;top:300px;font-size:88px;line-height:.93;color:var(--cream)}
.in-head.sm{font-size:63.36px}
.in-icons{position:absolute;left:1292px;top:310px;display:grid;grid-template-columns:66px 66px;gap:4px;pointer-events:auto}
.in-icons button{width:66px;height:66px;border-radius:50%;border:1.5px solid #fff;background:none;color:#fff;display:grid;place-items:center;transition:background .35s,color .35s,border-color .35s}

    });
  }
  lastInteract = performance.now();
  setTimeout(placeHL, 50);
}
function showLogo() {
  if (logoShown || entered) return; logoShown = true;
  try { iv.pause(); } catch (_) {}
  intro.classList.add('logo');
  $('.stamp').animate([{transform: 'translate(-50%,-50%) scale(.72)', opacity: 0}, {transform: 'translate(-50%,-50%) scale(1.04)', opacity: 1, offset: .7}, {transform: 'translate(-50%,-50%) scale(1)', opacity: 1}], {duration: 380, easing: 'ease-out', fill: 'forwards'});
  setTimeout(enterHero, 380 + 650);
}
function startIntro() {
  const play = () => {
    if (started || logoShown || entered) return;
    try { iv.currentTime = .55; } catch (_) {}
    const pr = iv.play();
    if (pr && pr.then) pr.then(() => { started = true; }).catch(() => showLogo()); else started = true;
  };
  if (iv.readyState >= 3) play(); else iv.addEventListener('canplay', play, {once: true});
  const watch = () => { if (entered || logoShown) return; if (iv.currentTime >= 4.6) { showLogo(); return; } requestAnimationFrame(watch); };
  requestAnimationFrame(watch);
  iv.addEventListener('ended', showLogo); iv.addEventListener('error', showLogo);
  setTimeout(() => { if (!started) showLogo(); }, 3500);
  setTimeout(enterHero, 9000);
}
$('#skip').addEventListener('click', enterHero);

/* ================= boot ================= */
autoBtn.setAttribute('aria-pressed', autoOn);
setTitle(FL[1].n, 1, false);
cardEls[1].classList.add('live');
applyStepText(0);
layout();
if (RM) { iv.removeAttribute('src'); iv.load(); enterHero(); } else startIntro();
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastInteract = performance.now(); });
initGL();
requestAnimationFrame(frame);
</script>
