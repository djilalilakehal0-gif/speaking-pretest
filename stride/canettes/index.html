<script>if (window.top === window) location.replace("../#canettes");</script>

<title>L'EXCELLENCE — Ice Cold Cans</title>
<meta name="description" content="L'EXCELLENCE — an interactive 3D soda can showcase. Spin the cans, read the back, chill the lineup.">
<meta name="theme-color" content="#1D1B1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="preload" href="logo.png" as="image" crossorigin="anonymous">
<style>
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-display:block;src:url(https://fonts.gstatic.com/s/barlowcondensed/v13/HTxyL3I-JCGChYJ8VI-L6OO_au7B6xTrf3fmu4kG.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-display:block;src:url(https://fonts.gstatic.com/s/barlowcondensed/v13/HTxyL3I-JCGChYJ8VI-L6OO_au7B6xTrW3bmu4kG.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:400 800;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v23/xn7gYHE41ni1AdIRggexSg.woff2) format("woff2")}
:root{
  --cocoa:#4A1E17;--coral:#C8955E;--gold:#C8955E;--gold2:#E2B783;--ink:#F3E6D8;--char:#1D1B1C;--cream:#FFF3EC;--peach:#FCD9C8;--peach2:#F5B39A;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --disp:"Barlow Condensed",Impact,sans-serif;--body:"Manrope",system-ui,sans-serif;
  --sc:#E25B45;--sg:rgba(226,91,69,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overscroll-behavior:none}
html,body{background:#1D1B1C;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--cream);outline-offset:4px}

#gl{position:fixed;inset:0;width:100vw;height:100lvh;display:block;touch-action:pan-y;opacity:0;transition:opacity 1s var(--ease);z-index:0}
body.ready #gl{opacity:1}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;z-index:5;
  opacity:0;transform:translateY(-12px);transition:opacity .9s var(--ease),transform .9s var(--ease);pointer-events:none}
body.intro-ui .nav{opacity:1;transform:none}
.nav>*{pointer-events:auto}
.logo{font:600 27px/1 var(--serif);letter-spacing:.07em;color:var(--gold);text-decoration:none;display:flex;align-items:flex-start;white-space:nowrap}
.logo sup{font:600 9px/1 var(--body);margin:4px 0 0 2px;letter-spacing:0}

/* HERO */
#hero,#story{position:fixed;inset:0;pointer-events:none;z-index:3;height:100lvh}
.title{position:absolute;left:3.4vw;bottom:max(40px,6vh);font:italic 900 clamp(40px,4.6vw,72px)/1 var(--disp);letter-spacing:-.01em;color:var(--gold2);text-transform:uppercase;height:1em;overflow:hidden;width:calc(100vw - 3.4vw - 200px);white-space:nowrap}
.title span{position:absolute;left:0;top:0;transition:transform .62s var(--ease);will-change:transform}
.arrows{position:absolute;right:3.2vw;bottom:max(40px,6vh);display:flex;gap:16px;pointer-events:auto}
.arr{width:52px;height:52px;border-radius:50%;border:2px solid rgba(200,149,94,.9);background:rgba(200,149,94,.08);box-shadow:0 4px 18px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--gold2);transition:background .3s var(--ease),transform .3s var(--ease)}
.arr:hover{background:rgba(200,149,94,.22);transform:scale(1.06)}
.arr:active{transform:scale(.96)}
.arr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip{position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--sc) 18%,#fff 50%,var(--sc) 82%,transparent);
  box-shadow:0 0 22px 6px var(--sg),0 0 70px 18px var(--sg)}

/* STORY */
.icons{position:absolute;left:4.4vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;pointer-events:auto}
.ic{width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold2);transition:background .45s var(--ease),color .45s var(--ease),transform .45s var(--ease)}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.on{background:var(--gold);color:var(--char);transform:scale(1.08)}
.scopy{position:absolute;left:51.5vw;top:50%;transform:translateY(-46%);width:min(36vw,520px)}
.stag{display:flex;align-items:center;gap:12px;color:var(--gold2);font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px;transition:filter .5s var(--ease),opacity .5s var(--ease)}
.stag i{width:22px;height:22px;border-radius:6px;background:var(--coral);flex:none}
.stitle{position:relative;font:italic 900 clamp(64px,7.6vw,118px)/.9 var(--disp);letter-spacing:-.02em;color:var(--ink);min-height:1.8em;text-transform:uppercase;margin-bottom:24px}
.bars{position:absolute;left:0;top:.08em;width:100%;opacity:0;transition:opacity .2s}
.bars b{display:block;height:.62em;border-radius:.12em;background:rgba(243,230,216,.16);filter:blur(6px);margin-bottom:.16em}
.bars b:first-child{width:80%}.bars b:last-child{width:56%}
.stitle.loading .bars{opacity:1}
.stitle.loading .stext{opacity:0}
.sbody{font:400 clamp(15px,1.25vw,19px)/1.6 var(--body);color:rgba(243,230,216,.8);max-width:34em;transition:filter .5s var(--ease),opacity .5s var(--ease)}
.blur{filter:blur(8px);opacity:0}

#track{height:805vh;width:1px;position:relative;z-index:-1}

@media (max-width:820px),(orientation:portrait){
  .nav{height:68px}
  .logo{font-size:21px}
  .title{left:20px;bottom:26px;font-size:clamp(30px,8.6vw,54px);width:calc(100vw - 172px)}
  .arrows{right:20px;bottom:20px}
  .arr{width:48px;height:48px}
  .scopy{left:20px;right:20px;width:auto;top:max(86px,11vh);transform:none}
  .stitle{font-size:clamp(50px,13vw,84px);margin-bottom:14px}
  .stag{margin-bottom:14px}
  .sbody{font-size:15px}
  .icons{left:auto;right:20px;top:auto;bottom:20px;transform:none;flex-direction:row;gap:12px}
  .ic{width:44px;height:44px}
  .ic svg{width:20px;height:20px}
}
@media (max-width:360px){.logo{font-size:17px}}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .icons{left:3vw;top:50%;bottom:auto;right:auto;transform:translateY(-50%);flex-direction:column;gap:12px}
  .ic{width:44px;height:44px}
  .scopy{left:51.5vw;right:auto;width:min(42vw,520px);top:50%;transform:translateY(-46%)}
  .stitle,.stitle{font-size:clamp(40px,6vw,64px)}
  .title{font-size:clamp(30px,4.4vw,48px)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
html.card,html.card body{overflow:hidden;background:#000}
html.card .nav,html.card #title,html.card #story,html.card .arr{display:none!important}
html.card #track{height:100vh}
</style>

  o.rz = TILT[i % 16] * sstep(0, 1, ad); o.ry = -d * (CARD ? .08 : .2);
  if (!RM) { o.y += Math.sin(1.1 * T + 1.7 * i) * .035; o.rz += Math.sin(.8 * T + 2.3 * i) * .025; o.ry += Math.sin(.5 * T + i) * .06; }
  // intro
  const p = clamp((introI - .06 * ad) / .62);
  if (ad < .5) o.y -= (1 - eoc(p)) * .75 * VH;
  else { const e = eob(p); o.x = lerp(sg * .85 * W, o.x, e); o.rz = lerp(sg * .5, o.rz, e); if (p <= 0) o.x = sg * 2 * W; }

}
function storyPose(s, o) {
  const k = K, sc0 = lerp(.9, 1.08, k) * VH / BH, x0 = lerp(0, -.17, k) * W, top = lerp(.15, .44, k) * VH, y0 = top - sc0 * BH / 2, rz0 = lerp(.12, .3, k);
  const sc1 = Math.min(sc0 * lerp(1.25, 1.22, k), lerp(.7, .31, k) * W / CW), x1 = lerp(0, -.165, k) * W;
  const turn = eio(clamp(s / .12));
  const fl = Math.floor(3 * s), f = Math.min(2, fl + sstep(.6, 1, 3 * s - fl));
  const sc = lerp(sc0, sc1, turn);
  const y1 = lerp(-.22, 0, k) * VH - (rowYf(f) - BH / 2) * sc;
  o.x = lerp(x0, x1, turn); o.y = lerp(y0, y1, turn); o.z = 0; o.s = sc; o.rz = lerp(rz0, .025, turn);

  return o;
}
function maniPose(m, o) {

  o.x = 0; o.y = lerp(-.16, -.1, K) * VH; o.z = 0; o.s = h / BH; o.rz = 0; o.ry = 2 * Math.PI + (RM ? 0 : eio(m) * 2 * Math.PI); o.L = 1; return o;
}
function linePose(slot, l, o) {
  const u = slot - eio(l) * 2, sc = lerp(.38, .54, K) * VH / BH;
  o.z = 1.4 - 1.55 * u;
  o.x = lerp(-.3 * W * .86, .48 * W * 3.19, u / 15) + Math.min(0, u) * .35 * W;
  o.s = sc; o.y = -.43 * VH * .86 + sc * BH / 2;

function apply(c, p, vis) {
  c.g.visible = vis;
  if (!vis) return;
  c.g.position.set(p.x, p.y, p.z); c.g.scale.setScalar(p.s); c.g.rotation.set(0, p.ry, p.rz, 'ZYX');
  const L = clamp(p.L);
  c.body.color.setScalar(.45 + .55 * L); c.metal.color.setRGB(.70, .72, .76).multiplyScalar(.5 + .5 * L);

/* ───────────── frame ───────────── */
let ready = false, introStart = 0, introI = RM ? 1 : 0, uiShown = false, last = 0;
let ema = 16.7, holdUp = 0, lastUp = 0, lastDrop = 0;
const accCur = new THREE.Color(CANS[0][1]), accTgt = new THREE.Color(), white = new THREE.Color(1, 1, 1), tmpC = new THREE.Color();
const rowState = { p: [0, 0, 0], d: [0, 0, 0], hk: -1, st: 2, sRow: -1, glowY: ROW_Y[0], glowA: 0 };
let prevCiRaw = 0;

function perf(rawMs, now) {
  if (rawMs > 100) return;
  ema = ema * .92 + rawMs * .08;
  if (ema > 19.5 && PR > .7 && now - lastDrop > 1000) { PR = Math.max(.7, PR - .15); renderer.setPixelRatio(PR); resize(); lastDrop = now; holdUp = now + 8000; ema = 16.7; }
  else if (ema < 17.3 && PR < BASE_PR && now > holdUp && now - lastUp > 1200) { PR = Math.min(BASE_PR, PR + .05); renderer.setPixelRatio(PR); resize(); lastUp = now; }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const raw = last ? ts - last : 16.7; last = ts;
  const dt = Math.min(raw / 1000, .05); T += dt; perf(raw, ts);

  /* scroll spring */
  const tgt = scrollY, w = RM ? 40 : 5.6, n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (let i = 0; i < n; i++) { const a = w * w * (tgt - sx) - 2 * w * sv; sv += a * h; sx += sv * h; }
  if (Math.abs(tgt - sx) < .05 && Math.abs(sv) < .5) { sx = tgt; sv = 0; }
  Y = sx / innerHeight;

  /* carousel spring */
  if (!drag) { const k2 = 46, c2 = 2 * Math.sqrt(46); for (let i = 0; i < n; i++) { const a = k2 * (cT - car) - c2 * cv; cv += a * h; car += cv * h; } }

  /* intro */
  if (ready && !RM) introI = clamp((ts - introStart) / 1900);
  if (introI >= .7 && !uiShown) { uiShown = true; body.classList.add('intro-ui'); }

  /* timeline */
  const a = eio(clamp(Y / .75)), s = clamp((Y - .75) / 2.55), b = eio(clamp((Y - 3.3) / .65)),
        m = clamp((Y - 3.95) / 1.05), c = eio(clamp((Y - 5) / .7)), l = clamp((Y - 5.7) / 1.35);

  const ciRaw = Math.round(car), ci = mod(ciRaw, N);
  if (ci !== titleIdx) { rollTitle(ci, ciRaw - prevCiRaw); titleIdx = ci; prevCiRaw = ciRaw; }

  /* hover */
  const hA = heroActive();
  if (ptrDirty || !drag) { hovered = hA && !drag ? pick() : -1; ptrDirty = false; }
  canvas.style.cursor = !hA ? '' : drag ? 'grabbing' : hovered >= 0 && hovered !== ci ? 'pointer' : 'grab';

  /* cans */
  let heroInfo = null;
  for (let i = 0; i < N; i++) {
    const cn = cans[i];
    cn.hov += ((hovered === i && i !== ci ? 1 : 0) - cn.hov) * (1 - Math.exp(-10 * dt));
    if (i === ci) {
      let p;
      if (Y < .75) { heroInfo = heroPose(i, P1); p = lp(P1, storyPose(0, P2), a, P3); }
      else if (Y < 3.3) p = storyPose(s, P3);
      else if (Y < 3.95) p = lp(storyPose(1, P1), maniPose(0, P2), b, P3);
      else if (Y < 5) p = maniPose(m, P3);
      else { maniPose(1, P1); linePose(0, l, P2); P2.ry += P1.ry; p = lp(P1, P2, c, P3); }
      apply(cn, p, true);
    } else if (Y < .75) {
      const p = heroPose(i, P1);
      p.y += .09 * cn.hov; p.L = Math.min(1, p.L + .4 * cn.hov);
      const sg = Math.sign(p.d) || 1; p.x += sg * .9 * W * a; p.s *= 1 - .25 * a; p.L = lerp(p.L, 1, a * .5);
      apply(cn, p, a < .999 && Math.abs(p.x) < W * .85 + 1);
    } else if (Y >= 5) {
      const slot = mod(i - ci, N), st = (slot % 5) / 5 * .15, cl = clamp((c - st) / .85);
      const p = linePose(slot, l, P1);
      if (cl < 1) {
        const sd = slot % 2 ? 1 : -1; P2.x = p.x + sd * 1.25 * W * (10 - p.z) / 10; P2.y = p.y + .05 * VH; P2.z = p.z; P2.s = p.s; P2.ry = p.ry + sd * 1.2; P2.rz = 0; P2.L = 1;
        lp(P2, p, eoc(cl), P3); apply(cn, P3, cl > 0 && p.u < 19);
      } else apply(cn, p, p.u < 19);
    } else apply(cn, P1, false);
  }

  /* row highlight */
  const inStory = Y >= .75 && Y < 3.3;
  const hk = inStory && s >= .11 ? Math.min(2, Math.floor(3 * s)) : -1;
  const R_ = rowState;
  if (hk !== R_.hk) { if (hk >= 0) { R_.sRow = hk; R_.st = 0; } R_.hk = hk; }
  for (let k = 0; k < 3; k++) {
    R_.p[k] = clamp(R_.p[k] + (k === hk ? dt / .6 : -dt * 1.4 / .6));
    R_.d[k] += ((hk >= 0 && k !== hk ? 1 : 0) - R_.d[k]) * (1 - Math.exp(-7 * dt));
  }
  HL.rowP.value.set(eio(R_.p[0]), eio(R_.p[1]), eio(R_.p[2])); HL.rowD.value.set(...R_.d);
  R_.st += dt / .95;
  HL.streak.value.set(R_.sRow, lerp(-.15, 1.15, eoc(Math.min(R_.st, 1))), R_.st < 1 ? Math.sin(Math.PI * R_.st) * .6 : 0);
  if (rowGlow.parent !== cans[ci].inner) cans[ci].inner.add(rowGlow);
  useSharpBack(Y > .2 && Y < 5.2 ? ci : -1);
  if (hk >= 0) R_.glowY += (ROW_Y[hk] - R_.glowY) * (1 - Math.exp(-8 * dt));
  R_.glowA += ((hk >= 0 ? 1 : 0) - R_.glowA) * (1 - Math.exp(-6 * dt));
  rowGlow.position.y = R_.glowY; rowGlow.material.opacity = (.2 + .05 * Math.sin(2.2 * T)) * R_.glowA; rowGlow.visible = R_.glowA > .005;

  /* story copy */
  const storyO = sstep(.5, .8, Y) * (1 - sstep(3.3, 3.55, Y));
  storyEl.style.opacity = storyO; storyEl.style.visibility = storyO < .01 ? 'hidden' : 'visible';
  if (Y >= .75 && Y < 3.3) { const si = Math.min(2, Math.floor(3 * s)); if (si !== stepIdx) setStep(si); }

  /* hero overlay, disc, accent */
  const heroO = (1 - sstep(.02, .35, Y)) * clamp((introI - .75) / .2);
  heroEl.style.opacity = heroO; heroEl.style.visibility = heroO < .01 ? 'hidden' : 'visible';
  accTgt.set(CANS[ci][1]);

    disc.position.set(0, hp.bottom - .025 * hc * 1.2 - (1 - rise) * .45 * VH - a * .5 * VH, -.05);
    discCyl.material.opacity = .14 * (1 - a); ringMat.opacity = 1 - a; glowMat.opacity = .55 * (1 - a);
  } else disc.visible = false;

  /* background */
  mixPal(PAL.hero, PAL.story, a, pA); mixPal(pA, PAL.mani, b, pB); mixPal(pB, PAL.line, c, pC);
  const U = bgMat.uniforms;
  U.uTop.value.copy(pC[0]); U.uBot.value.copy(pC[1]); U.uGlow.value.copy(pC[2]); U.uGlowPos.value.copy(pC[3]);
  U.uGlowAmt.value = pC[4]; U.uGlowRad.value = pC[5]; U.uClouds.value = pC[6]; U.uFloor.value = pC[7];
  U.uTime.value = T; U.uTxtAmt.value = b * (1 - c); U.uTxtMix.value = eoc(m) * .62; U.uTxtShift.value = RM ? 0 : (m - .5) * .03;
  U.uTxtY.value = lerp(.47, .5, K); U.uTxtW.value = lerp(1.02, .92, K);
  {
    let lw = lerp(.8, .28, K), lh = lw * aspect / LOGO_AR, ly = lerp(.24, .215, K);
    if (CARD) { lw = .92; lh = lw * aspect / LOGO_AR; if (lh > .46) { lw *= .46 / lh; lh = .46; } ly = .275; }
    else if (lh > .3) { lw *= .3 / lh; lh = .3; }
    U.uLogoBox.value.set(.5, 1 - ly, lw, lh);
    U.uLogoAmt.value = U.uLogo.value ? lerp(1, .08, a) * lerp(1, .8, c) : 0;
  }

  renderer.render(scene, camera);
}

/* ───────────── boot ───────────── */
(async () => {
  const fontLoads = ['italic 900 40px "Barlow Condensed"', 'italic 800 40px "Barlow Condensed"', '500 20px Manrope', '600 20px Manrope', '700 20px Manrope'].map(f => document.fonts.load(f).catch(() => {}));
  const atlasP = new Promise(res => {
    new THREE.TextureLoader().load('cans.jpg', t => res(t), undefined, () => {
      const c = document.createElement('canvas'); c.width = 7 * 64; c.height = 4 * 128; const x = c.getContext('2d');
      CANS.forEach(([n, col], i) => { x.fillStyle = col; x.fillRect((i % 7) * 64, Math.floor(i / 7) * 128, 64, 128); });
      res(new THREE.CanvasTexture(c));
    });
  });
  const [atlas] = await Promise.all([atlasP, Promise.race([Promise.all(fontLoads), new Promise(r => setTimeout(r, 4000))])]);
  atlas.colorSpace = THREE.SRGBColorSpace; atlas.anisotropy = renderer.capabilities.getMaxAnisotropy(); atlas.needsUpdate = true;
  const logo = await new Promise(res => new THREE.TextureLoader().load('logo.png', res, undefined, () => res(null)));
  if (logo) { logo.colorSpace = THREE.NoColorSpace; logo.minFilter = THREE.LinearMipmapLinearFilter; logo.anisotropy = 4; bgMat.uniforms.uLogo.value = logo; }
  else bgMat.uniforms.uLogoAmt.value = 0;
  bgMat.uniforms.uSharp.value = typeTex(5); bgMat.uniforms.uSoft.value = typeTex(26, .5);
  buildCans(atlas);
  cans[0].inner.add(rowGlow); rowGlow.visible = true; disc.visible = true;
  try { await renderer.compileAsync(scene, camera); } catch { renderer.compile(scene, camera); }
  titleIdx = -1;
  requestAnimationFrame(frame);
  requestAnimationFrame(() => { ready = true; introStart = performance.now(); body.classList.add('ready'); if (RM) body.classList.add('intro-ui'); });
})();
</script>
