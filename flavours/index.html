<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un produit, trois saveurs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><span>Trois saveurs</span><button class="bag" type="button">Ajouter au sac</button></header>

<section id="burger" class="flavour" data-flavour="burger">
  <div class="ingredients" data-items="burger-bun:.60:150,burger-patty:.55:130,burger-lettuce:.50:110,burger-tomato:.45:90,burger-cheese:.38:80,burger-pickle:.30:60,burger-onion:.24:48,burger-sesame:.20:34"></div>
  <div class="copy"><img class="hero" src="img/hero-burger.jpg" alt="Burger au sésame, cheddar et sauce" width="320" height="320"><p class="eyebrow">01 — Burger</p><h1>Le classique<br>qui fond.</h1><p>Pain doré, bœuf juteux, cheddar coulant. Fait minute.</p></div>
</section>

<section id="pizza" class="flavour" data-flavour="pizza">
  <div class="ingredients" data-items="pizza-pepperoni:.60:140,pizza-mozza:.52:130,pizza-basil:.46:100,pizza-mushroom:.40:90,pizza-pepper:.34:70,pizza-tomato:.28:56,pizza-olive:.20:40"></div>
  <div class="copy"><img class="hero" src="img/hero-pizza.jpg" alt="Pizza garnie coupée en parts" width="320" height="320"><p class="eyebrow">02 — Pizza</p><h1>Pâte fine,<br>four à bois.</h1><p>Tomate San Marzano, mozzarella, basilic cueilli le matin.</p></div>
</section>

<section id="kebab" class="flavour" data-flavour="kebab">
  <div class="ingredients" data-items="kebab-pita:.60:150,kebab-meat:.54:130,kebab-onion:.46:100,kebab-pepper:.40:90,kebab-tomato:.32:64,kebab-lemon:.26:52,kebab-parsley:.20:40"></div>
  <div class="copy"><img class="hero" src="img/hero-kebab.jpg" alt="Pita garni de viande, salade et sauce blanche" width="320" height="320"><p class="eyebrow">03 — Kebab</p><h1>Braisé,<br>épicé, roulé.</h1><p>Viande marinée 24 h, sauce maison, pain chaud.</p></div>
</section>

<script src="app.js"></script>
</body>
</html>
