name: Security checks

# Secret scan of every tracked file, dependency audit and backend security tests.
# Runs on every push and pull request, and weekly because new vulnerabilities are published over time.

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scan tracked files for secrets and forbidden files
        run: node ecole-eyes-native/backend/scripts/secret-scan.js

  backend:
    name: Backend audit and tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ecole-eyes-native/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Security, integrity, budget and validation tests
        run: npm test
