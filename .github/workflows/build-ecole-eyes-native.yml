name: Build ÉCOLE EYES (native Android)

# Tests + lint + APK for the native Kotlin app in ecole-eyes-native/.
# On pushes to main it also builds a signed release APK + AAB (needs the KEYSTORE_PASSWORD secret and the
# keystore, exactly like the other apps in this repository) and publishes the APK to GitHub Releases.
# Online AI: on pushes to main (or "Run workflow") the deploy-backend job deploys the Cloudflare Worker in
# ecole-eyes-native/backend, sets its secrets, checks it answers, and passes its address to the app build.
# Repository secrets: CLOUDFLARE_API_TOKEN, ANTHROPIC_API_KEY, ECOLE_EYES_APP_TOKEN (optional CLOUDFLARE_ACCOUNT_ID).
# Without them the app is still built and works on the phone only. A fixed address can also be given in the
# repository variable ECOLE_EYES_BACKEND_URL.

on:
  push:
    branches: [main]
    paths: ['ecole-eyes-native/**', '.github/workflows/build-ecole-eyes-native.yml']
  pull_request:
    paths: ['ecole-eyes-native/**', '.github/workflows/build-ecole-eyes-native.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ecole-eyes-native/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  deploy-backend:
    name: Deploy AI backend (Cloudflare Worker)
    needs: backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ecole-eyes-native/backend } }
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APP_TOKEN: ${{ secrets.ECOLE_EYES_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Check configuration
        id: cfg
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$APP_TOKEN" ] || missing="$missing ECOLE_EYES_APP_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::AI backend not deployed (the app will work on the phone only). Missing repository secrets:$missing. See ecole-eyes-native/README.md, 'Make the app work online'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      - name: Deploy the Worker
        id: deploy
        if: steps.cfg.outputs.ready == 'true'
        run: |
          out=$(npx wrangler deploy 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but Cloudflare printed no workers.dev address. Open Cloudflare > Workers & Pages once to create your workers.dev subdomain, then run this workflow again."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### AI backend: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Store the Worker secrets
        if: steps.cfg.outputs.ready == 'true'
        run: |
          f="$RUNNER_TEMP/worker-secrets.json"
          node -e 'process.stdout.write(JSON.stringify({ ANTHROPIC_API_KEY: process.env.ANTHROPIC_API_KEY, APP_TOKEN: process.env.APP_TOKEN }))' > "$f"
          npx wrangler secret bulk "$f"; status=$?
          rm -f "$f"
          exit $status

      - name: Check the backend answers (no AI call, no cost)
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          for i in 1 2 3 4 5 6; do   # new secrets can take a few seconds to reach every Cloudflare location
            health=$(curl -s "$URL/")
            nok=$(code -X POST "$URL/v1/messages" -H 'content-type: application/json' -d '{}')
            withtok=$(code -X POST "$URL/v1/messages" -H 'content-type: application/json' -H "x-app-token: $APP_TOKEN" -d '{}')
            echo "health='$health' without token=$nok with token=$withtok"
            # 401 without the app token; 400 with it (token accepted, invalid body refused before reaching the AI)
            if echo "$health" | grep -q 'proxy OK' && [ "$nok" = 401 ] && [ "$withtok" = 400 ]; then echo "Backend OK"; exit 0; fi
            sleep 10
          done
          echo "::error::The backend did not answer as expected (see the codes above). 500 usually means a secret is missing."
          exit 1

  android:
    needs: deploy-backend
    # Runs on pull requests too (deploy-backend is skipped there).
    if: ${{ !cancelled() && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ecole-eyes-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + Robolectric tests, lint, debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            ecole-eyes-native/app/build/reports
            ecole-eyes-native/app/build/test-results

      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Prefer the KEYSTORE_BASE64 secret. KEYSTORE_BASE64.txt in the repository is a temporary fallback:
          # the signing key must not live in git (see ecole-eyes-native/SECURITY.md).
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > release.keystore
          elif [ -f KEYSTORE_BASE64.txt ]; then
            echo "::warning::Using KEYSTORE_BASE64.txt from the repository. Add the KEYSTORE_BASE64 secret, then delete the file."
            tr -d ' \r\n' < KEYSTORE_BASE64.txt | base64 -d > release.keystore
          fi
          [ -s release.keystore ] || { echo "::error::Signing key missing (KEYSTORE_BASE64.txt or KEYSTORE_BASE64 secret)."; exit 1; }
          [ -n "$KS_PASS" ] || { echo "::error::KEYSTORE_PASSWORD secret missing."; exit 1; }
          keytool -list -keystore release.keystore -storepass "$KS_PASS" > /dev/null 2>&1 || { echo "::error::KEYSTORE_PASSWORD is wrong."; exit 1; }

      - name: Signed release APK + AAB
        if: github.event_name != 'pull_request'
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          BACKEND: ${{ needs.deploy-backend.outputs.url || vars.ECOLE_EYES_BACKEND_URL }}
          TOKEN: ${{ secrets.ECOLE_EYES_APP_TOKEN }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PECOLE_EYES_KEYSTORE=${{ github.workspace }}/release.keystore \
            -PECOLE_EYES_KEYSTORE_PASSWORD="$KS_PASS" -PECOLE_EYES_KEY_ALIAS=speakingpretest \
            -PversionCode=$((1000 + ${{ github.run_number }})) -PversionName="2.${{ github.run_number }}" \
            -PecoleEyesBackendUrl="$BACKEND" -PecoleEyesAppToken="$TOKEN"
          # One APK per CPU type (see splits in app/build.gradle.kts). arm64 fits nearly every phone since 2017.
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk EcoleEyes.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk EcoleEyes-older-phones.apk
          cp app/build/outputs/bundle/release/app-release.aab EcoleEyes.aab

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ecole-eyes-native-release
          path: |
            ecole-eyes-native/EcoleEyes.apk
            ecole-eyes-native/EcoleEyes-older-phones.apk
            ecole-eyes-native/EcoleEyes.aab

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ecole-eyes-native-2.${{ github.run_number }}
          name: ÉCOLE EYES native 2.${{ github.run_number }}
          make_latest: false
          files: |
            ecole-eyes-native/EcoleEyes.apk
            ecole-eyes-native/EcoleEyes-older-phones.apk
          body: |
            ÉCOLE EYES (native Android). Download EcoleEyes.apk (EcoleEyes-older-phones.apk for 32-bit phones), tap Install, allow the microphone and the camera.
            Replaces the earlier web-wrapper build (same package, same signing key).
