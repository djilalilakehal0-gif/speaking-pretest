name: Build ÉCOLE EYES (native Android)

# Tests + lint + APK for the native Kotlin app in ecole-eyes-native/.
# On pushes to main it also builds a signed release APK + AAB (needs the KEYSTORE_PASSWORD secret and the
# keystore, exactly like the other apps in this repository) and publishes the APK to GitHub Releases.
# AI backend address/token (optional, baked into the build):  repo variable ECOLE_EYES_BACKEND_URL, secret ECOLE_EYES_APP_TOKEN.

on:
  push:
    branches: [main]
    paths: ['ecole-eyes-native/**', '.github/workflows/build-ecole-eyes-native.yml']
  pull_request:
    paths: ['ecole-eyes-native/**', '.github/workflows/build-ecole-eyes-native.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ecole-eyes-native/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ecole-eyes-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + Robolectric tests, lint, debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            ecole-eyes-native/app/build/reports
            ecole-eyes-native/app/build/test-results

      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -f KEYSTORE_BASE64.txt ]; then tr -d ' \r\n' < KEYSTORE_BASE64.txt | base64 -d > release.keystore; fi
          if [ ! -s release.keystore ] && [ -n "$KS_B64" ]; then printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > release.keystore; fi
          [ -s release.keystore ] || { echo "::error::Signing key missing (KEYSTORE_BASE64.txt or KEYSTORE_BASE64 secret)."; exit 1; }
          [ -n "$KS_PASS" ] || { echo "::error::KEYSTORE_PASSWORD secret missing."; exit 1; }
          keytool -list -keystore release.keystore -storepass "$KS_PASS" > /dev/null 2>&1 || { echo "::error::KEYSTORE_PASSWORD is wrong."; exit 1; }

      - name: Signed release APK + AAB
        if: github.event_name != 'pull_request'
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          BACKEND: ${{ vars.ECOLE_EYES_BACKEND_URL }}
          TOKEN: ${{ secrets.ECOLE_EYES_APP_TOKEN }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PECOLE_EYES_KEYSTORE=${{ github.workspace }}/release.keystore \
            -PECOLE_EYES_KEYSTORE_PASSWORD="$KS_PASS" -PECOLE_EYES_KEY_ALIAS=speakingpretest \
            -PversionCode=$((1000 + ${{ github.run_number }})) -PversionName="2.${{ github.run_number }}" \
            -PecoleEyesBackendUrl="$BACKEND" -PecoleEyesAppToken="$TOKEN"
          cp app/build/outputs/apk/release/app-release.apk EcoleEyes.apk
          cp app/build/outputs/bundle/release/app-release.aab EcoleEyes.aab

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ecole-eyes-native-release
          path: |
            ecole-eyes-native/EcoleEyes.apk
            ecole-eyes-native/EcoleEyes.aab

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ecole-eyes-native-2.${{ github.run_number }}
          name: ÉCOLE EYES native 2.${{ github.run_number }}
          make_latest: false
          files: ecole-eyes-native/EcoleEyes.apk
          body: |
            ÉCOLE EYES (native Android). Download EcoleEyes.apk, tap Install, allow the microphone and the camera.
            Replaces the earlier web-wrapper build (same package, same signing key).
