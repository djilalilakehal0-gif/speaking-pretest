name: Build école eyes Android APK

# Builds the école eyes voice assistant for blind users (ecole-eyes/) as an Android app with
# Capacitor and publishes EcoleEyes.apk to GitHub Releases (tag ecole-eyes-1.N).
# The AI proxy address comes from the repository variable ECOLE_EYES_PROXY_URL
# (Settings > Secrets and variables > Actions > Variables).

on:
  push:
    branches: [main]
    paths: ['ecole-eyes/**', '.github/workflows/build-ecole-eyes-apk.yml']
  pull_request:       # test build on pull requests (unsigned, nothing is published)
    paths: ['ecole-eyes/**', '.github/workflows/build-ecole-eyes-apk.yml']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecole-eyes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        env:
          ECOLE_EYES_PROXY_URL: ${{ vars.ECOLE_EYES_PROXY_URL }}
          ECOLE_EYES_APP_TOKEN: ${{ secrets.ECOLE_EYES_APP_TOKEN }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add microphone, camera and speech permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <queries>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n    </queries>\n\n    <application#' $M
          cat $M

      - name: Set version (each build gets a higher number so updates install over the old app)
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" $G
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0b0b' --iconBackgroundColorDark '#0b0b0b' --splashBackgroundColor '#0b0b0b' --splashBackgroundColorDark '#0b0b0b'

      - name: Sync web code
        run: npx cap sync android

      - name: Test build (pull requests only)
        if: github.event_name == 'pull_request'
        working-directory: ecole-eyes/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Same signing key as the other apps (KEYSTORE_BASE64.txt or the KEYSTORE_BASE64 secret)
          if [ -f KEYSTORE_BASE64.txt ]; then
            tr -d ' \r\n' < KEYSTORE_BASE64.txt | base64 -d > release.keystore
          fi
          if [ ! -s release.keystore ] && [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > release.keystore
          fi
          if [ ! -f release.keystore ]; then
            echo "::error::Signing key missing. Add the KEYSTORE_BASE64 secret (or KEYSTORE_BASE64.txt) to the repository."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then
            echo "::error::The KEYSTORE_PASSWORD secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KS_PASS" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          cp release.keystore ecole-eyes/android/app/release.keystore
          echo "Signing key OK"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: ecole-eyes/android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=speakingpretest \
            -Pandroid.injected.signing.key.password="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../EcoleEyes.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ecole-eyes-apk
          path: ecole-eyes/EcoleEyes.apk

      - name: Publish to GitHub Releases (permanent download link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ecole-eyes-1.${{ github.run_number }}
          name: école eyes 1.${{ github.run_number }}
          make_latest: false   # the Speaking Pre-Test APK stays the "latest" download
          files: ecole-eyes/EcoleEyes.apk
          body: |
            تطبيق école eyes للمكفوفين: حمّل الملف EcoleEyes.apk على هاتف أندرويد واضغط «تثبيت»، ثم اسمح بالميكروفون والكاميرا.
            école eyes for Android: download EcoleEyes.apk, tap Install, then allow the microphone and the camera.
