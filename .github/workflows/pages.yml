name: Publish website (iPhone + automatic correction)

# Publishes the app as a website at https://djilalilakehal0-gif.github.io/speaking-pretest/
# together with the speech-recognition model (Whisper tiny, ~40 MB) used by the
# teacher's "Auto-correct" button. Runs after every upload to the main branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy the app
        run: |
          mkdir -p _site
          cp -r www/. _site/
          # old links that end with /www/ keep working
          mkdir -p _site/www
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../"><a href="../">Speaking Pre-Test</a>' > _site/www/index.html
          touch _site/.nojekyll

      - name: Build and add the djilali store landing
        run: |
          cd djilali
          npm ci
          npm run build
          cd "$GITHUB_WORKSPACE"
          mkdir -p _site/djilali
          cp -r djilali/dist/. _site/djilali/

      - name: Build and add the NAPOLITIME restaurant site
        env:
          VITE_ORDER_ENDPOINT: ${{ vars.NAPOLITIME_ORDER_ENDPOINT }}
          VITE_NEWSLETTER_ENDPOINT: ${{ vars.NAPOLITIME_NEWSLETTER_ENDPOINT }}
        run: |
          cd napolitime
          npm ci
          npm run build
          cd "$GITHUB_WORKSPACE"
          mkdir -p _site/napolitime
          cp -r napolitime/dist/. _site/napolitime/

      - name: Add the AXON motion research page
        # A single static file (three.js loads from the jsDelivr CDN), served at /speaking-pretest/axon/.
        run: |
          mkdir -p _site/axon
          cp axon/index.html _site/axon/

      - name: Add the Melli 3D bee landing page
        # A single static file (three.js loads from the jsDelivr CDN), served at /speaking-pretest/melli/.
        run: |
          mkdir -p _site/melli
          cp melli/index.html _site/melli/

      - name: Add the DJILALI developer site (3D, FR/EN/AR)
        # A single static file (three.js loads from the jsDelivr CDN), served at /speaking-pretest/dev/.
        run: |
          mkdir -p _site/dev
          cp dev/index.html _site/dev/

      - name: Add the VirtualFit spatial try-on page
        # A single static file (room and garment images load from images.higgs.ai; the five model photos ship beside it), served at /speaking-pretest/virtualfit/.
        run: |
          mkdir -p _site/virtualfit
          cp virtualfit/index.html virtualfit/model-*.webp _site/virtualfit/

      - name: Redirect the old portfolio address to djilali.pages.dev
        # The portfolio now lives on Cloudflare Pages (https://djilali.pages.dev, built from portfolio/).
        # Old links (/portfolio/, /portfolio/fr/, /portfolio/ar/) forward there, keeping the language and #section.
        run: |
          NEW=https://djilali.pages.dev
          for p in "" fr/ ar/; do
            mkdir -p "_site/portfolio/$p"
            cat > "_site/portfolio/${p}index.html" <<HTML
          <!doctype html>
          <html lang="${p%/}"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>DJILALI</title>
          <link rel="canonical" href="$NEW/$p">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$NEW/$p">
          <script>location.replace("$NEW/$p" + location.hash)</script>
          </head><body style="background:#04060d;color:#eef1ff;font-family:system-ui;text-align:center;padding:40px">
          <p><a style="color:#7aa2ff" href="$NEW/$p">$NEW/$p</a></p>
          </body></html>
          HTML
          done
          sed -i '0,/lang=""/s//lang="en"/' _site/portfolio/index.html
          cat _site/portfolio/ar/index.html

      - name: Add the speech-recognition model (Whisper tiny)
        run: |
          mkdir -p /tmp/m && cd /tmp/m
          npm pack sts-whisper-tiny@1.0.0
          tar -xzf sts-whisper-tiny-1.0.0.tgz
          npm install --no-save --ignore-scripts @huggingface/transformers@3.7.5
          cd "$GITHUB_WORKSPACE"
          mkdir -p _site/asr/models
          cp -r /tmp/m/package/models/Xenova _site/asr/models/
          D=/tmp/m/node_modules/@huggingface/transformers/dist
          cp $D/transformers.min.js $D/ort-wasm-simd-threaded.jsep.mjs $D/ort-wasm-simd-threaded.jsep.wasm _site/asr/
          ls -la _site/asr _site/asr/models/Xenova/whisper-tiny/onnx
          test -f _site/asr/models/Xenova/whisper-tiny/onnx/decoder_model_merged_quantized.onnx
          test -f _site/asr/models/Xenova/whisper-tiny/onnx/encoder_model_quantized.onnx

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
