name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:       # test build on pull requests (nothing is published)
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the IPA to GitHub Releases

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 3.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Add microphone permission and Files app access
        run: |
          P=ios/App/App/Info.plist
          # Without this text iOS closes the app the first time it asks for the microphone
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'The app records your spoken answers. يسجّل التطبيق إجاباتك الشفهية.'" $P
          # Saved answers (Documents/SpeakingPreTest) show up in the Files app under "On My iPhone"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $P
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $P
          plutil -p $P

      - name: Set version (each build gets a higher number)
        run: |
          X=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/" $X
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD;/" $X
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" $X

      - name: Generate app icon and splash from logo
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'

      - name: Sync web code
        run: npx cap sync ios

      - name: Prepare Apple signing (optional)
        id: sign
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          # With an Apple Developer certificate and profile the build is signed; without them it is unsigned
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "No Apple signing secrets: building an unsigned IPA (install it with Sideloadly or AltStore)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC=$RUNNER_TEMP/sign.keychain-db
          KC_PASS=$(uuidgen)
          printf '%s' "$P12_B64" | tr -d ' \r\n' | base64 -D > $RUNNER_TEMP/cert.p12
          printf '%s' "$PROFILE_B64" | tr -d ' \r\n' | base64 -D > $RUNNER_TEMP/app.mobileprovision
          security create-keychain -p "$KC_PASS" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KC_PASS" $KC
          if ! security import $RUNNER_TEMP/cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k $KC; then
            echo "::error::Could not open the certificate. Check IOS_CERT_P12_BASE64 and IOS_CERT_PASSWORD."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" $KC > /dev/null
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')

          security cms -D -i $RUNNER_TEMP/app.mobileprovision > $RUNNER_TEMP/profile.plist
          PB=/usr/libexec/PlistBuddy
          UUID=$($PB -c "Print :UUID" $RUNNER_TEMP/profile.plist)
          TEAM=$($PB -c "Print :TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $RUNNER_TEMP/app.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          # The kind of profile decides how the IPA is exported
          if $PB -c "Print :ProvisionsAllDevices" $RUNNER_TEMP/profile.plist > /dev/null 2>&1; then
            METHOD=enterprise; IDENTITY="iPhone Distribution"
          elif $PB -c "Print :ProvisionedDevices" $RUNNER_TEMP/profile.plist > /dev/null 2>&1; then
            if [ "$($PB -c 'Print :Entitlements:get-task-allow' $RUNNER_TEMP/profile.plist)" = "true" ]; then
              METHOD=development; IDENTITY="iPhone Developer"
            else
              METHOD=ad-hoc; IDENTITY="iPhone Distribution"
            fi
          else
            METHOD=app-store; IDENTITY="iPhone Distribution"
          fi
          echo "Profile $UUID, team $TEAM, export method $METHOD"

          # Manual signing for the app target only (the plugin frameworks are signed with it on export)
          X=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM; PROVISIONING_PROFILE_SPECIFIER = \"$UUID\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"$IDENTITY\";/" $X

          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.djilali.speakingpretest</key><string>$UUID</string>
            </dict>
          </dict></plist>
          PLIST
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA
        if: steps.sign.outputs.signed == 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive archive
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export
          cp $RUNNER_TEMP/export/*.ipa SpeakingPreTest.ipa

      - name: Build unsigned IPA
        if: steps.sign.outputs.signed != 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app $RUNNER_TEMP/ipa/Payload/
          (cd $RUNNER_TEMP/ipa && zip -qry ../SpeakingPreTest-unsigned.ipa Payload)
          cp $RUNNER_TEMP/SpeakingPreTest-unsigned.ipa SpeakingPreTest-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: speaking-pretest-ipa
          path: SpeakingPreTest*.ipa

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ env.VERSION }}
          name: Speaking Pre-Test iOS ${{ env.VERSION }}
          make_latest: false   # the Android release stays the "latest" download
          files: SpeakingPreTest*.ipa
          body: |
            نسخة آيفون. الملف SpeakingPreTest.ipa موقّع ويُثبَّت مباشرة على الأجهزة المسجّلة في الحساب.
            الملف SpeakingPreTest-unsigned.ipa غير موقّع: ثبّته من الكمبيوتر ببرنامج Sideloadly أو AltStore باستخدام حساب Apple ID.
            iPhone build. A signed SpeakingPreTest.ipa installs on the devices in its profile; SpeakingPreTest-unsigned.ipa must be installed with Sideloadly or AltStore.
