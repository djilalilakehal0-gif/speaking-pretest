name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:       # test build on pull requests (unsigned, nothing is published)
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add microphone, storage and TTS permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n\n    <application#' $M
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
          cat $M

      - name: Limit shared files to the app's share folder
        run: |
          # Answers are shared from cache/share/ only; the default config exposes the whole external storage
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="share" path="share/" />
          </paths>
          XML
          cat android/app/src/main/res/xml/file_paths.xml

      - name: Set version (each build gets a higher number so updates install over the old app)
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" $G
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"3.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G

      - name: Generate app icon and splash from logo
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'

      - name: Sync web code
        run: npx cap sync android

      - name: Test build (pull requests only)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # The key comes from the KEYSTORE_BASE64 secret, or else from KEYSTORE_BASE64.txt in the repository
          if [ ! -f release.keystore ] && [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > release.keystore
          fi
          if [ ! -f release.keystore ] && [ -f KEYSTORE_BASE64.txt ]; then
            tr -d ' \r\n' < KEYSTORE_BASE64.txt | base64 -d > release.keystore
          fi
          if [ ! -f release.keystore ]; then
            echo "::error::Signing key missing. Add the KEYSTORE_BASE64 secret (or KEYSTORE_BASE64.txt) to the repository."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then
            echo "::error::The KEYSTORE_PASSWORD secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KS_PASS" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD is wrong. Copy it again (20 characters, no spaces)."
            exit 1
          fi
          cp release.keystore android/app/release.keystore
          echo "Signing key OK"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=speakingpretest \
            -Pandroid.injected.signing.key.password="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../SpeakingPreTest.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: speaking-pretest-apk
          path: SpeakingPreTest.apk

      - name: Publish to GitHub Releases (permanent download link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.${{ github.run_number }}
          name: Speaking Pre-Test 3.${{ github.run_number }}
          make_latest: true
          files: SpeakingPreTest.apk
          body: |
            تحميل التطبيق: افتح الملف SpeakingPreTest.apk على هاتف أندرويد واضغط «تثبيت».
            Download SpeakingPreTest.apk on an Android phone and tap Install.
